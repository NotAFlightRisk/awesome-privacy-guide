name: 📦 Release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      BOT_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: 📦 Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_BOT: ${{ secrets.BOT_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: bot
        if: env.HAS_BOT == 'true'
        with:
          client-id: Iv23liPIG7E12UlaQMaD
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Zip the site
        run: cd dist && zip -qr ../site.zip .
      - name: Publish the release
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          since=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
          since=${since:-$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' | sort -V | head -n1)}
          [ "$since" = "$TAG" ] && since=
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" \
            ${since:+-f previous_tag_name="$since"} -q .body > notes.md
          gh release create "$TAG" site.zip \
            --title "$TAG" \
            --notes-file notes.md \
            --repo "$GITHUB_REPOSITORY"
          echo "Released $TAG" >> "$GITHUB_STEP_SUMMARY"
