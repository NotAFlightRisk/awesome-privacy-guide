    they're only end-to-end encrypted if you turn on the optional Advanced Data Protection. Apple no
    longer offers that to new users in the UK. Locking a note does end-to-end encrypt it, but notes
    with tags, PDFs, audio or video can't be locked, and neither can notes you share.
