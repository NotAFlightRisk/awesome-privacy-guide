  # The glossary, translated by hand
  Two-factor authentication: Authentification à deux facteurs
  Logging in with your password plus a second thing, like a code from your phone or a security key, so a stolen password isn't enough.: Une connexion qui demande votre mot de passe et un second élément, comme un code sur votre téléphone ou une clé de sécurité, pour qu’un mot de passe volé ne suffise pas.
  ? |
    With two-factor authentication, someone who steals your password still can't get in without your
    second factor. That might be a code texted to you, a code from an authenticator app, a prompt on
    your phone or a hardware security key. Turn it on for anything that matters, starting with your
    email, since that's where most password resets go.

    The options aren't equal. SMS codes are the weakest, because attackers can talk your mobile
    network into moving your number to their SIM (a SIM swap), but they still beat nothing.
    Authenticator apps are better. Phone prompts can be abused by attackers who spam you with
    requests until you tap "approve". Passkeys and hardware security keys are the strongest, since
    they won't work on a fake site.

    Whatever you use, save the backup codes somewhere safe, or a lost phone can mean a lost account.
    Keeping your 2FA codes in the same password manager as your passwords is convenient, but if that
    one vault is ever compromised, both factors go with it.
  : |-
    Avec l’authentification à deux facteurs, quelqu’un qui a volé votre mot de passe ne peut pas pour autant se connecter sans votre second facteur. Il peut s’agir d’un code reçu par SMS, d’un code généré par une application d’authentification, d’une demande de validation sur votre téléphone ou d’une clé de sécurité physique. Activez-la pour tout ce qui compte, à commencer par votre compte e-mail, puisque c’est là qu’arrivent la plupart des liens de réinitialisation de mot de passe.

    Toutes les options ne se valent pas. Les codes par SMS sont les plus faibles, car des attaquants peuvent convaincre votre opérateur mobile de transférer votre numéro sur leur carte SIM (on parle de SIM swapping), mais c’est toujours mieux que rien. Les applications d’authentification font mieux. Les demandes de validation sur le téléphone peuvent être détournées par des attaquants qui vous bombardent de notifications jusqu’à ce que vous touchiez « Approuver ». Les clés d’accès et les clés de sécurité physiques sont les plus solides, car elles ne fonctionnent pas sur un faux site.

    Quelle que soit la méthode choisie, rangez les codes de secours en lieu sûr, sinon un téléphone perdu peut vouloir dire un compte perdu. Garder vos codes 2FA dans le même gestionnaire de mots de passe que vos mots de passe est pratique, mais si ce coffre unique est un jour compromis, les deux facteurs tombent avec lui.
  2FA: 2FA
  MFA: MFA
  multi-factor authentication: authentification multifacteur
  two-step verification: vérification en deux étapes
  Anonymity, pseudonymity and privacy: Anonymat, pseudonymat et vie privée
  Privacy hides what you do, anonymity hides who you are, and pseudonymity puts a consistent made-up name between you and what you do.: La vie privée, c’est cacher ce que vous faites ; l’anonymat, cacher qui vous êtes ; et le pseudonymat, placer un nom inventé, toujours le même, entre vous et ce que vous faites.
  ? |
    These get mixed up all the time. Privacy is keeping what you do between you and the people you
    choose, like your messages, files and browsing. Anonymity is nobody knowing who did something,
    even if what was done is public. Pseudonymity sits in between: you act under a consistent name
    that isn't your real one, like a username, so people can recognise you without knowing who you
    are.

    You can have one without the others. An end-to-end encrypted chat with a friend is private but
    not anonymous, since you both know who's on the other end. A post made through Tor on a public
    forum can be anonymous but not private. Most online accounts are pseudonymous, and a pseudonym
    is only as good as the weakest link back to you, like a reused email address, a payment or a
    slip in something you post.

    Real anonymity is hard, and usually takes several tools plus careful habits - a VPN or a "no
    sign-up" app won't get you there alone. Work out which of the three you actually need, as it
    changes which tools make sense.
  : |-
    On les confond tout le temps. La vie privée, c’est garder ce que vous faites entre vous et les personnes de votre choix, comme vos messages, vos fichiers et votre navigation. L’anonymat, c’est que personne ne sache qui a fait quelque chose, même si ce qui a été fait est public. Le pseudonymat se situe entre les deux : vous agissez toujours sous le même nom d’emprunt, comme un nom d’utilisateur, ce qui permet de vous reconnaître sans savoir qui vous êtes.

    Vous pouvez avoir l’un sans les autres. Une conversation chiffrée de bout en bout avec un ami est privée mais pas anonyme, puisque vous savez tous les deux qui se trouve à l’autre bout. Un message publié via Tor sur un forum public peut être anonyme mais pas privé. La plupart des comptes en ligne sont pseudonymes, et un pseudonyme ne vaut que ce que vaut le lien le plus fragile qui remonte jusqu’à vous, comme une adresse e-mail réutilisée, un paiement ou une maladresse dans ce que vous publiez.

    Le véritable anonymat est difficile à atteindre et demande généralement plusieurs outils et des habitudes rigoureuses : ni un VPN ni une application « sans inscription » n’y suffisent à eux seuls. Demandez-vous duquel des trois vous avez vraiment besoin, car ce ne sont pas les mêmes outils qui conviennent.
  Browser fingerprinting: Empreinte numérique du navigateur
  Identifying you by combining lots of small details about your browser and device, which works without cookies and survives clearing them.: Une façon de vous identifier en combinant une foule de petits détails sur votre navigateur et votre appareil, qui fonctionne sans cookies et résiste à leur suppression.
  ? |
    Any page you load can read dozens of small details about your browser: screen size, time zone,
    language, installed fonts, tiny differences in how your hardware draws graphics (canvas
    fingerprinting) and plenty more. None of them identifies you on its own, but together they're
    often close to unique, so trackers can recognise you across sites and visits without storing
    anything on your device.

    That's what makes it awkward. Clearing cookies or opening a private window doesn't change your
    fingerprint, and a VPN only changes your IP address. Piling on extensions and unusual settings
    can make you stand out more, not less.

    There are two main defences. One is to look like everyone else, which is what Tor Browser does
    by making its users as alike as possible. The other is to randomise some of those details so
    your fingerprint keeps changing. You can see how your own browser does with the EFF's
    [Cover Your Tracks](https://coveryourtracks.eff.org/).
  : |-
    Toute page que vous ouvrez peut lire des dizaines de petits détails sur votre navigateur : la taille de l’écran, le fuseau horaire, la langue, les polices installées, d’infimes différences dans la façon dont votre matériel affiche les graphismes (le canvas fingerprinting) et bien d’autres encore. Aucun ne vous identifie à lui seul, mais ensemble, ils sont souvent presque uniques, si bien que les traqueurs peuvent vous reconnaître d’un site à l’autre et d’une visite à l’autre sans rien stocker sur votre appareil.

    C’est bien là le problème. Effacer vos cookies ou ouvrir une fenêtre de navigation privée ne change rien à votre empreinte, et un VPN ne change que votre adresse IP. Multiplier les extensions et les réglages inhabituels peut vous faire remarquer davantage, et non l’inverse.

    Il existe deux grandes parades. La première consiste à ressembler à tout le monde : c’est ce que fait Tor Browser, en rendant ses utilisateurs aussi semblables que possible. La seconde consiste à rendre aléatoires certains de ces détails pour que votre empreinte change sans cesse. Vous pouvez voir comment s’en sort votre propre navigateur avec [Cover Your Tracks](https://coveryourtracks.eff.org/), de l’EFF.
  device fingerprinting: empreinte numérique de l’appareil
  Custom ROM: ROM custom
  A replacement version of Android you install yourself, often with Google's apps and services stripped out to cut down on tracking.: Une version de remplacement d’Android que vous installez vous-même, souvent débarrassée des applications et services de Google pour limiter le pistage.
  ? |
    A custom ROM is an alternative version of Android, built from Google's open source code but put
    together by someone else. Many are "de-Googled", meaning they leave out Google Play Services,
    the background layer that runs with deep access on most Android phones. Installing one usually
    wipes your phone and means switching off its bootloader lock, which normally only lets the
    maker's own software start up.

    There are trade-offs. Some apps lean on Play Services for notifications, maps or payments and
    break or complain without it, though some ROMs offer workarounds like an open source stand-in or
    a sandboxed copy of Google's own. Banking and payment apps may refuse to run at all. Not every
    ROM is as secure as the stock software, either - some can't turn the bootloader lock back on,
    which makes it easier for someone who gets hold of your phone to tamper with it.

    Device support matters most. Check that your exact model is officially supported, how quickly
    security updates arrive and whether the project's still active, since a ROM that stops getting
    updates can leave you worse off than the stock software it replaced.
  : |-
    Une ROM custom est une version alternative d’Android, construite à partir du code open source de Google mais assemblée par quelqu’un d’autre. Beaucoup sont « dégooglisées », c’est-à-dire qu’elles se passent des services Google Play, la couche logicielle qui tourne en arrière-plan avec des accès très étendus sur la plupart des téléphones Android. L’installation efface généralement tout le contenu de votre téléphone et vous oblige à déverrouiller le bootloader, le verrou qui ne laisse normalement démarrer que le logiciel du fabricant.

    Il y a des contreparties. Certaines applications s’appuient sur les services Google Play pour les notifications, les cartes ou les paiements, et cessent de fonctionner ou affichent des avertissements en leur absence, même si quelques ROM proposent des solutions de contournement, comme un remplaçant open source ou une copie des services de Google isolée dans un bac à sable. Les applications bancaires et de paiement peuvent carrément refuser de se lancer. Toutes les ROM ne sont pas non plus aussi sûres que le système d’origine : certaines ne permettent pas de reverrouiller le bootloader, ce qui rend votre téléphone plus facile à trafiquer pour quiconque met la main dessus.

    Le plus important, c’est la compatibilité avec votre appareil. Vérifiez que votre modèle exact est officiellement pris en charge, à quel rythme arrivent les mises à jour de sécurité et si le projet est toujours actif, car une ROM qui ne reçoit plus de mises à jour peut vous laisser en plus mauvaise posture que le système d’origine qu’elle a remplacé.
  de-Googled phone: téléphone dégooglisé
  de-Googled Android: Android dégooglisé
  Data broker: Courtier en données
  A company that collects personal information about you from lots of sources and sells or rents it to whoever's buying.: Une entreprise qui collecte des informations personnelles sur vous auprès de nombreuses sources et les vend ou les loue à qui veut bien payer.
  ? |
    Data brokers build profiles on people without ever dealing with them directly. They pull from
    public records, loyalty schemes, apps, online tracking, purchase histories and other companies'
    databases, then piece it all together: your name, addresses, phone numbers, age, likely income,
    interests and sometimes where you go.

    Those profiles get sold to advertisers, people-search sites, insurers and sometimes police or
    government agencies. You've almost certainly never heard of most of the companies involved,
    which is rather the point.

    You can ask brokers to delete your data - in the UK and EU you've got a legal right to, and some
    US states have similar laws - but there are hundreds of them and your details tend to reappear.
    Paid removal services send the requests for you, though they can't reach every broker. The
    longer-term fix is giving out less in the first place, with email aliases, virtual phone numbers
    and virtual cards.
  : |-
    Les courtiers en données dressent des profils de personnes sans jamais avoir affaire à elles directement. Ils puisent dans les registres publics, les programmes de fidélité, les applications, le pistage en ligne, les historiques d’achat et les bases de données d’autres entreprises, puis assemblent le tout : votre nom, vos adresses, vos numéros de téléphone, votre âge, vos revenus probables, vos centres d’intérêt et parfois les endroits où vous allez.

    Ces profils sont vendus à des annonceurs, à des sites de recherche de personnes, à des assureurs et parfois à la police ou à des administrations. Il y a fort à parier que vous n’avez jamais entendu parler de la plupart des entreprises concernées, et c’est un peu le but.

    Vous pouvez demander aux courtiers de supprimer vos données (au Royaume-Uni et dans l’UE, c’est un droit prévu par la loi, et certains États américains ont des lois similaires), mais ils se comptent par centaines et vos informations ont tendance à réapparaître. Des services de suppression payants envoient les demandes à votre place, mais ils ne peuvent pas atteindre tous les courtiers. La solution à plus long terme, c’est d’en donner moins dès le départ, avec des alias e-mail, des numéros de téléphone virtuels et des cartes bancaires virtuelles.
  information broker: courtier en informations
  data aggregator: agrégateur de données
  Domain Name System: Système de noms de domaine
  The internet's phone book, which turns names like example.com into the IP addresses your device actually connects to.: L’annuaire d’Internet, qui traduit des noms comme example.com en adresses IP, celles auxquelles votre appareil se connecte vraiment.
  ? |
    Before your device can load a site, it asks a DNS resolver for the site's IP address. By default
    that's usually your ISP's resolver, handed out by your router. Ordinary DNS isn't encrypted, so
    your ISP and anyone else on the network can see every domain you look up, even when the site
    itself uses HTTPS. Whoever runs the resolver can also log your lookups, block them or send you
    somewhere else.

    That's why your choice of resolver matters. Switching to a privacy-focused one (ideally over
    encrypted DNS) means your ISP isn't the one keeping a list, and many also block ads, trackers or
    malware for you. The new provider sees your lookups instead, so check its logging policy and
    where it's based.

    Running DNS for your own domain is a separate job, called DNS hosting. That's about publishing
    records so other people can find your website and email, rather than looking things up for
    yourself.
  : |-
    Avant de pouvoir charger un site, votre appareil demande son adresse IP à un résolveur DNS. Par défaut, c’est généralement celui de votre fournisseur d’accès à Internet (FAI), transmis par votre box. Le DNS classique n’est pas chiffré, donc votre FAI et n’importe qui d’autre sur le réseau peuvent voir chaque nom de domaine que vous consultez, même quand le site lui-même utilise HTTPS. Celui qui gère le résolveur peut aussi garder une trace de vos requêtes, les bloquer ou vous rediriger ailleurs.

    C’est pourquoi le choix du résolveur compte. Si vous passez à un résolveur axé sur la confidentialité (idéalement en DNS chiffré), ce n’est plus votre FAI qui tient la liste, et beaucoup bloquent aussi pour vous les publicités, les traqueurs ou les logiciels malveillants. C’est alors le nouveau fournisseur qui voit vos requêtes, donc vérifiez sa politique en matière de logs et le pays où il est établi.

    Gérer le DNS de votre propre nom de domaine est une tout autre affaire, qu’on appelle l’hébergement DNS. Il s’agit alors de publier des enregistrements pour que les autres trouvent votre site web et vos adresses e-mail, et non de trouver des adresses pour vous-même.
  DNS: DNS
  DNS leak: Fuite DNS
  When your DNS lookups go around your VPN, usually to your ISP, giving away the sites you visit while you think you're covered.: Quand vos requêtes DNS contournent votre VPN, généralement vers votre FAI, et trahissent les sites que vous visitez alors que vous vous croyez à l’abri.
  ? |
    On a VPN, your DNS lookups should go through the tunnel to the resolver your VPN uses. A DNS
    leak is when some of them go out the normal way instead, usually to your ISP. Your traffic's
    still encrypted, but your ISP gets a running list of the domains you're visiting, which is a
    good chunk of what you were trying to hide.

    Leaks usually come from your operating system doing its own thing: sending lookups out over
    every network connection it has, using IPv6 when the VPN only handles IPv4, or sticking with a
    DNS server you set by hand.

    Good VPN apps have leak protection built in and switched on. To check, connect to your VPN and
    run a DNS leak test - if any of the servers it lists belong to your ISP, you've got a leak. A
    kill switch that blocks everything outside the tunnel usually stops it too.
  : |-
    Avec un VPN, vos requêtes DNS devraient passer par le tunnel jusqu’au résolveur qu’utilise votre VPN. On parle de fuite DNS quand certaines d’entre elles sortent par le chemin habituel, généralement vers votre FAI. Votre trafic reste chiffré, mais votre FAI reçoit, au fur et à mesure, la liste des domaines que vous visitez, ce qui représente une bonne partie de ce que vous cherchiez à cacher.

    Les fuites viennent le plus souvent de votre système d’exploitation qui n’en fait qu’à sa tête : il envoie les requêtes sur toutes les connexions réseau dont il dispose, utilise l’IPv6 alors que le VPN ne gère que l’IPv4, ou s’en tient à un serveur DNS que vous avez configuré à la main.

    Les bonnes applications VPN intègrent une protection contre les fuites, activée par défaut. Pour vérifier, connectez-vous à votre VPN et lancez un test de fuite DNS : si l’un des serveurs affichés appartient à votre FAI, vous avez une fuite. Un kill switch qui bloque tout ce qui passe en dehors du tunnel l’empêche généralement aussi.
  End-to-end encryption: Chiffrement de bout en bout
  Encryption where only the people at each end hold the keys, so the company in the middle can't read your messages or files.: Un chiffrement où seules les personnes à chaque bout détiennent les clés, si bien que l’entreprise qui se trouve entre les deux ne peut lire ni vos messages ni vos fichiers.
  ? |
    With end-to-end encryption, your message is encrypted on your device and only decrypted on the
    recipient's. The service in between just passes along scrambled data it has no key for, so
    anything it leaks in a breach or is forced to hand over is gibberish. The Signal Protocol is the
    best-known way of doing it, and plenty of apps use it.

    What it doesn't hide is metadata - who you talked to, when and how often. It can't help if
    someone gets into your phone, and it won't stop the person you're talking to from taking
    screenshots. Backups are a common gap too: if your chat history goes to the cloud without the
    same encryption, that copy isn't protected.

    In a closed source app you're taking the company's word that it's really end-to-end, so look for
    open source apps, a published security audit and a way to check you're talking to the right
    person (usually by comparing a safety number or scanning a QR code). Be wary of "encrypted" on
    its own, as it often only means encrypted in transit, which the company can still read.
  : |-
    Avec le chiffrement de bout en bout, votre message est chiffré sur votre appareil et n’est déchiffré que sur celui du destinataire. Le service qui se trouve entre les deux se contente de transmettre des données brouillées dont il n’a pas la clé : ce qui fuite lors d’un piratage, ou ce qu’on l’oblige à remettre, reste donc illisible. Le protocole Signal est la méthode la plus connue, et de nombreuses applications l’utilisent.

    Ce qu’il ne cache pas, ce sont les métadonnées : avec qui vous avez parlé, quand et à quelle fréquence. Il ne vous protège pas si quelqu’un accède à votre téléphone, et il n’empêchera pas votre interlocuteur de faire des captures d’écran. Les sauvegardes sont aussi une faille courante : si votre historique de discussion part dans le cloud sans le même chiffrement, cette copie n’est pas protégée.

    Avec une application au code source fermé, vous devez croire l’entreprise sur parole quand elle dit que le chiffrement est vraiment de bout en bout. Cherchez donc des applications open source, un audit de sécurité publié et un moyen de vérifier que vous parlez à la bonne personne (généralement en comparant un numéro de sécurité ou en scannant un QR code). Méfiez-vous du mot « chiffré » employé seul : il veut souvent dire chiffré en transit uniquement, ce qui n’empêche pas l’entreprise de lire vos données.
  E2EE: E2EE
  E2E encryption: chiffrement E2E
  Email alias: Alias e-mail
  A separate email address that forwards to your real inbox, so each site gets its own address and you can switch it off if it gets spammed.: Une adresse e-mail distincte qui redirige les messages vers votre vraie boîte de réception, pour que chaque site ait sa propre adresse et que vous puissiez la désactiver si elle se met à recevoir du spam.
  ? |
    An alias is an address that just forwards mail to your real inbox. Use a different one for every
    site and your real address never gets out. If one starts getting spam, you'll know exactly who
    leaked or sold it, and you can turn that alias off without touching anything else. Many alias
    services also let you reply from the alias, so the other side never sees your real address.

    Aliases make it much harder for data brokers and marketers to join up your accounts by email
    address, and they limit the fallout when a site gets breached. Plus addressing
    (`yourname+shop@example.com`) is a weaker version of the same trick, as your real address is
    right there for anyone who strips off the plus bit.

    The alias provider sees every email that passes through, so pick one you'd trust with your
    inbox. Using your own domain means you can switch providers later without losing your aliases,
    and some services will encrypt forwarded mail with your PGP key. Aliases aren't the same as
    disposable inboxes, which are often public and short-lived.
  : |-
    Un alias est une adresse qui se contente de rediriger les messages vers votre vraie boîte de réception. Utilisez-en un différent pour chaque site, et votre vraie adresse ne circule jamais. Si l’un d’eux se met à recevoir du spam, vous saurez exactement qui a laissé fuiter l’adresse ou l’a vendue, et vous pourrez désactiver cet alias sans toucher au reste. Beaucoup de services d’alias vous permettent aussi de répondre depuis l’alias, pour que votre correspondant ne voie jamais votre vraie adresse.

    Les alias compliquent beaucoup la tâche des courtiers en données et des spécialistes du marketing qui veulent relier vos comptes grâce à votre adresse e-mail, et ils limitent les dégâts quand un site se fait pirater. Les adresses avec un « + » (`yourname+shop@example.com`) sont une version moins efficace de la même astuce, puisque votre vraie adresse est là, sous les yeux de quiconque efface le « + » et ce qui le suit.

    Le fournisseur d’alias voit passer chaque e-mail, alors choisissez-en un à qui vous confieriez votre boîte de réception. Avec votre propre nom de domaine, vous pourrez changer de fournisseur plus tard sans perdre vos alias, et certains services chiffrent les messages redirigés avec votre clé PGP. Les alias ne sont pas la même chose que les adresses e-mail jetables, qui sont souvent publiques et éphémères.
  masked email: adresse e-mail masquée
  forwarding address: adresse de redirection
  email aliasing: alias mail
  DNS over HTTPS and DNS over TLS: DNS over HTTPS et DNS over TLS
  Ways of encrypting your DNS lookups, so your ISP or the network you're on can't read or tamper with them on the way to the resolver.: Des moyens de chiffrer vos requêtes DNS, pour que votre FAI ou le réseau que vous utilisez ne puisse ni les lire ni les modifier en chemin vers le résolveur.
  ? |
    Both protect your lookups between your device and the resolver. DNS over HTTPS (DoH) sends them
    as ordinary web traffic, which makes it harder to spot or block. DNS over TLS (DoT) uses its own
    port, which is tidier but easier for a network to block. DNSCrypt is an older protocol that does
    a similar job. Most browsers and operating systems support at least one of them, and on Android
    it's the "Private DNS" setting.

    They only hide your lookups from the network in between. The resolver still sees every one, so
    you need to trust whoever runs it. Your ISP can also still see the IP addresses you connect to,
    and often the site's name too, which goes out unencrypted at the start of most secure
    connections. It's a sensible upgrade, but it won't hide your browsing on its own.

    If you use a VPN, your lookups already travel inside the tunnel, so the VPN's own resolver is
    usually the simplest choice.
  : |-
    Les deux protègent vos requêtes entre votre appareil et le résolveur. DNS over HTTPS (DoH) les envoie comme du trafic web ordinaire, ce qui les rend plus difficiles à repérer ou à bloquer. DNS over TLS (DoT) utilise son propre port, ce qui est plus propre mais plus facile à bloquer pour un réseau. DNSCrypt est un protocole plus ancien qui remplit un rôle similaire. La plupart des navigateurs et des systèmes d’exploitation prennent en charge au moins l’un d’eux, et sur Android, c’est le paramètre « DNS privé ».

    Ils ne cachent vos requêtes qu’au réseau intermédiaire. Le résolveur, lui, les voit toutes, donc il faut faire confiance à celui qui le gère. Votre FAI peut aussi toujours voir les adresses IP auxquelles vous vous connectez, et souvent le nom du site, qui passe en clair au début de la plupart des connexions sécurisées. C’est une amélioration utile, mais à elle seule, elle ne cachera pas votre navigation.

    Si vous utilisez un VPN, vos requêtes passent déjà par le tunnel, donc le résolveur du VPN est généralement le choix le plus simple.
  DoH: DoH
  DoT: DoT
  encrypted DNS: DNS chiffré
  Encryption at rest: Chiffrement au repos
  Encrypting data while it's stored on a disk, phone or server, so it's unreadable if the hardware is lost, stolen or thrown out.: Le chiffrement des données pendant qu’elles sont stockées sur un disque, un téléphone ou un serveur, pour qu’elles restent illisibles si le matériel est perdu, volé ou jeté.
  ? |
    Encryption at rest protects stored data. On your own devices that means full-disk encryption: if
    your laptop's nicked or your phone goes missing, nobody can read what's on it without your
    password or PIN. Phones do it by default these days, and the main desktop operating systems have
    it built in, though it isn't always switched on.

    It does most of its work while the device is off or locked. Once you've logged in, your data is
    readable to you and to any malware you've picked up. For online services, "encrypted at rest"
    usually means the company encrypts its disks and keeps the keys itself. That stops someone
    walking out of a data centre with a hard drive, but the company can still read your data, and so
    can anyone with a court order.

    If you want a provider that can't read your stuff, you need zero-knowledge or end-to-end
    encryption instead, or to encrypt files yourself before you upload them.
  : |-
    Le chiffrement au repos protège les données stockées. Sur vos propres appareils, cela veut dire le chiffrement intégral du disque : si on vous vole votre ordinateur portable ou si votre téléphone disparaît, personne ne peut lire ce qu’il contient sans votre mot de passe ou votre code PIN. Les téléphones le font par défaut aujourd’hui, et les principaux systèmes d’exploitation pour ordinateur l’intègrent, même s’il n’est pas toujours activé.

    Il protège surtout quand l’appareil est éteint ou verrouillé. Une fois votre session ouverte, vos données sont lisibles pour vous et pour tout logiciel malveillant que vous auriez attrapé. Pour les services en ligne, « chiffré au repos » veut généralement dire que l’entreprise chiffre ses disques et garde les clés elle-même. Cela empêche quelqu’un de repartir d’un centre de données avec un disque dur sous le bras, mais l’entreprise peut toujours lire vos données, tout comme n’importe qui muni d’une décision de justice.

    Si vous voulez un fournisseur qui ne puisse pas lire vos données, il vous faut plutôt un chiffrement à connaissance zéro ou de bout en bout, ou bien chiffrer vous-même vos fichiers avant de les mettre en ligne.
  storage encryption: chiffrement du stockage
  full-disk encryption: chiffrement intégral du disque
  Encryption in transit: Chiffrement en transit
  Encrypting data while it travels between your device and a server, so people on the network can't read it, though the server still can.: Le chiffrement des données pendant leur trajet entre votre appareil et un serveur, pour que personne sur le réseau ne puisse les lire, même si le serveur, lui, le peut toujours.
  ? |
    Encryption in transit protects data on its way from A to B. It's what the S in HTTPS is about:
    TLS (the successor to SSL) encrypts the connection, so your ISP, the coffee shop Wi-Fi or anyone
    else in the middle can't read or change what you send. Almost every site and app uses it now,
    and one that doesn't is a red flag.

    But it stops at the server. The company decrypts your data when it arrives and can read, scan or
    store it, or be made to hand it over. So when a service says your data is "encrypted", that
    often just means this, maybe with encryption at rest on top. For a provider that can't read your
    stuff, you need end-to-end or zero-knowledge encryption.

    Email is a special case. Mail between providers is usually encrypted in transit too, but only
    when both servers support it, so some messages still cross the internet in plain text. Even when
    it's encrypted, every server that handles it can read it.
  : |-
    Le chiffrement en transit protège les données sur leur trajet de A à B. C’est tout le sens du S de HTTPS : TLS (le successeur de SSL) chiffre la connexion pour que votre FAI, le Wi-Fi du café ou n’importe qui d’autre entre les deux ne puisse ni lire ni modifier ce que vous envoyez. Presque tous les sites et applications l’utilisent aujourd’hui, et quand l’un d’eux s’en passe, c’est mauvais signe.

    Mais il s’arrête au serveur. L’entreprise déchiffre vos données à leur arrivée et peut les lire, les analyser ou les conserver, ou être contrainte de les remettre. Alors, quand un service dit que vos données sont « chiffrées », il ne s’agit souvent que de cela, peut-être avec un chiffrement au repos en plus. Pour un fournisseur qui ne puisse pas lire vos données, il vous faut un chiffrement de bout en bout ou à connaissance zéro.

    L’e-mail est un cas à part. Les messages échangés entre fournisseurs sont généralement chiffrés en transit eux aussi, mais seulement si les deux serveurs le prennent en charge, si bien que certains traversent encore Internet en clair. Et même chiffrés, ils restent lisibles par chaque serveur qui les traite.
  TLS encryption: chiffrement TLS
  SSL encryption: chiffrement SSL
  transport encryption: chiffrement de transport
  Federation: Fédération
  Lots of independently run servers that talk to each other, so you can pick (or run) your own server and still reach everyone else.: De nombreux serveurs gérés indépendamment qui communiquent entre eux, pour que vous puissiez choisir (ou héberger) le vôtre et joindre quand même tout le monde.
  ? |
    Email is the classic example of federation: you can be with one provider and email someone with
    another, and neither of them is in charge. Matrix (for chat) and Mastodon (for social media)
    work the same way, each made up of thousands of servers that speak a shared protocol. Mastodon
    and everything else built on ActivityPub are known together as the fediverse.

    No single company owns the network, so nobody can sell it, fill it with ads or lock you in, and
    if you don't like your server's rules you can move. The flip side is that your server's admins
    can see anything it stores unencrypted, and whatever you send to people on other servers gets
    copied there too. Deleting it later asks those servers to delete their copies, but nothing
    forces them to.

    So pick a server run by people you trust, or run your own. And check what's end-to-end
    encrypted - on some federated platforms private messages are, and on others the admins of both
    servers can read them.
  : |-
    L’e-mail est l’exemple classique de fédération : vous pouvez être chez un fournisseur et écrire à quelqu’un qui est chez un autre, sans qu’aucun des deux ne soit aux commandes. Matrix (pour la messagerie instantanée) et Mastodon (pour les réseaux sociaux) fonctionnent de la même façon, chacun étant composé de milliers de serveurs qui utilisent un protocole commun. Mastodon et tout ce qui repose sur ActivityPub forment ensemble ce qu’on appelle le fédivers.

    Aucune entreprise ne possède à elle seule le réseau, donc personne ne peut le vendre, le remplir de publicités ou vous y enfermer, et si les règles de votre serveur ne vous plaisent pas, vous pouvez déménager. Le revers de la médaille, c’est que les administrateurs de votre serveur peuvent voir tout ce qu’il stocke sans chiffrement, et que tout ce que vous envoyez à des personnes sur d’autres serveurs y est aussi copié. Si vous le supprimez plus tard, ces serveurs sont invités à effacer leurs copies, mais rien ne les y oblige.

    Choisissez donc un serveur géré par des gens en qui vous avez confiance, ou hébergez le vôtre. Et vérifiez ce qui est chiffré de bout en bout : sur certaines plateformes fédérées, les messages privés le sont, et sur d’autres, les administrateurs des deux serveurs peuvent les lire.
  federated networks: réseaux fédérés
  Five Eyes and Fourteen Eyes: Five Eyes et Fourteen Eyes
  An intelligence-sharing alliance between the UK, US, Canada, Australia and New Zealand, plus wider groups known as the Nine and Fourteen Eyes.: Une alliance de partage de renseignements entre le Royaume-Uni, les États-Unis, le Canada, l’Australie et la Nouvelle-Zélande, avec des groupes plus larges connus sous le nom de Nine Eyes et Fourteen Eyes.
  ? |
    The [Five Eyes](https://en.wikipedia.org/wiki/Five_Eyes) grew out of the UKUSA Agreement of
    1946, and today the UK, US, Canada, Australia and New Zealand share signals intelligence through
    it. Wider, looser groups have been reported too. The Nine Eyes adds Denmark, France, the
    Netherlands and Norway, and the Fourteen Eyes adds Belgium, Germany, Italy, Spain and Sweden.

    You'll see it all over VPN marketing, usually as "based outside the 14 Eyes". These countries do
    work closely together, and some have sweeping surveillance laws. But it isn't a magic line.
    Intelligence agencies spy on foreign communications anyway, and every country has some way of
    making a business on its own soil cooperate.

    What a provider can be forced to hand over, and what it actually keeps, matter far more than
    which list its country is on. A service that only ever holds encrypted data it can't read is in
    a much better spot wherever it's based.
  : |-
    Les [Five Eyes](https://en.wikipedia.org/wiki/Five_Eyes) sont issus de l’accord UKUSA de 1946, et aujourd’hui, le Royaume-Uni, les États-Unis, le Canada, l’Australie et la Nouvelle-Zélande partagent dans ce cadre leur renseignement d’origine électromagnétique. On fait aussi état de groupes plus larges et moins formels. Les Nine Eyes y ajoutent le Danemark, la France, les Pays-Bas et la Norvège, et les Fourteen Eyes la Belgique, l’Allemagne, l’Italie, l’Espagne et la Suède.

    Vous verrez ces noms partout dans le marketing des VPN, généralement sous la forme « basé hors des 14 Eyes ». Ces pays travaillent bel et bien en étroite collaboration, et certains ont des lois de surveillance très étendues. Mais ce n’est pas une frontière magique. Les services de renseignement espionnent de toute façon les communications étrangères, et chaque pays dispose d’un moyen ou d’un autre d’obliger une entreprise établie sur son sol à coopérer.

    Ce qu’un fournisseur peut être contraint de remettre, et ce qu’il conserve réellement, comptent bien plus que la liste sur laquelle figure son pays. Un service qui ne détient jamais que des données chiffrées qu’il ne peut pas lire est en bien meilleure posture, où qu’il soit établi.
  FVEY: FVEY
  5 Eyes: 5 Eyes
  14 Eyes: 14 Eyes
  Forward secrecy: Confidentialité persistante
  Giving each session or message its own short-lived keys, so a key stolen later can't decrypt all your old conversations.: Le fait de donner à chaque session ou à chaque message ses propres clés éphémères, pour qu’une clé volée plus tard ne permette pas de déchiffrer toutes vos anciennes conversations.
  ? |
    Without forward secrecy, everything encrypted with a long-term key is only as safe as that key.
    If someone records your encrypted traffic today and steals the key in five years, they can go
    back and decrypt all of it. With forward secrecy, each session (or, in good messaging apps, each
    message) uses short-lived keys that get thrown away, so old traffic stays scrambled even if a
    long-term key leaks.

    Modern HTTPS (TLS 1.3) has it built in, and so does the Signal Protocol, which goes a step
    further and can recover after a key's been stolen, so future messages become safe again. PGP
    email doesn't have forward secrecy, which is one of the main criticisms of it.

    It's not something you can usually switch on yourself, as it's down to the protocol an app uses.
    When you're comparing messaging apps, having it is a good sign the encryption is modern and well
    designed.
  : |-
    Sans confidentialité persistante, tout ce qui est chiffré avec une clé à long terme n’est pas plus sûr que cette clé. Si quelqu’un enregistre votre trafic chiffré aujourd’hui et vole la clé dans cinq ans, il peut reprendre tout ce trafic et le déchiffrer. Avec la confidentialité persistante, chaque session (ou, dans les bonnes applications de messagerie, chaque message) utilise des clés éphémères qui sont ensuite jetées, si bien que l’ancien trafic reste illisible même si une clé à long terme finit par fuiter.

    Le HTTPS moderne (TLS 1.3) l’intègre d’office, tout comme le protocole Signal, qui va encore plus loin et sait se remettre du vol d’une clé : les messages suivants redeviennent alors sûrs. PGP, utilisé pour l’e-mail, n’offre pas de confidentialité persistante, et c’est l’un des principaux reproches qu’on lui fait.

    Ce n’est généralement pas quelque chose que vous pouvez activer vous-même, car tout dépend du protocole qu’utilise l’application. Quand vous comparez des applications de messagerie, sa présence est bon signe : elle indique un chiffrement moderne et bien conçu.
  perfect forward secrecy: perfect forward secrecy
  PFS: PFS
  Free and open source software: Logiciel libre et open source
  Software that's free as in freedom - you can run, study, change and share it - which in practice nearly always means open source too.: Un logiciel que vous êtes libre d’utiliser, d’étudier, de modifier et de partager, et qui, en pratique, est presque toujours open source aussi.
  ? |
    The "free" in FOSS is about freedom, not price, or as the old line goes, "free as in speech, not
    as in beer". The Free Software Foundation
    [defines it](https://www.gnu.org/philosophy/free-sw.html) as four freedoms: to run the program
    however you like, to study and change how it works, to share copies, and to share your changed
    versions. FLOSS (free/libre and open source software) means the same thing, with "libre" added
    to dodge the price confusion.

    In practice, nearly all free software is open source and the other way round. The difference is
    mostly philosophy: free software folk see it as an ethical issue, open source folk as a better
    way to build software. Licences split along a different line. Copyleft licences like the GPL
    make anyone who distributes a changed version share their code on the same terms, while
    permissive ones like MIT let people make closed versions.

    The AGPL goes a step further and covers software run as an online service, so anyone hosting a
    modified version has to offer its users the source. On Android, the F-Droid app store only lists
    FOSS apps, and flags the ones with tracking or other anti-features.
  : |-
    Le « free » de FOSS renvoie à la liberté, pas au prix, ou, comme le dit la vieille formule, « free as in speech, not as in beer » (au sens de la liberté d’expression, pas de la bière gratuite). La Free Software Foundation [définit le logiciel libre](https://www.gnu.org/philosophy/free-sw.html) par quatre libertés : exécuter le programme comme vous le souhaitez, étudier son fonctionnement et le modifier, partager des copies, et partager vos versions modifiées. FLOSS (free/libre and open source software) veut dire la même chose, avec « libre » en plus pour éviter la confusion avec le prix.

    En pratique, presque tous les logiciels libres sont open source, et inversement. La différence est surtout philosophique : les partisans du logiciel libre y voient une question éthique, ceux de l’open source une meilleure façon de concevoir des logiciels. Les licences, elles, se divisent autrement. Les licences copyleft comme la GPL obligent quiconque distribue une version modifiée à partager son code aux mêmes conditions, tandis que les licences permissives comme la licence MIT permettent d’en faire des versions fermées.

    L’AGPL va encore plus loin et couvre les logiciels proposés sous forme de service en ligne : quiconque héberge une version modifiée doit mettre le code source à la disposition de ses utilisateurs. Sur Android, la boutique d’applications F-Droid ne référence que des applications FOSS, et signale celles qui contiennent du pistage ou d’autres anti-fonctionnalités.
  FOSS: FOSS
  FLOSS: FLOSS
  free software: logiciel libre
  libre software: le libre
  Hardware security key: Clé de sécurité physique
  A small USB or NFC device you tap to log in, which proves it's really you and won't work on phishing sites.: Un petit appareil USB ou NFC que vous touchez pour vous connecter, qui prouve que c’est bien vous et ne fonctionne pas sur les sites d’hameçonnage.
  ? |
    A hardware security key is a small device, usually on your keyring, that plugs into a USB port
    or taps against your phone over NFC. It holds cryptographic keys that never leave it, so malware
    on your computer can't copy them. You can use it as a second factor alongside your password, or
    on newer keys to hold passkeys and skip the password entirely.

    Like passkeys, security keys check the website's real address before they'll sign you in, so
    they're one of the few logins that phishing can't easily beat. That's why they're the usual
    advice for anyone likely to be targeted, like journalists, activists or people with money or
    access worth stealing. Some can also generate TOTP codes, hold PGP keys or work as a smart card.

    Buy two and register both, and keep the spare somewhere safe, because losing your only key means
    relying on recovery codes (or getting locked out). Check that the services you care about
    support them and let you add more than one. Keys only have room for a limited number of
    passkeys, so check the spec if you plan to store a lot.
  : |-
    Une clé de sécurité physique est un petit appareil, généralement accroché à votre trousseau, qui se branche sur un port USB ou que vous approchez de votre téléphone pour communiquer en NFC. Elle contient des clés cryptographiques qui ne la quittent jamais : un logiciel malveillant sur votre ordinateur ne peut donc pas les copier. Vous pouvez l’utiliser comme second facteur en plus de votre mot de passe ou, sur les modèles récents, y stocker des clés d’accès et vous passer complètement de mot de passe.

    Comme les clés d’accès, les clés de sécurité vérifient la véritable adresse du site avant de vous connecter, ce qui en fait l’une des rares méthodes de connexion que l’hameçonnage ne peut pas facilement déjouer. C’est pourquoi on les conseille généralement à toute personne susceptible d’être ciblée, comme les journalistes, les militants ou les personnes dont l’argent ou les accès valent la peine d’être volés. Certaines peuvent aussi générer des codes TOTP, stocker des clés PGP ou servir de carte à puce.

    Achetez-en deux, enregistrez-les toutes les deux et gardez celle de secours en lieu sûr, car si vous perdez votre seule clé, il ne vous reste que les codes de récupération (ou plus d’accès du tout). Vérifiez que les services qui comptent pour vous les prennent en charge et vous permettent d’en ajouter plusieurs. Une clé ne peut contenir qu’un nombre limité de clés d’accès, alors consultez sa fiche technique si vous comptez en stocker beaucoup.
  security key: clé de sécurité
  FIDO key: clé FIDO
  U2F key: clé U2F
  Jurisdiction: Juridiction
  The country whose laws a service has to follow, which decides who can demand your data and what the company can be made to do.: Le pays dont un service doit respecter les lois, ce qui détermine qui peut exiger vos données et ce que l’entreprise peut être contrainte de faire.
  ? |
    A service's jurisdiction is the country (or countries) whose laws it has to follow, usually
    where it's registered plus wherever it has servers or staff. Those laws decide whether it can be
    made to hand over your data, keep logs it otherwise wouldn't, monitor a particular user, or keep
    quiet about any of it. They also set your rights - in the UK and EU, for example, you can ask
    for a copy of your data or have it deleted.

    Privacy-focused companies often base themselves somewhere with strong privacy laws, and say so
    loudly. That's a real plus, but it has limits. Providers in privacy-friendly countries have
    still been ordered to log specific users, and police in one country can ask another to get data
    on their behalf.

    Jurisdiction matters most when a company holds data it can read. If your data's end-to-end
    encrypted and the provider keeps little else, there's much less for any court to get hold of.
  : |-
    La juridiction d’un service, c’est le ou les pays dont il doit respecter les lois, généralement celui où il est immatriculé, ainsi que tous ceux où il a des serveurs ou du personnel. Ces lois déterminent s’il peut être contraint de remettre vos données, de conserver des logs qu’il ne garderait pas autrement, de surveiller un utilisateur en particulier, ou de garder le silence sur tout cela. Elles fixent aussi vos droits : au Royaume-Uni et dans l’UE, par exemple, vous pouvez demander une copie de vos données ou leur suppression.

    Les entreprises axées sur la confidentialité s’installent souvent dans un pays aux lois solides en matière de vie privée, et le font savoir haut et fort. C’est un vrai plus, mais qui a ses limites. Des fournisseurs établis dans des pays protecteurs de la vie privée ont tout de même été contraints de conserver des logs sur certains utilisateurs, et la police d’un pays peut demander à un autre pays de récupérer des données pour son compte.

    La juridiction compte surtout quand une entreprise détient des données qu’elle peut lire. Si vos données sont chiffrées de bout en bout et que le fournisseur ne garde pas grand-chose d’autre, un tribunal, quel qu’il soit, aura beaucoup moins à récupérer.
  Kill switch: Kill switch
  A VPN setting that cuts off your internet if the VPN connection drops, so nothing gets sent outside the tunnel.: Un réglage du VPN qui coupe votre accès à Internet si la connexion au VPN tombe, pour que rien ne soit envoyé en dehors du tunnel.
  ? |
    VPN connections drop more often than you'd think, like when you switch networks, wake your
    laptop or a server goes down. Without a kill switch your device just carries on over your normal
    connection, often without telling you, and your real IP address and browsing are out in the
    open. A kill switch blocks all traffic until the VPN's back.

    They're not all equal. Some only work while the VPN app's running, so if the app crashes, your
    protection goes with it. Better ones set firewall rules in your operating system that stay in
    place even if the app doesn't, and some block traffic from the moment your device starts up. On
    Android, look for the built-in "Always-on VPN" and "Block connections without VPN" settings.

    Check whether it's on by default, since it isn't always. Some apps also have a stricter mode
    that blocks everything unless the VPN's connected, even after you've switched the VPN off
    yourself.
  : |-
    Les connexions VPN se coupent plus souvent que vous ne le pensez, par exemple quand vous changez de réseau, quand vous sortez votre ordinateur portable de veille ou quand un serveur tombe en panne. Sans kill switch, votre appareil bascule tout simplement sur votre connexion normale, souvent sans vous prévenir, et votre véritable adresse IP comme votre navigation sont à découvert. Un kill switch bloque tout le trafic jusqu’au retour du VPN.

    Tous ne se valent pas. Certains ne fonctionnent que tant que l’application VPN tourne, donc si elle plante, votre protection disparaît avec elle. Les meilleurs définissent dans votre système d’exploitation des règles de pare-feu qui restent en place même si l’application lâche, et certains bloquent le trafic dès le démarrage de votre appareil. Sur Android, cherchez les options intégrées « VPN permanent » et « Bloquer les connexions sans VPN ».

    Vérifiez s’il est activé par défaut, car ce n’est pas toujours le cas. Certaines applications proposent aussi un mode plus strict qui bloque tout tant que le VPN n’est pas connecté, même après que vous l’avez vous-même désactivé.
  VPN kill switch: kill switch VPN
  Know your customer: Connaissance client
  The identity checks that banks, card providers and crypto exchanges have to run before you can use them, usually with a photo ID.: Les vérifications d’identité que les banques, les émetteurs de cartes et les plateformes d’échange de cryptomonnaies doivent effectuer avant que vous puissiez utiliser leurs services, généralement sur présentation d’une pièce d’identité avec photo.
  ? |
    KYC rules are there to fight fraud and money laundering, and they apply to most regulated
    financial services, including banks, card issuers, payment apps and big crypto exchanges.
    Signing up means handing over your name, address and date of birth, often with a photo of your
    ID and a selfie, and the company has to keep those records for years.

    For privacy, that means your real identity is tied to everything you do on the service, and
    copies of your ID are stored in a database that could leak (and some have). Some services
    outside finance ask for ID too, like phone number providers in countries where the law requires
    it.

    Doing without KYC, legally, usually means smaller amounts and fewer features: cash, prepaid
    cards with low limits, peer-to-peer crypto trading or services that don't ask. The rules vary a
    lot by country, so check what applies where you are.
  : |-
    Les règles KYC servent à lutter contre la fraude et le blanchiment d’argent, et s’appliquent à la plupart des services financiers réglementés, dont les banques, les émetteurs de cartes, les applications de paiement et les grandes plateformes d’échange de cryptomonnaies. Pour vous inscrire, vous devez fournir votre nom, votre adresse et votre date de naissance, souvent avec une photo de votre pièce d’identité et un selfie, et l’entreprise est tenue de conserver ces données pendant des années.

    Pour votre vie privée, cela veut dire que votre véritable identité est liée à tout ce que vous faites sur le service, et que des copies de votre pièce d’identité sont stockées dans une base de données qui pourrait fuiter (et c’est déjà arrivé). Certains services hors du secteur financier demandent aussi une pièce d’identité, comme les fournisseurs de numéros de téléphone dans les pays où la loi l’exige.

    Se passer du KYC en toute légalité implique généralement des montants plus faibles et moins de fonctionnalités : l’argent liquide, les cartes prépayées à faible plafond, les échanges de cryptomonnaies de pair à pair ou les services qui ne demandent rien. Les règles varient beaucoup d’un pays à l’autre, alors vérifiez ce qui s’applique chez vous.
  KYC: KYC
  ID verification: vérification d’identité
  Metadata: Métadonnées
  Data about your data - who you contacted, when, from where and on what device - rather than what you actually said or saved.: "Des données sur vos données : qui vous avez contacté, quand, d’où et depuis quel appareil, plutôt que ce que vous avez réellement dit ou enregistré."
  ? |
    Metadata is everything around the content. For a message, that's who sent it to whom, when, how
    often and from which IP address. For a photo, it's often baked into the file as EXIF data: the
    phone or camera model, the time it was taken and sometimes the exact GPS location. Office
    documents can carry your name, your organisation and leftover comments or tracked changes.

    It's easy to shrug off, but it adds up fast. Who you talk to and where you go can reveal more
    than the messages themselves, which is why so much surveillance collects it. Michael Hayden, a
    former head of the NSA, once said "we kill people based on metadata", and he wasn't joking.

    End-to-end encryption protects the content, not usually the metadata, so messaging apps vary a
    lot in how much of it they can see or keep. With email, the servers always see who it's from,
    who it's to and when, encrypted or not. For files, strip the metadata before you share them -
    some sites remove EXIF data from uploads, but they may keep it for themselves.
  : |-
    Les métadonnées, c’est tout ce qui entoure le contenu. Pour un message, c’est qui l’a envoyé à qui, quand, à quelle fréquence et depuis quelle adresse IP. Pour une photo, elles sont souvent intégrées au fichier sous forme de données EXIF : le modèle du téléphone ou de l’appareil photo, l’heure de la prise de vue et parfois la position GPS exacte. Les documents bureautiques peuvent contenir votre nom, celui de votre organisation et des commentaires oubliés ou des traces du suivi des modifications.

    On a tendance à les prendre à la légère, mais elles s’accumulent vite. Les personnes à qui vous parlez et les endroits où vous allez peuvent en révéler davantage que les messages eux-mêmes, et c’est pour cela que tant de dispositifs de surveillance les collectent. Michael Hayden, ancien directeur de la NSA, a dit un jour : « Nous tuons des gens sur la base de métadonnées », et il ne plaisantait pas.

    Le chiffrement de bout en bout protège le contenu, mais généralement pas les métadonnées. Les applications de messagerie diffèrent donc nettement par ce qu’elles peuvent en voir ou en garder. Pour l’e-mail, les serveurs voient toujours l’expéditeur, le destinataire et la date, que le message soit chiffré ou non. Supprimez les métadonnées de vos fichiers avant de les partager : certains sites retirent les données EXIF des fichiers mis en ligne, mais peuvent les garder pour eux.
  No-logs policy: Politique no-log
  A provider's promise not to keep records of what you do on its service, most often made by VPNs and DNS providers.: La promesse, faite surtout par les VPN et les fournisseurs DNS, de ne garder aucune trace de ce que vous faites sur leur service.
  ? |
    A no-logs policy is a promise not to record what you get up to, like the sites you visit, the IP
    address you connect from, and when and for how long you're connected. It's most common with
    VPNs, where the provider can see all your traffic and says it won't keep any of it. It never
    means no data at all - they'll usually still have your account details and payment records, so
    read what the policy actually covers.

    The problem is you can't check it from the outside, and providers that advertised no logs have
    handed records to the police before. The best signs are independent audits (repeated, ideally),
    servers that run from memory so nothing survives a reboot, and real-world tests: court cases or
    server seizures where the provider had nothing to hand over.

    Even a perfect policy only covers the provider. Your ISP can still see that you're connected to
    a VPN, and the sites you visit can still log what you do once you get there.
  : |-
    Une politique no-log est la promesse de ne pas enregistrer ce que vous faites, comme les sites que vous visitez, l’adresse IP depuis laquelle vous vous connectez, ainsi que le moment et la durée de vos connexions. Elle est surtout courante chez les VPN, où le fournisseur peut voir tout votre trafic et affirme n’en garder aucune trace. Cela ne veut jamais dire aucune donnée du tout : il conserve généralement les informations de votre compte et l’historique de vos paiements, alors lisez ce que la politique couvre réellement.

    Le problème, c’est que vous ne pouvez pas le vérifier de l’extérieur, et des fournisseurs qui affichaient une politique no-log ont déjà remis des logs à la police. Les meilleurs indices sont des audits indépendants (répétés, idéalement), des serveurs qui fonctionnent uniquement en mémoire vive pour que rien ne survive à un redémarrage, et des mises à l’épreuve en conditions réelles : des affaires judiciaires ou des saisies de serveurs où le fournisseur n’avait rien à remettre.

    Même une politique parfaite ne concerne que le fournisseur. Votre FAI peut toujours voir que vous utilisez un VPN, et les sites que vous visitez peuvent toujours garder une trace de ce que vous y faites une fois sur place.
  no-log policy: politique de non-conservation des logs
  zero-logs policy: politique zéro log
  Open source: Open source
  Software whose source code is public, under a licence that lets anyone read, use, change and share it.: Un logiciel dont le code source est public, sous une licence qui permet à tout le monde de le lire, de l’utiliser, de le modifier et de le partager.
  ? |
    Open source means the code is published under a licence that meets the
    [Open Source Definition](https://opensource.org/osd), so anyone can read it, use it, change it
    and pass it on. It doesn't have to be free of charge. For privacy tools that's the main draw,
    because people outside the company can check what the app really does with your data instead of
    taking the marketing's word for it.

    It's no guarantee, mind. Published code doesn't mean anyone's checked it, and serious bugs have
    gone unnoticed in popular open source projects for years. The app you download might not be
    built from exactly the code you can see, unless the project has reproducible builds that let
    people confirm it. With online services you also can't see what's running on their servers,
    which matters less if the app on your device encrypts everything before it leaves.

    When you're choosing, check which parts are actually open (the app, the server or both), what
    the licence is, and whether the project's still active. "Open source" in marketing sometimes
    means "some of it", so have a look at the code repository yourself.
  : |-
    Un logiciel est open source quand son code est publié sous une licence conforme à l’[Open Source Definition](https://opensource.org/osd), si bien que tout le monde peut le lire, l’utiliser, le modifier et le redistribuer. Le logiciel n’est pas forcément gratuit pour autant. Pour les outils de confidentialité, l’ouverture du code est le principal atout, car des personnes extérieures à l’entreprise peuvent vérifier ce que l’application fait vraiment de vos données, au lieu de croire le marketing sur parole.

    Ce n’est pas une garantie, cela dit. Que le code soit public ne veut pas dire que quelqu’un l’ait vérifié, et des bugs graves sont passés inaperçus pendant des années dans des projets open source populaires. L’application que vous téléchargez n’est pas forcément compilée à partir du code exact que vous avez sous les yeux, sauf si le projet propose des builds reproductibles qui permettent à chacun de le confirmer. Avec les services en ligne, vous ne voyez pas non plus ce qui tourne sur leurs serveurs, ce qui compte moins si l’application sur votre appareil chiffre tout avant l’envoi.

    Au moment de choisir, vérifiez quelles parties sont vraiment ouvertes (l’application, le serveur ou les deux), quelle est la licence et si le projet est toujours actif. Dans le marketing, « open source » veut parfois dire « en partie », alors jetez vous-même un œil au dépôt de code.
  open-source software: logiciel open source
  OSS: OSS
  Passkeys: Clés d’accès
  A login that uses a cryptographic key stored on your device or in your password manager instead of a password, and resists phishing.: Une méthode de connexion qui remplace le mot de passe par une clé cryptographique stockée sur votre appareil ou dans votre gestionnaire de mots de passe, et qui résiste à l’hameçonnage.
  ? |
    A passkey is a pair of keys made when you set one up for a site. The site keeps the public half,
    and the private half stays on your phone, computer, password manager or security key. To sign
    in, you confirm it's you with your fingerprint, face or PIN, and your device proves it has the
    private key without ever sending it. Your fingerprint never leaves your device either, and the
    whole thing runs on standards called FIDO2 and WebAuthn.

    The big win is phishing. A passkey is tied to the real website's address, so it just won't work
    on a lookalike site, however convincing it is. There's no password to reuse or to leak in a
    breach, because the site only stores the public key, which is no use to an attacker. Since you
    need both the device and your fingerprint or PIN, many sites also treat a passkey as two factors
    in one.

    Synced passkeys live in a password manager (including the one built into your phone) and get
    backed up with it, which is convenient but means trusting that provider. Device-bound ones stay
    on a single device or security key and can't be copied, so you'll want a backup way in. Before
    you go all in, check how your provider lets you move passkeys elsewhere.
  : |-
    Une clé d’accès (passkey) est une paire de clés créée quand vous en configurez une pour un site. Le site garde la moitié publique, et la moitié privée reste sur votre téléphone ou votre ordinateur, dans votre gestionnaire de mots de passe ou sur votre clé de sécurité. Pour vous connecter, vous confirmez que c’est bien vous avec votre empreinte digitale, votre visage ou votre code PIN, et votre appareil prouve qu’il détient la clé privée sans jamais l’envoyer. Votre empreinte digitale ne quitte jamais votre appareil non plus, et le tout repose sur des standards appelés FIDO2 et WebAuthn.

    Le gros avantage, c’est la protection contre l’hameçonnage. Une clé d’accès est liée à l’adresse du vrai site, donc elle ne fonctionnera tout simplement pas sur un site qui l’imite, aussi convaincant soit-il. Il n’y a aucun mot de passe qu’on puisse réutiliser ou qui risque de fuiter lors d’un piratage, puisque le site ne stocke que la clé publique, qui ne sert à rien à un attaquant. Comme il faut à la fois l’appareil et votre empreinte ou votre code PIN, beaucoup de sites considèrent aussi une clé d’accès comme deux facteurs en un.

    Les clés d’accès synchronisées sont stockées dans un gestionnaire de mots de passe (y compris celui qui est intégré à votre téléphone) et sauvegardées avec lui, ce qui est pratique mais oblige à faire confiance à ce fournisseur. Celles qui sont liées à un appareil restent sur un seul appareil ou une seule clé de sécurité et ne peuvent pas être copiées, alors prévoyez un accès de secours. Avant de tout miser sur les clés d’accès, regardez comment votre fournisseur vous permet de les transférer ailleurs.
  Password manager: Gestionnaire de mots de passe
  An app that creates, stores and fills in a different strong password for every account, all locked behind one master password.: Une application qui crée, stocke et remplit un mot de passe solide et différent pour chaque compte, le tout protégé par un seul mot de passe principal.
  ? |
    Reusing passwords is how one breach turns into ten. A password manager fixes that by making a
    long random password for every site and remembering them all, so you only need one strong master
    password (a long passphrase works well). Most also fill in logins for you, sync across your
    devices, and can store passkeys, 2FA codes and notes.

    There are two main types. Cloud-based ones sync your vault through the provider's servers, which
    is convenient, and the good ones encrypt everything on your device first so the provider can't
    read it. Offline ones, like those using the KeePass format, keep your vault in a file you sync
    or back up yourself - more control, more faff.

    Whichever you go for, look for zero-knowledge encryption, a published security audit, open
    source code and an easy way to export everything if you ever want to leave. Turn on 2FA for the
    account itself. And remember the vault is only as strong as your master password - if it's weak
    and the encrypted vault ever gets stolen, it can be cracked offline.
  : |-
    C’est en réutilisant vos mots de passe qu’une seule fuite de données se transforme en dix. Un gestionnaire de mots de passe règle le problème en créant un long mot de passe aléatoire pour chaque site et en les retenant tous, si bien que vous n’avez besoin que d’un seul mot de passe principal solide (une longue phrase de passe fait très bien l’affaire). La plupart remplissent aussi vos identifiants à votre place, se synchronisent entre vos appareils et peuvent stocker des clés d’accès, des codes 2FA et des notes.

    Il en existe deux grands types. Les gestionnaires hébergés dans le cloud synchronisent votre coffre via les serveurs du fournisseur, ce qui est pratique, et les bons chiffrent tout sur votre appareil avant l’envoi, pour que le fournisseur ne puisse pas le lire. Les gestionnaires hors ligne, comme ceux qui utilisent le format KeePass, gardent votre coffre dans un fichier que vous synchronisez ou sauvegardez vous-même : plus de contrôle, mais plus de tracas.

    Quel que soit votre choix, cherchez un chiffrement à connaissance zéro, un audit de sécurité publié, un code open source et un moyen simple de tout exporter si vous décidez un jour de partir. Activez l’authentification à deux facteurs sur le compte lui-même. Et n’oubliez pas que le coffre n’est pas plus solide que votre mot de passe principal : s’il est faible et que le coffre chiffré est volé un jour, il peut être craqué hors ligne.
  password vault: coffre-fort de mots de passe
  Peer-to-peer: Pair-à-pair
  Devices connecting straight to each other to share data, rather than going through a company's central server.: Des appareils qui se connectent directement entre eux pour échanger des données, sans passer par le serveur central d’une entreprise.
  ? |
    In a peer-to-peer (P2P) network, devices talk to each other directly. There's no central server
    holding everyone's messages or files, so there's nothing for a company to scan, lose in a
    breach, hand over or shut down. BitTorrent is the famous example, and some messengers and file
    sync tools work the same way.

    The downside is that peers can usually see each other's IP addresses. With torrents the whole
    swarm can, which is how copyright firms find people. Some P2P messengers get round this by
    routing everything over Tor. Pure P2P can also mean both devices need to be online at once,
    which is why many apps also use servers for finding each other, notifications or relaying
    traffic when a direct connection fails.

    When an app says it's P2P, check what happens when a direct connection isn't possible, whether
    your IP address is shown to the people you talk to, and whether it's end-to-end encrypted.
  : |-
    Dans un réseau pair-à-pair (peer-to-peer, ou P2P), les appareils communiquent directement entre eux. Aucun serveur central ne détient les messages ou les fichiers de tout le monde, il n’y a donc rien qu’une entreprise puisse analyser, perdre lors d’une fuite de données, remettre aux autorités ou couper. BitTorrent en est l’exemple le plus connu, et certaines messageries et certains outils de synchronisation de fichiers fonctionnent de la même façon.

    L’inconvénient, c’est que les pairs peuvent généralement voir l’adresse IP les uns des autres. Avec les torrents, c’est tout l’essaim qui la voit, et c’est comme cela que les sociétés de lutte contre le piratage retrouvent les gens. Certaines messageries P2P contournent le problème en faisant passer tout le trafic par Tor. Le P2P pur peut également obliger les deux appareils à être en ligne en même temps, c’est pourquoi beaucoup d’applications utilisent aussi des serveurs pour que les appareils se trouvent, pour les notifications ou pour relayer le trafic quand une connexion directe échoue.

    Quand une application se dit P2P, vérifiez ce qui se passe si une connexion directe est impossible, si votre adresse IP est visible par les personnes avec qui vous échangez, et si les échanges sont chiffrés de bout en bout.
  P2P: P2P
  PGP and OpenPGP: PGP et OpenPGP
  An encryption standard for email and files that uses a public key you share and a private key you keep, and can sign things too.: Un standard de chiffrement pour les e-mails et les fichiers, qui repose sur une clé publique que vous partagez et une clé privée que vous gardez, et qui sert aussi à signer.
  ? |
    PGP (Pretty Good Privacy) dates back to 1991, and OpenPGP is the open standard that grew out of
    it. GnuPG, or GPG, is the most widely used free implementation, and lots of PGP tools are built
    on it. It works with a key pair: you share your public key so people can encrypt things to you,
    and keep your private key to decrypt them. You can also sign messages and files, which proves
    they came from you and haven't been changed.

    It's still used for encrypted email, and it's how many software projects sign their downloads so
    you can check you've got the real thing. But it has well-known gaps. With email, the sender,
    recipient and date stay visible, and depending on your app, so might the subject line. There's
    no forward secrecy, so if your private key is ever stolen, anyone holding copies of your old
    messages can read every one. And it's easy to get wrong - one unencrypted reply that quotes the
    whole thread gives the game away.

    Look for tools that make key management easy, keep your private key under your control (ideally
    on a hardware key for anything important), and help you check other people's key fingerprints.
    For chatting rather than email, a modern end-to-end encrypted messenger is usually a better fit.
  : |-
    PGP (Pretty Good Privacy) remonte à 1991, et OpenPGP est le standard ouvert qui en est issu. GnuPG, ou GPG, en est l’implémentation libre la plus répandue, et beaucoup d’outils PGP s’appuient dessus. Le principe repose sur une paire de clés : vous partagez votre clé publique pour que les autres puissent chiffrer ce qu’ils vous envoient, et vous gardez votre clé privée pour le déchiffrer. Vous pouvez aussi signer des messages et des fichiers, ce qui prouve qu’ils viennent de vous et qu’ils n’ont pas été modifiés.

    PGP reste utilisé pour les e-mails chiffrés, et c’est avec lui que beaucoup de projets logiciels signent leurs téléchargements, pour que vous puissiez vérifier que vous avez bien le vrai fichier. Mais il a des lacunes bien connues. Avec les e-mails, l’expéditeur, le destinataire et la date restent visibles, et selon votre application, l’objet aussi. Il n’offre pas de confidentialité persistante : si votre clé privée est un jour volée, quiconque détient des copies de vos anciens messages peut tous les lire. Et il est facile de se tromper : une seule réponse non chiffrée qui cite tout le fil de discussion suffit à tout dévoiler.

    Cherchez des outils qui simplifient la gestion des clés, qui laissent votre clé privée sous votre contrôle (idéalement sur une clé de sécurité physique pour tout ce qui est important) et qui vous aident à vérifier l’empreinte des clés de vos correspondants. Pour discuter plutôt que pour échanger des e-mails, une messagerie instantanée moderne chiffrée de bout en bout convient généralement mieux.
  Pretty Good Privacy: Pretty Good Privacy
  GPG: GPG
  GnuPG: GnuPG
  Phishing: Hameçonnage
  Tricking you into handing over passwords, codes, money or personal details with a fake email, text, call or website.: Une technique qui consiste à vous piéger avec de faux e-mails, SMS, appels ou sites web pour vous soutirer vos mots de passe, vos codes, votre argent ou vos données personnelles.
  ? |
    Phishing is one of the commonest ways accounts get broken into. You get an email, text or call
    that looks like it's from your bank, a delivery firm or your boss, with a reason to act right
    now and a link to a page that looks like the real thing. Anything you type there goes straight
    to the attacker. Phishing by text is called smishing, by phone it's vishing, and attacks
    tailored to one person are spear phishing.

    Modern phishing kits can pass what you type to the real site as you go, so they can grab SMS and
    authenticator codes as well as your password. The logins that resist it are passkeys and
    hardware security keys, which check the site's real address and refuse to work on a fake one.

    A password manager helps too, as it only fills in your login on the site it was saved for - if
    it doesn't offer to fill, treat that as a warning. Beyond that, be suspicious of urgency, go to
    sites directly rather than through links in messages, and check where a link really goes before
    you click.
  : |-
    L’hameçonnage (ou phishing) est l’un des moyens les plus courants de pirater un compte. Vous recevez un e-mail, un SMS ou un appel qui semble venir de votre banque, d’un transporteur ou de votre patron : il faut agir tout de suite, et un lien mène à une page qui a tout l’air de la vraie. Tout ce que vous y tapez part directement chez l’attaquant. L’hameçonnage par SMS s’appelle le smishing, par téléphone le vishing, et les attaques taillées sur mesure pour une seule personne, le harponnage (spear phishing).

    Les kits d’hameçonnage modernes peuvent transmettre au vrai site ce que vous tapez au fur et à mesure, et récupérer ainsi les codes reçus par SMS ou générés par une application d’authentification, en plus de votre mot de passe. Les méthodes de connexion qui y résistent sont les clés d’accès et les clés de sécurité physiques, qui vérifient la véritable adresse du site et refusent de fonctionner sur un faux.

    Un gestionnaire de mots de passe aide aussi, puisqu’il ne remplit vos identifiants que sur le site pour lequel ils ont été enregistrés : s’il ne propose pas de les remplir, prenez-le comme un signal d’alerte. Pour le reste, méfiez-vous de l’urgence, allez directement sur les sites plutôt que de suivre les liens reçus dans des messages, et vérifiez où mène vraiment un lien avant de cliquer.
  Proxy: Proxy
  A server that passes your requests on to the internet for you, so the sites you visit see the proxy's address instead of yours.: Un serveur qui relaie vos requêtes vers Internet à votre place, pour que les sites que vous visitez voient l’adresse du proxy plutôt que la vôtre.
  ? |
    A proxy sits between you and the sites you visit and fetches things on your behalf. Unlike a
    VPN, it usually only covers the apps you point at it, like your browser, and many don't add any
    encryption of their own. That makes proxies handy for specific jobs, like getting round a block,
    and a poor choice for hiding everything you do.

    The proxy operator can see where you're going and, for anything not on HTTPS, what you're doing,
    and can tamper with it. That's why free public proxies are such a bad idea: you've no idea who
    runs them, and some exist to collect data or inject ads and malware.

    Privacy front-ends work in a similar way. They're sites that load content from big platforms
    like YouTube or Reddit for you, so the platform sees the front-end's server rather than you.
    They cut out a lot of tracking, but whoever runs the instance can see what you look at, and they
    tend to break when the platform changes things.
  : |-
    Un proxy se place entre vous et les sites que vous visitez, et va chercher les contenus à votre place. Contrairement à un VPN, il ne couvre généralement que les applications que vous configurez pour passer par lui, comme votre navigateur, et beaucoup n’ajoutent aucun chiffrement. Les proxys sont donc pratiques pour des tâches précises, comme contourner un blocage, mais un mauvais choix pour cacher tout ce que vous faites.

    L’opérateur du proxy peut voir où vous allez et, pour tout ce qui ne passe pas par HTTPS, ce que vous faites, et il peut le trafiquer. C’est pour cela que les proxys publics gratuits sont une si mauvaise idée : vous ne savez pas du tout qui les gère, et certains sont là pour collecter des données ou injecter des publicités et des logiciels malveillants.

    Les interfaces alternatives axées sur la confidentialité fonctionnent un peu de la même façon. Ce sont des sites qui chargent pour vous le contenu de grandes plateformes comme YouTube ou Reddit, si bien que la plateforme voit le serveur de l’interface plutôt que vous. Elles éliminent une bonne partie du pistage, mais la personne qui gère l’instance peut voir ce que vous consultez, et elles ont tendance à ne plus fonctionner quand la plateforme change quelque chose.
  proxy server: serveur proxy
  web proxy: proxy web
  Sandboxing: Bac à sable
  Running an app in a walled-off space with limited access to the rest of your system, so a bad or hacked app can only do so much damage.: Un espace cloisonné où une application tourne avec un accès restreint au reste de votre système, pour limiter les dégâts si elle est malveillante ou piratée.
  ? |
    A sandbox limits what an app can touch, like your files, other apps, your camera or the network.
    If something inside it is malicious or gets hacked, the damage should stay inside the box. You
    use sandboxes all the time without noticing: phone apps each run in one, and browsers sandbox
    the code that runs web pages so a malicious site can't read your files.

    On a desktop you can go further. Linux has tools that sandbox individual programs, and app
    formats like Flatpak come with a permission system, though plenty of apps ask for far more
    access than they need. Virtual machines go further still by running a whole separate operating
    system, which is why they're popular for opening suspicious files or keeping different parts of
    your life in separate compartments.

    A sandbox is only as good as its rules. Broad permissions make it close to pointless, and bugs
    that let code escape do turn up, so keep things updated. It also can't protect anything you hand
    to the app inside it.
  : |-
    Un bac à sable limite ce à quoi une application peut accéder, comme vos fichiers, les autres applications, votre caméra ou le réseau. Si quelque chose à l’intérieur est malveillant ou se fait pirater, les dégâts devraient y rester confinés. Vous utilisez des bacs à sable en permanence sans vous en rendre compte : sur votre téléphone, chaque application tourne dans le sien, et les navigateurs enferment dans un bac à sable le code qu’exécutent les pages web, pour qu’un site malveillant ne puisse pas lire vos fichiers.

    Sur un ordinateur, vous pouvez aller plus loin. Linux propose des outils pour mettre un programme précis dans un bac à sable, et des formats d’application comme Flatpak intègrent un système d’autorisations, même si beaucoup d’applications demandent bien plus d’accès qu’il ne leur en faut. Les machines virtuelles vont encore plus loin en faisant tourner tout un système d’exploitation à part, c’est pourquoi elles sont appréciées pour ouvrir des fichiers suspects ou pour cloisonner les différents pans de votre vie.

    Un bac à sable ne vaut que ce que valent ses règles. Des autorisations trop larges le rendent presque inutile, et il arrive bel et bien que des failles permettent au code de s’en échapper, alors faites vos mises à jour. Il ne peut pas non plus protéger ce que vous confiez vous-même à l’application qu’il contient.
  sandbox: sandbox
  app sandbox: bac à sable applicatif
  Security audit: Audit de sécurité
  An outside firm checking an app's code, systems or policies for security holes and false claims, ideally with a public report.: L’examen du code, des systèmes ou des politiques d’une application par un cabinet extérieur, qui y cherche des failles de sécurité et de fausses affirmations, idéalement avec un rapport public à la clé.
  ? |
    In a security audit, a company pays an independent firm to go through its code or systems
    looking for weaknesses, then (ideally) publishes the report. There are a few kinds: code
    reviews, penetration tests where the auditors actively try to break in, reviews of the
    cryptography, and policy audits like the no-logs audits VPN providers use to back up their
    claims.

    An audit is a snapshot. It only covers what was in scope at the time, and the app may have
    changed a lot since. It's also paid for by the company being audited, which doesn't make it
    worthless, but it's a good reason to read the details rather than trust a badge on the homepage.

    Good signs are a full public report rather than a summary, a well-known auditing firm, a recent
    date, a clear scope and a note of which issues got fixed. Regular audits over several years
    count for more than a single one from 2019. No audit doesn't mean unsafe - plenty of small open
    source projects can't afford one - but it does mean you're relying on whoever's read the code.
  : |-
    Lors d’un audit de sécurité, une entreprise paie un cabinet indépendant pour passer au crible son code ou ses systèmes à la recherche de faiblesses, puis (idéalement) publie le rapport. Il en existe plusieurs sortes : les revues de code, les tests d’intrusion (les auditeurs essaient activement de s’introduire dans le système), les analyses de la cryptographie, et les audits de politiques, comme les audits no-log auxquels les fournisseurs de VPN ont recours pour appuyer leurs affirmations.

    Un audit, c’est une photo à un instant donné. Il ne couvre que ce qui faisait partie du périmètre à ce moment-là, et l’application a pu beaucoup changer depuis. Il est aussi payé par l’entreprise auditée, ce qui ne lui enlève pas toute valeur, mais c’est une bonne raison de lire les détails plutôt que de se fier à un badge sur la page d’accueil.

    Les bons signes : un rapport public complet plutôt qu’un résumé, un cabinet d’audit reconnu, une date récente, un périmètre clair et la liste des problèmes corrigés. Des audits réguliers sur plusieurs années pèsent plus lourd qu’un audit unique datant de 2019. L’absence d’audit ne veut pas dire que ce soit dangereux (beaucoup de petits projets open source n’en ont pas les moyens), mais cela veut dire que vous vous fiez à ceux qui ont lu le code, quels qu’ils soient.
  independent audit: audit indépendant
  third-party audit: audit par un tiers
  Self-hosting: Auto-hébergement
  Running an app or service on hardware you control, at home or on a rented server, instead of relying on someone else's.: Faire tourner une application ou un service sur du matériel que vous contrôlez, chez vous ou sur un serveur loué, au lieu de dépendre de celui de quelqu’un d’autre.
  ? |
    Self-hosting means running the server side of something yourself, like your own cloud storage,
    password manager server, chat server or media library. It might live on an old laptop, a
    Raspberry Pi or a rented server. Your data stays somewhere you control, and no company can scan
    it, sell it, change the terms or shut the service down on you.

    The trade-off is that you're now the IT department. Updates, backups, security and fixing it at
    2am are all on you, and a neglected server is easy pickings. On a rented server the hosting
    company can get at your disk in principle, so encryption still matters. Email is notoriously
    hard to self-host well, since the big providers are quick to treat mail from small servers as
    spam.

    Stick to open source apps with clear docs, an active project and an easy way to update. If you'd
    rather not run it all yourself, plenty of privacy-focused services offer both - a hosted
    version, and the code to run your own.
  : |-
    L’auto-hébergement consiste à faire tourner vous-même la partie serveur d’un service, comme votre propre stockage cloud, un serveur pour votre gestionnaire de mots de passe, un serveur de discussion ou une bibliothèque multimédia. Le tout peut être installé sur un vieil ordinateur portable, un Raspberry Pi ou un serveur loué. Vos données restent dans un endroit que vous contrôlez, et aucune entreprise ne peut les analyser, les vendre, modifier les conditions ou vous couper le service.

    La contrepartie, c’est que le service informatique, maintenant, c’est vous. Les mises à jour, les sauvegardes, la sécurité et les dépannages à 2 h du matin sont à votre charge, et un serveur laissé à l’abandon est une proie facile. Sur un serveur loué, l’hébergeur peut en principe accéder à votre disque, donc le chiffrement reste important. L’e-mail est notoirement difficile à auto-héberger correctement, car les grands fournisseurs ont vite fait de classer en spam les messages qui viennent de petits serveurs.

    Tenez-vous-en à des applications open source bien documentées, dont le projet est actif et qui se mettent à jour facilement. Si vous préférez ne pas tout gérer vous-même, beaucoup de services axés sur la confidentialité proposent les deux : une version hébergée, et le code pour faire tourner la vôtre.
  self-hosted: auto-hébergé
  Source-available software: Logiciel à code source disponible
  Software whose code you can read, but under a licence that limits what you can do with it, so it doesn't count as open source.: Un logiciel dont vous pouvez lire le code, mais sous une licence qui limite ce que vous pouvez en faire, si bien qu’il n’est pas considéré comme open source.
  ? |
    Source-available code is public, but the licence holds back some of the freedoms open source
    gives you. It might ban commercial use, stop you running it as a competing service, or forbid
    sharing changed versions. The Business Source License and the Server Side Public License are
    well-known examples, and neither is approved by the Open Source Initiative.

    For privacy, it gets you most of the way. You (or anyone) can still read the code and check what
    it does with your data, which is the main reason to care. What you lose is the safety net: if
    the company goes bust or goes bad, usually nobody else is allowed to pick up the code and carry
    on.

    Watch the wording. Some projects call themselves open source when the licence says otherwise,
    and code published with no licence at all is technically all rights reserved, even on GitHub. A
    few source-available licences turn into proper open source ones after a set number of years.
  : |-
    Dans un logiciel à code source disponible (source-available), le code est public, mais la licence vous prive de certaines des libertés que donne l’open source. Elle peut interdire l’usage commercial, vous empêcher de le proposer sous forme de service concurrent ou proscrire le partage de versions modifiées. La Business Source License et la Server Side Public License en sont des exemples connus, et aucune des deux n’est approuvée par l’Open Source Initiative.

    Côté confidentialité, l’essentiel est là. Vous (ou n’importe qui) pouvez toujours lire le code et vérifier ce qu’il fait de vos données, ce qui est la principale raison de s’y intéresser. Ce que vous perdez, c’est le filet de sécurité : si l’entreprise fait faillite ou tourne mal, personne d’autre n’a généralement le droit de reprendre le code pour continuer le projet.

    Attention aux étiquettes. Certains projets se disent open source alors que leur licence dit le contraire, et du code publié sans aucune licence est techniquement « tous droits réservés », même sur GitHub. Quelques licences à code source disponible deviennent de vraies licences open source au bout d’un nombre d’années fixé à l’avance.
  Telemetry: Télémétrie
  Data an app or operating system sends back to its maker about how you use it, what device you're on and what went wrong.: Les données qu’une application ou un système d’exploitation renvoie à son éditeur sur la façon dont vous l’utilisez, l’appareil que vous avez et les problèmes rencontrés.
  ? |
    Telemetry ranges from harmless to nosy. A crash report that helps someone fix a bug is one
    thing. A steady stream of which buttons you click and what hardware you're on, tied to an ID
    that follows you around, is another. Most of it's on by default and buried a few menus deep, if
    it can be turned off at all.

    Even "anonymous" telemetry has to be sent from somewhere, so the server receiving it sees your
    IP address unless it goes through a proxy first. Windows, for one, lets you turn diagnostic data
    down but not off unless you're on an Enterprise or Education edition, which is why so many tools
    exist to block it.

    The better apps make telemetry opt-in, list exactly what gets sent, and publish code you (or
    someone else) can check. Open source apps can collect telemetry too, it's just harder to hide.
    Blocking it with a firewall or a DNS blocklist works for plenty of apps, though some break or
    nag you when they can't phone home.
  : |-
    La télémétrie va de l’inoffensif à l’indiscret. Un rapport de plantage qui aide quelqu’un à corriger un bug, c’est une chose. Un flux continu indiquant sur quels boutons vous cliquez et quel matériel vous utilisez, lié à un identifiant qui vous suit partout, c’en est une autre. Le plus souvent, elle est activée par défaut et enfouie quelques menus plus loin, si tant est qu’on puisse la désactiver.

    Même la télémétrie « anonyme » doit bien être envoyée depuis quelque part, donc le serveur qui la reçoit voit votre adresse IP, sauf si elle passe d’abord par un proxy. Windows, par exemple, vous laisse réduire les données de diagnostic mais pas les désactiver, sauf si vous avez une édition Entreprise ou Éducation, d’où le grand nombre d’outils conçus pour les bloquer.

    Les meilleures applications ne l’activent que si vous l’acceptez, indiquent précisément ce qui est envoyé et publient un code que vous (ou quelqu’un d’autre) pouvez vérifier. Les applications open source peuvent aussi collecter de la télémétrie, c’est juste plus difficile à cacher. La bloquer avec un pare-feu ou une liste de blocage DNS fonctionne pour beaucoup d’applications, même si certaines ne marchent plus ou vous relancent sans arrêt quand elles ne peuvent pas contacter leurs serveurs.
  diagnostic data: données de diagnostic
  usage data: données d’utilisation
  Third-party cookies: Cookies tiers
  Cookies set by a company other than the site you're on, usually an ad network, so it can recognise you on every site it's embedded in.: Des cookies déposés par une autre entreprise que le site sur lequel vous êtes, généralement une régie publicitaire, pour qu’elle puisse vous reconnaître sur tous les sites où elle est intégrée.
  ? |
    A cookie is a small bit of data a website stores in your browser. First-party cookies come from
    the site you're actually on and do useful things like keep you logged in. Third-party cookies
    come from something embedded in the page, like an ad, a share button or an analytics script, and
    because the same company is embedded on thousands of sites, it can follow you from one to the
    next.

    Browsers have been clamping down on them. Safari blocks them by default, and Firefox gives every
    site its own separate cookie jar so they can't follow you around. Chrome still allows them
    unless you change the setting, after Google dropped its plan to phase them out.

    Blocking them doesn't stop tracking on its own, since fingerprinting, tracking from a site's own
    domain and being logged in to accounts all still work. In the UK and EU, sites need your consent
    for non-essential cookies, which is what those banners are for. "Reject all" turns most of them
    off, at least on sites that respect your choice.
  : |-
    Un cookie est un petit morceau de données qu’un site web enregistre dans votre navigateur. Les cookies internes viennent du site sur lequel vous vous trouvez réellement et servent à des choses utiles, comme maintenir votre connexion. Les cookies tiers viennent d’un élément intégré à la page, comme une publicité, un bouton de partage ou un script de mesure d’audience, et comme la même entreprise est présente sur des milliers de sites, elle peut vous suivre de l’un à l’autre.

    Les navigateurs leur mènent la vie de plus en plus dure. Safari les bloque par défaut, et Firefox donne à chaque site sa propre boîte à cookies, pour qu’ils ne puissent pas vous suivre partout. Chrome, lui, les autorise toujours tant que vous ne changez pas le réglage, Google ayant abandonné son projet de les supprimer progressivement.

    Les bloquer ne suffit pas à empêcher le pistage, puisque l’empreinte numérique du navigateur, les traqueurs hébergés sur le domaine du site lui-même et la connexion à vos comptes permettent toujours de vous suivre. Au Royaume-Uni et dans l’UE, les sites doivent obtenir votre consentement pour les cookies non essentiels, et c’est à cela que servent ces bandeaux. « Tout refuser » désactive la plupart d’entre eux, du moins sur les sites qui respectent votre choix.
  tracking cookies: cookies de pistage
  cross-site cookies: cookies intersites
  Threat model: Modèle de menace
  Working out what you're protecting, who from and how much hassle it's worth, so you pick tools that fit your real risks.: Déterminer ce que vous protégez, contre qui et quels efforts cela mérite, pour choisir des outils adaptés à vos risques réels.
  ? |
    A threat model is just a plan. You work out what you want to protect (your messages, your
    location, your identity), who you're protecting it from (advertisers, a nosy ex, scammers, a
    government), how likely that is, how bad it'd be if it went wrong, and how much effort you're
    prepared to put in. The EFF's Surveillance Self-Defense guide has a
    [good walk-through](https://ssd.eff.org/module/your-security-plan).

    Your answers decide what you need. Someone avoiding ad tracking needs a decent browser and an ad
    blocker. A journalist protecting sources needs a lot more, and shouldn't rely on any one tool.
    Most people are somewhere in between.

    It also stops you overdoing it. Every extra tool is something else to maintain and something
    else to break, and a setup that's a pain to live with tends to get abandoned. Pick protections
    that match the threats you actually face, and look at them again when your situation changes.
  : |-
    Un modèle de menace, c’est tout simplement un plan. Vous déterminez ce que vous voulez protéger (vos messages, votre localisation, votre identité), contre qui (des annonceurs, un ex trop curieux, des escrocs, un gouvernement), quelle est la probabilité que cela arrive, à quel point ce serait grave si les choses tournaient mal, et combien d’efforts vous acceptez d’y consacrer. Le guide Surveillance Self-Defense de l’EFF propose une [bonne marche à suivre](https://ssd.eff.org/module/your-security-plan).

    Vos réponses déterminent ce dont vous avez besoin. Quelqu’un qui veut éviter le pistage publicitaire a besoin d’un navigateur correct et d’un bloqueur de publicités. Un journaliste qui protège ses sources a besoin de bien plus, et ne devrait pas tout miser sur un seul outil. La plupart des gens se situent quelque part entre les deux.

    Cela vous évite aussi d’en faire trop. Chaque outil en plus, c’est une chose de plus à entretenir et une chose de plus qui peut tomber en panne, et une configuration pénible au quotidien finit souvent par être abandonnée. Choisissez des protections adaptées aux menaces qui vous concernent réellement, et réexaminez-les quand votre situation change.
  threat modelling: modélisation des menaces
  Tor and onion routing: Tor et le routage en oignon
  A free network that bounces your traffic through three volunteer-run relays, so no single one knows both who you are and where you're going.: Un réseau gratuit qui fait passer votre trafic par trois relais gérés par des bénévoles, pour qu’aucun d’eux ne sache à la fois qui vous êtes et où vous allez.
  ? |
    Tor wraps your traffic in three layers of encryption and sends it through three relays run by
    volunteers. Each relay peels off one layer (hence "onion"), so the first knows your IP address
    but not where you're going, and the last knows where you're going but not who you are.
    [Tor Browser](https://www.torproject.org/) is the easiest way in, and it also makes its users
    look as alike as possible, so you're harder to fingerprint.

    Onion services (the .onion addresses) never leave the Tor network, so both sides stay hidden.
    For ordinary sites, the last relay can see your traffic if the site doesn't use HTTPS. Tor is
    also slower than a normal connection, and some sites block it or pile on the CAPTCHAs.

    Your ISP can see that you're using Tor, though not what for, unless you connect through a bridge
    that disguises it. Tor can't protect you from yourself either - logging into your usual
    accounts, or opening a downloaded file outside Tor Browser, can give you away. Someone who can
    watch both ends of your connection at once may also be able to match up the traffic.
  : |-
    Tor enveloppe votre trafic dans trois couches de chiffrement et le fait passer par trois relais gérés par des bénévoles. Chaque relais retire une couche (d’où le nom d’« oignon »), si bien que le premier connaît votre adresse IP mais pas votre destination, et le dernier connaît votre destination mais pas votre identité. [Tor Browser](https://www.torproject.org/) est le moyen le plus simple d’y accéder, et il fait aussi en sorte que ses utilisateurs se ressemblent le plus possible, pour qu’il soit plus difficile de vous identifier par votre empreinte numérique.

    Les services onion (les adresses en .onion) ne quittent jamais le réseau Tor, donc les deux parties restent cachées. Pour les sites ordinaires, le dernier relais peut voir votre trafic si le site n’utilise pas HTTPS. Tor est aussi plus lent qu’une connexion normale, et certains sites le bloquent ou multiplient les CAPTCHA.

    Votre FAI peut voir que vous utilisez Tor (mais pas ce que vous en faites), sauf si vous vous connectez via un pont qui le dissimule. Tor ne peut pas non plus vous protéger de vous-même : vous connecter à vos comptes habituels, ou ouvrir un fichier téléchargé en dehors de Tor Browser, peut vous trahir. Quelqu’un capable de surveiller les deux extrémités de votre connexion en même temps peut aussi être en mesure de recouper le trafic.
  The Onion Router: The Onion Router
  Terms of Service; Didn't Read: Terms of Service; Didn’t Read
  A community project that reads the terms and privacy policies of websites and apps, and grades them from A (very good) to E (very bad).: Un projet communautaire qui lit les conditions d’utilisation et les politiques de confidentialité des sites et des applications, et leur attribue une note de A (très bon) à E (très mauvais).
  ? |
    Hardly anyone reads the terms they agree to, so [ToS;DR](https://tosdr.org/) reads them for you.
    Since 2012 its contributors have been going through the terms of service and privacy policies of
    sites and apps, picking out the parts that matter, like whether you can delete your account or
    whether your data gets shared with advertisers. Each point is labelled good, neutral, bad or,
    for the worst ones, a blocker.

    Those points add up to a grade from A, for very good, down to E, for very bad. Services with no
    reviewed points don't get one. It's a quick way to spot terms that let a company do things you'd
    object to.

    Treat it as a starting point. Reviews come from a community of contributors, so smaller services
    are often missing, and a company can change its terms after they've been reviewed. A grade is
    also about what the terms say, not how secure the service is or whether the company sticks to
    its word.
  : |-
    Rares sont ceux qui lisent les conditions qu’ils acceptent, alors [ToS;DR](https://tosdr.org/) les lit pour vous. Depuis 2012, ses contributeurs épluchent les conditions d’utilisation et les politiques de confidentialité de sites et d’applications pour en relever ce qui compte, par exemple si vous pouvez supprimer votre compte ou si vos données sont partagées avec des annonceurs. Chaque point reçoit l’étiquette « bon », « neutre », « mauvais » ou, pour les pires, « rédhibitoire ».

    Ces points se cumulent pour donner une note allant de A, pour très bon, à E, pour très mauvais. Les services dont aucun point n’a été examiné n’ont pas de note. C’est un moyen rapide de repérer des conditions qui permettent à une entreprise de faire des choses que vous n’accepteriez pas.

    Prenez-le comme un point de départ. Les analyses viennent d’une communauté de contributeurs, donc les petits services manquent souvent à l’appel, et une entreprise peut modifier ses conditions après leur examen. Et une note ne porte que sur ce que disent les conditions, pas sur la sécurité du service ni sur le fait que l’entreprise tienne parole.
  ToS;DR: ToS;DR
  TOSDR: TOSDR
  Time-based one-time password: Mot de passe à usage unique basé sur le temps
  The short-lived codes from an authenticator app, worked out from a secret shared with the site and the current time.: Les codes éphémères d’une application d’authentification, calculés à partir d’un secret partagé avec le site et de l’heure actuelle.
  ? |
    When you turn on app-based 2FA, the site shows you a QR code containing a secret key, which your
    authenticator app saves. From then on, the app and the site both combine that secret with the
    current time to work out the same short code, which usually changes every 30 seconds. It's all
    done offline, so your phone doesn't need signal and the app doesn't need an account.

    It's a big step up from SMS codes, since there's nothing for a SIM swap to intercept. It's not
    phishing-proof, though. If you type a code into a convincing fake login page, the attacker can
    pass it straight on to the real site while it's still valid. Anyone who gets hold of the secret
    (from a backup, say, or a screenshot of the QR code) can also make your codes until you reset
    2FA.

    Pick an authenticator app that lets you back up or export your accounts, ideally encrypted, so a
    lost or broken phone isn't a disaster. Some apps make it hard to get your secrets out, which
    feels secure right up until you change phones.
  : |-
    Quand vous activez l’authentification à deux facteurs par application, le site vous montre un QR code qui contient une clé secrète, et votre application d’authentification l’enregistre. Dès lors, l’application et le site combinent tous les deux ce secret avec l’heure actuelle pour calculer le même code court, qui change généralement toutes les 30 secondes. Tout se fait hors ligne : votre téléphone n’a pas besoin de réseau et l’application n’a pas besoin de compte.

    C’est un gros progrès par rapport aux codes par SMS, puisqu’une attaque par SIM swapping n’a rien à intercepter. Ce n’est pas pour autant à l’abri de l’hameçonnage. Si vous tapez un code sur une fausse page de connexion convaincante, l’attaquant peut le transmettre aussitôt au vrai site tant qu’il est encore valable. Quiconque met la main sur le secret (à partir d’une sauvegarde, par exemple, ou d’une capture d’écran du QR code) peut aussi générer vos codes jusqu’à ce que vous réinitialisiez l’authentification à deux facteurs.

    Choisissez une application d’authentification qui vous permette de sauvegarder ou d’exporter vos comptes, idéalement sous forme chiffrée, pour qu’un téléphone perdu ou cassé ne tourne pas à la catastrophe. Certaines applications rendent l’extraction de vos secrets difficile, ce qui a l’air très sûr, jusqu’au jour où vous changez de téléphone.
  TOTP: TOTP
  authenticator codes: codes d’authentification
  Tracker: Traqueur
  Code in a website, app or email that records what you do and reports it to another company, usually for advertising.: Du code intégré à un site web, une application ou un e-mail, qui enregistre ce que vous faites et le communique à une autre entreprise, généralement à des fins publicitaires.
  ? |
    Trackers come in a few shapes. On websites, they're scripts and invisible images from ad
    networks and analytics firms, sometimes dozens on a single page. In apps, they're bits of code
    from those same companies that the developer has bundled in, and they get whatever access the
    app has. In emails, a tiny invisible image (a tracking pixel) tells the sender when you opened
    it, roughly where you were and what device you used.

    Because the same few companies are on so many sites and apps, they can follow you between them
    and build up a profile of your interests, habits and whereabouts. That profile is used for
    targeted ads, and some of it gets sold on to data brokers.

    Blocking them is one of the easier wins. Content blockers in your browser use filter lists of
    known trackers, DNS-level blockers do the same for every device on your network, and most email
    apps can stop remote images loading. Blockers only catch trackers they know about, and some
    sites now serve tracking from their own domain to get round them.
  : |-
    Les traqueurs prennent plusieurs formes. Sur les sites web, ce sont des scripts et des images invisibles fournis par des régies publicitaires et des sociétés de mesure d’audience, parfois des dizaines sur une seule page. Dans les applications, ce sont des bouts de code de ces mêmes entreprises que le développeur a intégrés, et ils disposent de tous les accès de l’application. Dans les e-mails, une minuscule image invisible (un pixel espion) indique à l’expéditeur quand vous l’avez ouvert, à peu près où vous vous trouviez et quel appareil vous utilisiez.

    Comme une poignée d’entreprises, toujours les mêmes, sont présentes sur tant de sites et d’applications, elles peuvent vous suivre de l’un à l’autre et dresser un profil de vos centres d’intérêt, de vos habitudes et de vos déplacements. Ce profil sert à la publicité ciblée, et une partie est revendue à des courtiers en données.

    Les bloquer est l’une des protections les plus faciles à mettre en place. Les bloqueurs de contenu de votre navigateur s’appuient sur des listes de filtres qui recensent les traqueurs connus, les bloqueurs au niveau DNS font de même pour tous les appareils de votre réseau, et la plupart des clients de messagerie peuvent empêcher le chargement des images distantes. Les bloqueurs n’attrapent que les traqueurs qu’ils connaissent, et certains sites hébergent désormais leurs traqueurs sur leur propre domaine pour les contourner.
  web tracker: traqueur web
  ad tracker: traqueur publicitaire
  Virtual private network: Réseau privé virtuel
  An encrypted tunnel from your device to a VPN provider's server, which hides your traffic from your network and your IP address from sites.: Un tunnel chiffré entre votre appareil et un serveur de votre fournisseur de VPN, qui cache votre trafic à votre réseau et votre adresse IP aux sites.
  ? |
    A VPN sends all your traffic through an encrypted tunnel to a server run by the VPN provider,
    and from there out to the internet. Your ISP, or the Wi-Fi network you're on, can see that
    you're using a VPN but not which sites you visit. The sites see the VPN server's IP address
    instead of yours.

    It doesn't make you anonymous. It moves your trust from your ISP to the VPN provider, who can
    now see everything your ISP used to. It won't stop cookies, browser fingerprinting or a site
    recognising you the moment you log in. It's good for hiding your IP address, using dodgy public
    Wi-Fi, getting round blocks and geo-restrictions, and keeping your browsing away from your ISP,
    and not much else.

    The provider matters more than the tech. Look for an audited no-logs policy, open source apps, a
    kill switch and leak protection, and a way to pay that doesn't tie the account to your name if
    that matters to you. Be wary of free VPNs, which have to pay for their servers somehow, often
    with your data.
  : |-
    Un VPN fait passer tout votre trafic dans un tunnel chiffré jusqu’à un serveur géré par le fournisseur de VPN, puis de là vers Internet. Votre fournisseur d’accès à Internet (FAI), ou le réseau Wi-Fi que vous utilisez, peut voir que vous passez par un VPN, mais pas quels sites vous visitez. Les sites, eux, voient l’adresse IP du serveur VPN au lieu de la vôtre.

    Il ne vous rend pas anonyme. Il transfère votre confiance de votre FAI au fournisseur de VPN, qui voit désormais tout ce que votre FAI voyait. Il ne vous protège ni des cookies ni de l’empreinte numérique du navigateur, et il n’empêche pas un site de vous reconnaître dès que vous vous identifiez. Il est utile pour cacher votre adresse IP, vous connecter à un Wi-Fi public douteux, contourner les blocages et les restrictions géographiques et tenir votre navigation à l’écart de votre FAI, mais pas pour grand-chose d’autre.

    C’est le fournisseur qui compte, plus que la technique. Cherchez une politique no-log auditée, des applications open source, un kill switch et une protection contre les fuites, ainsi qu’un moyen de paiement qui ne lie pas le compte à votre nom, si c’est important pour vous. Méfiez-vous des VPN gratuits, qui doivent bien payer leurs serveurs d’une manière ou d’une autre, souvent avec vos données.
  VPN: VPN
  Warrant canary: Warrant canary
  A regularly updated statement that a company hasn't received a secret government order, which it stops updating if it ever does.: Une déclaration régulièrement mise à jour dans laquelle une entreprise affirme n’avoir reçu aucune injonction secrète d’un gouvernement, et qu’elle cesse de mettre à jour si jamais elle en reçoit une.
  ? |
    Some government orders, like US National Security Letters, come with a gag order that stops the
    company telling anyone. A warrant canary is the workaround, named after the canaries miners used
    to take underground. The company regularly publishes a statement saying it hasn't received any
    such order, and if the statement disappears or stops being updated on schedule, you're meant to
    assume it has.

    It relies on the idea that a government can stop you saying something, but can't force you to
    keep saying something false. That's never really been tested in court, and some lawyers think
    pulling a canary could land a company in just as much trouble as speaking out.

    So treat a canary as a hint. Check that it's updated on a regular schedule and signed (often
    with PGP) so you know it's genuine. A lapsed canary can also just mean someone forgot to update
    it, so look for an explanation before you panic.
  : |-
    Certaines injonctions gouvernementales, comme les National Security Letters américaines, s’accompagnent d’une obligation de silence qui interdit à l’entreprise d’en parler à qui que ce soit. Le warrant canary est la parade, et il doit son nom aux canaris que les mineurs emportaient au fond de la mine. L’entreprise publie régulièrement une déclaration affirmant qu’elle n’a reçu aucune injonction de ce type, et si la déclaration disparaît ou n’est plus mise à jour comme prévu, on est censé en déduire qu’elle en a reçu une.

    Le principe repose sur l’idée qu’un gouvernement peut vous empêcher de dire quelque chose, mais pas vous forcer à continuer d’affirmer quelque chose de faux. Cela n’a jamais vraiment été mis à l’épreuve devant un tribunal, et certains juristes pensent que retirer un canari pourrait valoir à une entreprise tout autant d’ennuis que de parler ouvertement.

    Considérez donc un canari comme un indice. Vérifiez qu’il est mis à jour à intervalles réguliers et signé (souvent avec PGP), pour savoir qu’il est authentique. Un canari périmé peut aussi vouloir dire, tout simplement, que quelqu’un a oublié de le mettre à jour, alors cherchez une explication avant de paniquer.
  WebRTC leak: Fuite WebRTC
  When a website uses your browser's built-in calling tech to find your real IP address, even though you're on a VPN or proxy.: Quand un site web se sert de la technologie d’appel intégrée à votre navigateur pour découvrir votre véritable adresse IP, alors même que vous passez par un VPN ou un proxy.
  ? |
    WebRTC is the browser tech behind video calls and other live connections that work without a
    plugin. To connect people directly, it has to work out their IP addresses, and any website can
    ask it to do that with a few lines of code. A WebRTC leak is when that reveals an address you
    were hoping to hide.

    It mostly bites with browser proxy extensions and VPN setups that don't send everything through
    the tunnel, since WebRTC can go around them and expose your real public IP. A VPN app that
    routes all your traffic usually isn't affected. Most major browsers now hide your local network
    address from it by default, too.

    To check, visit a WebRTC leak test page while you're connected. If it shows your real IP, you
    can turn WebRTC off in some browsers (which breaks video calls in the browser), limit it with an
    extension, or fix the VPN so it covers everything.
  : |-
    WebRTC est la technologie des navigateurs qui permet les appels vidéo et d’autres connexions en direct sans plug-in. Pour mettre les gens en relation directement, elle doit déterminer leurs adresses IP, et n’importe quel site peut lui demander de le faire avec quelques lignes de code. On parle de fuite WebRTC quand cela révèle une adresse que vous espériez cacher.

    Le problème se pose surtout avec les extensions de proxy pour navigateur et les configurations VPN qui ne font pas passer tout le trafic par le tunnel, car WebRTC peut les contourner et exposer votre véritable adresse IP publique. Une application VPN qui fait passer l’ensemble de votre trafic par le tunnel n’est généralement pas concernée. La plupart des grands navigateurs cachent d’ailleurs désormais votre adresse IP locale à WebRTC par défaut.

    Pour vérifier, rendez-vous sur une page de test de fuite WebRTC pendant que votre VPN ou votre proxy est actif. Si elle affiche votre véritable adresse IP, vous pouvez désactiver WebRTC dans certains navigateurs (ce qui empêche les appels vidéo dans le navigateur), le restreindre avec une extension, ou corriger la configuration du VPN pour qu’il couvre tout.
  WebRTC IP leak: fuite d’adresse IP WebRTC
  Zero-knowledge encryption: Chiffrement à connaissance zéro
  Encryption done on your device before anything's uploaded, so the provider can store and sync your data but has no way to read it.: Un chiffrement effectué sur votre appareil avant tout envoi, pour que le fournisseur puisse stocker et synchroniser vos données sans aucun moyen de les lire.
  ? |
    Zero-knowledge is mostly a marketing term, but a useful one. Your files, notes or passwords are
    encrypted on your device with a key that comes from your password (or a key only you hold), and
    only the encrypted version is ever sent to the provider. They can store and sync it, but they
    can't read it, and neither can anyone who breaches them.

    Check what's actually covered, as your email address, file sizes, timestamps and sometimes file
    names can still be readable. Forget your password and there's usually no way to get your data
    back - that's the point, but it catches people out. And if you use the web app, the provider
    sends you fresh code every time you load it, so a provider that went bad (or was forced to)
    could serve a version that grabs your password. Desktop and mobile apps make that harder to pull
    off.

    You'll also see "zero-access encryption", which some providers use for data that arrives
    readable (an ordinary incoming email, say) and is encrypted with your key as soon as it lands.
    Don't confuse any of it with zero-knowledge proofs, the maths behind some privacy coins - same
    name, different idea.
  : |-
    L’expression « connaissance zéro » (zero-knowledge) relève surtout du marketing, mais elle est utile. Vos fichiers, vos notes ou vos mots de passe sont chiffrés sur votre appareil avec une clé dérivée de votre mot de passe (ou une clé que personne d’autre que vous ne détient), et seule la version chiffrée est envoyée au fournisseur. Il peut la stocker et la synchroniser, mais pas la lire, et quelqu’un qui le piraterait ne le pourrait pas non plus.

    Vérifiez ce qui est réellement couvert, car votre adresse e-mail, la taille des fichiers, les horodatages et parfois les noms de fichiers peuvent rester lisibles. Si vous oubliez votre mot de passe, il n’y a généralement aucun moyen de récupérer vos données : c’est tout l’intérêt, mais cela en surprend plus d’un. Et si vous utilisez l’application web, le fournisseur vous envoie du code tout neuf à chaque chargement, donc un fournisseur devenu malveillant (ou contraint de le devenir) pourrait vous servir une version qui récupère votre mot de passe. Les applications pour ordinateur et pour mobile rendent ce genre de manœuvre plus difficile.

    Vous croiserez aussi l’expression « chiffrement à accès zéro », que certains fournisseurs emploient pour des données qui arrivent lisibles (un e-mail ordinaire que vous recevez, par exemple) et qui sont chiffrées avec votre clé dès réception. Ne confondez pas tout cela avec les preuves à connaissance zéro (zero-knowledge proofs), les mathématiques sur lesquelles reposent certaines cryptomonnaies anonymes : même nom, idée différente.
  client-side encryption: chiffrement côté client
  zero-access encryption: chiffrement à accès zéro
