  # The glossary, translated by hand
  Two-factor authentication: Autenticação de dois fatores
  Logging in with your password plus a second thing, like a code from your phone or a security key, so a stolen password isn't enough.: Entrar com a sua senha e mais alguma coisa, como um código do celular ou uma chave de segurança, para que uma senha roubada não baste.
  ? |
    With two-factor authentication, someone who steals your password still can't get in without your
    second factor. That might be a code texted to you, a code from an authenticator app, a prompt on
    your phone or a hardware security key. Turn it on for anything that matters, starting with your
    email, since that's where most password resets go.

    The options aren't equal. SMS codes are the weakest, because attackers can talk your mobile
    network into moving your number to their SIM (a SIM swap), but they still beat nothing.
    Authenticator apps are better. Phone prompts can be abused by attackers who spam you with
    requests until you tap "approve". Passkeys and hardware security keys are the strongest, since
    they won't work on a fake site.

    Whatever you use, save the backup codes somewhere safe, or a lost phone can mean a lost account.
    Keeping your 2FA codes in the same password manager as your passwords is convenient, but if that
    one vault is ever compromised, both factors go with it.
  : |-
    Com a autenticação de dois fatores, quem roubar a sua senha continua sem conseguir entrar se não tiver o seu segundo fator. Ele pode ser um código enviado por SMS, um código de um app autenticador, uma notificação no celular ou uma chave de segurança física. Ative-a em tudo o que importa, começando pelo seu e-mail, já que a maioria das redefinições de senha vai parar lá.

    As opções não são equivalentes. Os códigos por SMS são os mais fracos, porque os atacantes podem convencer a sua operadora a passar o seu número para o chip deles (o chamado SIM swap), mas ainda são melhores do que nada. Os apps autenticadores são melhores. As notificações no celular podem ser exploradas por atacantes que bombardeiam você com pedidos até você tocar em “Aprovar”. As chaves de acesso e as chaves de segurança físicas são as mais fortes, já que não funcionam num site falso.

    Seja qual for o método, guarde os códigos de backup num lugar seguro, senão perder o celular pode significar perder a conta. Guardar os códigos de 2FA no mesmo gerenciador de senhas em que estão as suas senhas é prático, mas, se esse único cofre for comprometido algum dia, os dois fatores vão junto com ele.
  2FA: 2FA
  MFA: MFA
  multi-factor authentication: autenticação multifator
  two-step verification: verificação em duas etapas
  Anonymity, pseudonymity and privacy: Anonimato, pseudonimato e privacidade
  Privacy hides what you do, anonymity hides who you are, and pseudonymity puts a consistent made-up name between you and what you do.: A privacidade esconde o que você faz, o anonimato esconde quem você é e o pseudonimato coloca um nome inventado, sempre o mesmo, entre você e o que você faz.
  ? |
    These get mixed up all the time. Privacy is keeping what you do between you and the people you
    choose, like your messages, files and browsing. Anonymity is nobody knowing who did something,
    even if what was done is public. Pseudonymity sits in between: you act under a consistent name
    that isn't your real one, like a username, so people can recognise you without knowing who you
    are.

    You can have one without the others. An end-to-end encrypted chat with a friend is private but
    not anonymous, since you both know who's on the other end. A post made through Tor on a public
    forum can be anonymous but not private. Most online accounts are pseudonymous, and a pseudonym
    is only as good as the weakest link back to you, like a reused email address, a payment or a
    slip in something you post.

    Real anonymity is hard, and usually takes several tools plus careful habits - a VPN or a "no
    sign-up" app won't get you there alone. Work out which of the three you actually need, as it
    changes which tools make sense.
  : |-
    Essas três coisas vivem sendo confundidas. Privacidade é manter o que você faz entre você e as pessoas que escolher, como as suas mensagens, os seus arquivos e a sua navegação. Anonimato é ninguém saber quem fez alguma coisa, mesmo que o que foi feito seja público. O pseudonimato fica no meio do caminho: você usa sempre o mesmo nome, que não é o seu nome verdadeiro (um nome de usuário, por exemplo), e assim as pessoas conseguem reconhecer você sem saber quem você é.

    Dá para ter uma coisa sem as outras. Uma conversa criptografada de ponta a ponta com um amigo é privada, mas não anônima, já que vocês dois sabem quem está do outro lado. Um post feito pelo Tor num fórum público pode ser anônimo, mas não privado. A maioria das contas online é pseudônima, e um pseudônimo só é tão forte quanto o elo mais fraco que leva até você, como um endereço de e-mail reutilizado, um pagamento ou um deslize em algo que você posta.

    O anonimato de verdade é difícil e costuma exigir várias ferramentas e muito cuidado com os próprios hábitos. Uma VPN ou um app “sem cadastro” não resolve isso sozinho. Descubra de qual das três você realmente precisa, porque isso muda quais ferramentas fazem sentido.
  Browser fingerprinting: Impressão digital do navegador (fingerprinting)
  Identifying you by combining lots of small details about your browser and device, which works without cookies and survives clearing them.: Identificar você pela combinação de vários pequenos detalhes do seu navegador e do seu aparelho, algo que funciona sem cookies e continua funcionando depois que você os apaga.
  ? |
    Any page you load can read dozens of small details about your browser: screen size, time zone,
    language, installed fonts, tiny differences in how your hardware draws graphics (canvas
    fingerprinting) and plenty more. None of them identifies you on its own, but together they're
    often close to unique, so trackers can recognise you across sites and visits without storing
    anything on your device.

    That's what makes it awkward. Clearing cookies or opening a private window doesn't change your
    fingerprint, and a VPN only changes your IP address. Piling on extensions and unusual settings
    can make you stand out more, not less.

    There are two main defences. One is to look like everyone else, which is what Tor Browser does
    by making its users as alike as possible. The other is to randomise some of those details so
    your fingerprint keeps changing. You can see how your own browser does with the EFF's
    [Cover Your Tracks](https://coveryourtracks.eff.org/).
  : |-
    Qualquer página que você abre consegue ler dezenas de pequenos detalhes sobre o seu navegador: tamanho da tela, fuso horário, idioma, fontes instaladas, diferenças mínimas na forma como o seu hardware desenha gráficos (o chamado canvas fingerprinting) e muito mais. Nenhum deles identifica você sozinho, mas juntos costumam ser quase únicos, e assim os rastreadores conseguem reconhecer você em sites e visitas diferentes sem guardar nada no seu aparelho.

    É isso que complica as coisas. Apagar os cookies ou abrir uma janela anônima não muda a sua impressão digital, e uma VPN só muda o seu endereço IP. Encher o navegador de extensões e configurações incomuns pode fazer você se destacar mais, e não menos.

    Há duas defesas principais. Uma é ficar igual a todo mundo, que é o que o Tor Browser faz ao deixar todos os usuários o mais parecidos possível. A outra é randomizar alguns desses detalhes para que a sua impressão digital mude o tempo todo. Você pode ver como o seu próprio navegador se sai com o [Cover Your Tracks](https://coveryourtracks.eff.org/), da EFF.
  device fingerprinting: impressão digital do dispositivo
  Custom ROM: ROM customizada
  A replacement version of Android you install yourself, often with Google's apps and services stripped out to cut down on tracking.: Uma versão alternativa do Android que você mesmo instala, muitas vezes sem os apps e serviços do Google, para reduzir o rastreamento.
  ? |
    A custom ROM is an alternative version of Android, built from Google's open source code but put
    together by someone else. Many are "de-Googled", meaning they leave out Google Play Services,
    the background layer that runs with deep access on most Android phones. Installing one usually
    wipes your phone and means switching off its bootloader lock, which normally only lets the
    maker's own software start up.

    There are trade-offs. Some apps lean on Play Services for notifications, maps or payments and
    break or complain without it, though some ROMs offer workarounds like an open source stand-in or
    a sandboxed copy of Google's own. Banking and payment apps may refuse to run at all. Not every
    ROM is as secure as the stock software, either - some can't turn the bootloader lock back on,
    which makes it easier for someone who gets hold of your phone to tamper with it.

    Device support matters most. Check that your exact model is officially supported, how quickly
    security updates arrive and whether the project's still active, since a ROM that stops getting
    updates can leave you worse off than the stock software it replaced.
  : |-
    Uma ROM customizada é uma versão alternativa do Android, feita a partir do código aberto do Google, mas montada por terceiros. Muitas são “sem Google”, ou seja, deixam de fora o Google Play Services, a camada que roda em segundo plano com amplo acesso ao sistema na maioria dos celulares Android. Instalar uma costuma apagar tudo o que está no celular e exige desativar o bloqueio do bootloader, que normalmente só deixa iniciar o software do próprio fabricante.

    Há prós e contras. Alguns apps dependem do Play Services para notificações, mapas ou pagamentos e param de funcionar ou reclamam sem ele, embora algumas ROMs ofereçam alternativas, como um substituto de código aberto ou uma cópia do próprio Play Services rodando em sandbox. Apps de banco e de pagamento podem simplesmente se recusar a funcionar. Além disso, nem toda ROM é tão segura quanto o software de fábrica: algumas não conseguem reativar o bloqueio do bootloader, o que facilita a vida de quem puser as mãos no seu celular e quiser adulterá-lo.

    O mais importante é o suporte ao aparelho. Confira se o seu modelo exato tem suporte oficial, com que rapidez chegam as atualizações de segurança e se o projeto ainda está ativo, já que uma ROM que para de receber atualizações pode deixar você numa situação pior do que com o software de fábrica que ela substituiu.
  de-Googled phone: celular sem Google
  de-Googled Android: Android sem Google
  Data broker: Corretor de dados
  A company that collects personal information about you from lots of sources and sells or rents it to whoever's buying.: Uma empresa que junta informações pessoais sobre você a partir de várias fontes e as vende ou aluga para quem estiver disposto a pagar.
  ? |
    Data brokers build profiles on people without ever dealing with them directly. They pull from
    public records, loyalty schemes, apps, online tracking, purchase histories and other companies'
    databases, then piece it all together: your name, addresses, phone numbers, age, likely income,
    interests and sometimes where you go.

    Those profiles get sold to advertisers, people-search sites, insurers and sometimes police or
    government agencies. You've almost certainly never heard of most of the companies involved,
    which is rather the point.

    You can ask brokers to delete your data - in the UK and EU you've got a legal right to, and some
    US states have similar laws - but there are hundreds of them and your details tend to reappear.
    Paid removal services send the requests for you, though they can't reach every broker. The
    longer-term fix is giving out less in the first place, with email aliases, virtual phone numbers
    and virtual cards.
  : |-
    Os corretores de dados montam perfis de pessoas sem nunca lidar diretamente com elas. Eles puxam informações de registros públicos, programas de fidelidade, apps, rastreamento online, históricos de compras e bancos de dados de outras empresas e depois juntam tudo: o seu nome, endereços, números de telefone, idade, renda provável, interesses e, às vezes, os lugares por onde você anda.

    Esses perfis são vendidos para anunciantes, sites de busca de pessoas, seguradoras e, às vezes, para a polícia ou órgãos do governo. Você quase certamente nunca ouviu falar da maioria das empresas envolvidas, e a ideia é justamente essa.

    Você pode pedir aos corretores que apaguem os seus dados (no Reino Unido e na UE, a lei garante esse direito, e alguns estados dos EUA têm leis parecidas), mas eles são centenas e os seus dados costumam reaparecer. Serviços pagos de remoção enviam os pedidos por você, embora não consigam chegar a todos os corretores. A solução de longo prazo é fornecer menos dados desde o início, com aliases de e-mail, números de telefone virtuais e cartões virtuais.
  information broker: corretor de informações
  data aggregator: agregador de dados
  Domain Name System: Sistema de Nomes de Domínio
  The internet's phone book, which turns names like example.com into the IP addresses your device actually connects to.: A lista telefônica da internet, que transforma nomes como example.com nos endereços IP aos quais o seu aparelho de fato se conecta.
  ? |
    Before your device can load a site, it asks a DNS resolver for the site's IP address. By default
    that's usually your ISP's resolver, handed out by your router. Ordinary DNS isn't encrypted, so
    your ISP and anyone else on the network can see every domain you look up, even when the site
    itself uses HTTPS. Whoever runs the resolver can also log your lookups, block them or send you
    somewhere else.

    That's why your choice of resolver matters. Switching to a privacy-focused one (ideally over
    encrypted DNS) means your ISP isn't the one keeping a list, and many also block ads, trackers or
    malware for you. The new provider sees your lookups instead, so check its logging policy and
    where it's based.

    Running DNS for your own domain is a separate job, called DNS hosting. That's about publishing
    records so other people can find your website and email, rather than looking things up for
    yourself.
  : |-
    Antes de carregar um site, o seu aparelho pergunta a um resolvedor de DNS qual é o endereço IP do site. Por padrão, costuma ser o resolvedor do seu provedor de internet, repassado pelo seu roteador. O DNS comum não é criptografado, então o seu provedor e qualquer outra pessoa na rede conseguem ver cada domínio que você consulta, mesmo quando o próprio site usa HTTPS. Quem administra o resolvedor também pode registrar as suas consultas, bloqueá-las ou mandar você para outro lugar.

    É por isso que a escolha do resolvedor faz diferença. Mudar para um que seja focado em privacidade (de preferência com DNS criptografado) significa que não é mais o seu provedor de internet que fica com a lista, e muitos também bloqueiam anúncios, rastreadores ou malware para você. Em compensação, quem passa a ver as suas consultas é o novo provedor de DNS, por isso vale conferir a política de logs dele e onde fica a sede.

    Cuidar do DNS do seu próprio domínio é outra tarefa, chamada de hospedagem de DNS. Nesse caso, o trabalho é publicar registros para que outras pessoas encontrem o seu site e o seu e-mail, e não fazer consultas para você mesmo.
  DNS: DNS
  DNS leak: Vazamento de DNS
  When your DNS lookups go around your VPN, usually to your ISP, giving away the sites you visit while you think you're covered.: Quando as suas consultas de DNS passam por fora da VPN, geralmente indo para o seu provedor de internet, e revelam os sites que você visita enquanto você acha que está protegido.
  ? |
    On a VPN, your DNS lookups should go through the tunnel to the resolver your VPN uses. A DNS
    leak is when some of them go out the normal way instead, usually to your ISP. Your traffic's
    still encrypted, but your ISP gets a running list of the domains you're visiting, which is a
    good chunk of what you were trying to hide.

    Leaks usually come from your operating system doing its own thing: sending lookups out over
    every network connection it has, using IPv6 when the VPN only handles IPv4, or sticking with a
    DNS server you set by hand.

    Good VPN apps have leak protection built in and switched on. To check, connect to your VPN and
    run a DNS leak test - if any of the servers it lists belong to your ISP, you've got a leak. A
    kill switch that blocks everything outside the tunnel usually stops it too.
  : |-
    Com uma VPN, as suas consultas de DNS deveriam passar pelo túnel até o resolvedor que a VPN usa. Um vazamento de DNS acontece quando algumas delas saem pelo caminho normal, normalmente para o seu provedor de internet. O seu tráfego continua criptografado, mas o provedor recebe uma lista sempre atualizada dos domínios que você visita, o que é boa parte do que você queria esconder.

    Os vazamentos costumam acontecer porque o sistema operacional resolve agir por conta própria: manda consultas por todas as conexões de rede que tem, usa IPv6 quando a VPN só cuida do IPv4 ou continua usando um servidor DNS que você configurou manualmente.

    Os bons apps de VPN já vêm com proteção contra vazamentos embutida e ativada. Para conferir, conecte-se à VPN e faça um teste de vazamento de DNS: se algum dos servidores listados for do seu provedor de internet, há um vazamento. Um kill switch que bloqueia tudo o que estiver fora do túnel também costuma resolver.
  End-to-end encryption: Criptografia de ponta a ponta
  Encryption where only the people at each end hold the keys, so the company in the middle can't read your messages or files.: Criptografia em que só as pessoas em cada ponta têm as chaves, então a empresa no meio do caminho não consegue ler as suas mensagens ou arquivos.
  ? |
    With end-to-end encryption, your message is encrypted on your device and only decrypted on the
    recipient's. The service in between just passes along scrambled data it has no key for, so
    anything it leaks in a breach or is forced to hand over is gibberish. The Signal Protocol is the
    best-known way of doing it, and plenty of apps use it.

    What it doesn't hide is metadata - who you talked to, when and how often. It can't help if
    someone gets into your phone, and it won't stop the person you're talking to from taking
    screenshots. Backups are a common gap too: if your chat history goes to the cloud without the
    same encryption, that copy isn't protected.

    In a closed source app you're taking the company's word that it's really end-to-end, so look for
    open source apps, a published security audit and a way to check you're talking to the right
    person (usually by comparing a safety number or scanning a QR code). Be wary of "encrypted" on
    its own, as it often only means encrypted in transit, which the company can still read.
  : |-
    Com a criptografia de ponta a ponta, a sua mensagem é criptografada no seu aparelho e só é descriptografada no aparelho de quem a recebe. O serviço no meio do caminho só repassa dados embaralhados para os quais não tem a chave, então qualquer coisa que vaze numa invasão ou que ele seja obrigado a entregar não passa de dados ilegíveis. O protocolo Signal é a forma mais conhecida de fazer isso, e muitos apps o usam.

    O que ela não esconde são os metadados: com quem você falou, quando e com que frequência. Ela não ajuda se alguém entrar no seu celular e não impede que a pessoa com quem você está conversando tire capturas de tela. Os backups também são uma brecha comum: se o seu histórico de conversas vai para a nuvem sem a mesma criptografia, essa cópia não está protegida.

    Num app de código fechado, você tem que acreditar na empresa quando ela diz que a criptografia é mesmo de ponta a ponta. Por isso, procure apps de código aberto, uma auditoria de segurança publicada e uma forma de confirmar que você está falando com a pessoa certa (geralmente comparando um número de segurança ou escaneando um QR code). Desconfie de um “criptografado” sem mais detalhes, porque muitas vezes isso só quer dizer criptografado em trânsito, e aí a empresa ainda consegue ler.
  E2EE: E2EE
  E2E encryption: criptografia E2E
  Email alias: Alias de e-mail
  A separate email address that forwards to your real inbox, so each site gets its own address and you can switch it off if it gets spammed.: Um endereço de e-mail à parte que encaminha as mensagens para a sua caixa de entrada real, para que cada site receba um endereço próprio e você possa desativá-lo se ele começar a receber spam.
  ? |
    An alias is an address that just forwards mail to your real inbox. Use a different one for every
    site and your real address never gets out. If one starts getting spam, you'll know exactly who
    leaked or sold it, and you can turn that alias off without touching anything else. Many alias
    services also let you reply from the alias, so the other side never sees your real address.

    Aliases make it much harder for data brokers and marketers to join up your accounts by email
    address, and they limit the fallout when a site gets breached. Plus addressing
    (`yourname+shop@example.com`) is a weaker version of the same trick, as your real address is
    right there for anyone who strips off the plus bit.

    The alias provider sees every email that passes through, so pick one you'd trust with your
    inbox. Using your own domain means you can switch providers later without losing your aliases,
    and some services will encrypt forwarded mail with your PGP key. Aliases aren't the same as
    disposable inboxes, which are often public and short-lived.
  : |-
    Um alias é um endereço que só encaminha os e-mails para a sua caixa de entrada real. Use um diferente para cada site, e o seu endereço real nunca circula por aí. Se um deles começar a receber spam, você vai saber exatamente quem vazou ou vendeu o endereço e pode desativar esse alias sem mexer em mais nada. Muitos serviços de alias também deixam você responder pelo alias, então o outro lado nunca vê o seu endereço real.

    Os aliases dificultam muito que corretores de dados e empresas de marketing liguem as suas contas pelo endereço de e-mail, e limitam o estrago quando um site sofre uma invasão. O endereço com sinal de mais (`yourname+shop@example.com`) é uma versão mais fraca do mesmo truque, já que o seu endereço real fica ali, à vista de qualquer pessoa que apague o que vem depois do +.

    O serviço de alias vê todos os e-mails que passam por ele, por isso escolha um a quem você confiaria a sua caixa de entrada. Usar o seu próprio domínio permite trocar de serviço mais tarde sem perder os seus aliases, e alguns serviços criptografam os e-mails encaminhados com a sua chave PGP. Aliases não são a mesma coisa que caixas de e-mail descartáveis, que muitas vezes são públicas e duram pouco.
  masked email: máscara de e-mail
  forwarding address: endereço de encaminhamento
  email aliasing: apelido de e-mail
  DNS over HTTPS and DNS over TLS: DNS sobre HTTPS e DNS sobre TLS
  Ways of encrypting your DNS lookups, so your ISP or the network you're on can't read or tamper with them on the way to the resolver.: Formas de criptografar as suas consultas de DNS, para que o seu provedor de internet ou a rede em que você está não consiga lê-las nem alterá-las no caminho até o resolvedor.
  ? |
    Both protect your lookups between your device and the resolver. DNS over HTTPS (DoH) sends them
    as ordinary web traffic, which makes it harder to spot or block. DNS over TLS (DoT) uses its own
    port, which is tidier but easier for a network to block. DNSCrypt is an older protocol that does
    a similar job. Most browsers and operating systems support at least one of them, and on Android
    it's the "Private DNS" setting.

    They only hide your lookups from the network in between. The resolver still sees every one, so
    you need to trust whoever runs it. Your ISP can also still see the IP addresses you connect to,
    and often the site's name too, which goes out unencrypted at the start of most secure
    connections. It's a sensible upgrade, but it won't hide your browsing on its own.

    If you use a VPN, your lookups already travel inside the tunnel, so the VPN's own resolver is
    usually the simplest choice.
  : |-
    Os dois protegem as suas consultas entre o seu aparelho e o resolvedor. O DNS sobre HTTPS (DoH) as envia como tráfego web comum, o que torna mais difícil identificá-las ou bloqueá-las. O DNS sobre TLS (DoT) usa uma porta própria, o que é mais limpo, mas facilita o bloqueio pela rede. O DNSCrypt é um protocolo mais antigo que faz um trabalho parecido. A maioria dos navegadores e sistemas operacionais tem suporte a pelo menos um deles, e no Android é a configuração “DNS particular”.

    Eles só escondem as suas consultas da rede que fica no meio do caminho. O resolvedor continua vendo todas, então você precisa confiar em quem o administra. E o seu provedor de internet ainda vê os endereços IP aos quais você se conecta e, muitas vezes, até o nome do site, que vai sem criptografia no início da maioria das conexões seguras. É uma melhoria que vale a pena, mas sozinha não esconde a sua navegação.

    Se você usa uma VPN, as suas consultas já passam por dentro do túnel, então o próprio resolvedor da VPN costuma ser a opção mais simples.
  DoH: DoH
  DoT: DoT
  encrypted DNS: DNS criptografado
  Encryption at rest: Criptografia em repouso
  Encrypting data while it's stored on a disk, phone or server, so it's unreadable if the hardware is lost, stolen or thrown out.: Criptografar os dados enquanto estão guardados num disco, celular ou servidor, para que fiquem ilegíveis se o equipamento for perdido, roubado ou jogado fora.
  ? |
    Encryption at rest protects stored data. On your own devices that means full-disk encryption: if
    your laptop's nicked or your phone goes missing, nobody can read what's on it without your
    password or PIN. Phones do it by default these days, and the main desktop operating systems have
    it built in, though it isn't always switched on.

    It does most of its work while the device is off or locked. Once you've logged in, your data is
    readable to you and to any malware you've picked up. For online services, "encrypted at rest"
    usually means the company encrypts its disks and keeps the keys itself. That stops someone
    walking out of a data centre with a hard drive, but the company can still read your data, and so
    can anyone with a court order.

    If you want a provider that can't read your stuff, you need zero-knowledge or end-to-end
    encryption instead, or to encrypt files yourself before you upload them.
  : |-
    A criptografia em repouso protege os dados armazenados. Nos seus próprios aparelhos, isso quer dizer criptografia de disco completo: se roubarem o seu notebook ou o seu celular sumir, ninguém consegue ler o que tem nele sem a sua senha ou PIN. Os celulares já fazem isso por padrão hoje em dia, e os principais sistemas operacionais de computador trazem o recurso embutido, embora ele nem sempre esteja ativado.

    Ela faz a maior parte do trabalho enquanto o aparelho está desligado ou bloqueado. Depois que você faz login, os seus dados ficam legíveis para você e para qualquer malware que tenha infectado o aparelho. Em serviços online, “criptografado em repouso” costuma significar que a empresa criptografa os próprios discos e fica com as chaves. Isso impede que alguém saia de um data center levando um disco rígido, mas a empresa ainda consegue ler os seus dados, assim como qualquer pessoa com uma ordem judicial.

    Se você quer um provedor que não consiga ler as suas coisas, precisa de criptografia de conhecimento zero ou de ponta a ponta, ou então criptografar os arquivos você mesmo antes de enviá-los.
  storage encryption: criptografia de armazenamento
  full-disk encryption: criptografia de disco completo
  Encryption in transit: Criptografia em trânsito
  Encrypting data while it travels between your device and a server, so people on the network can't read it, though the server still can.: Criptografar os dados enquanto eles viajam entre o seu aparelho e um servidor, para que ninguém na rede consiga lê-los, embora o servidor ainda consiga.
  ? |
    Encryption in transit protects data on its way from A to B. It's what the S in HTTPS is about:
    TLS (the successor to SSL) encrypts the connection, so your ISP, the coffee shop Wi-Fi or anyone
    else in the middle can't read or change what you send. Almost every site and app uses it now,
    and one that doesn't is a red flag.

    But it stops at the server. The company decrypts your data when it arrives and can read, scan or
    store it, or be made to hand it over. So when a service says your data is "encrypted", that
    often just means this, maybe with encryption at rest on top. For a provider that can't read your
    stuff, you need end-to-end or zero-knowledge encryption.

    Email is a special case. Mail between providers is usually encrypted in transit too, but only
    when both servers support it, so some messages still cross the internet in plain text. Even when
    it's encrypted, every server that handles it can read it.
  : |-
    A criptografia em trânsito protege os dados no caminho de A até B. É isso que o S do HTTPS indica: o TLS (o sucessor do SSL) criptografa a conexão, para que o seu provedor de internet, o Wi-Fi da cafeteria ou qualquer outro intermediário não consiga ler nem alterar o que você envia. Quase todo site e app usa isso hoje, e um que não use é um sinal de alerta.

    Mas ela termina no servidor. A empresa descriptografa os seus dados quando eles chegam e pode lê-los, vasculhá-los ou guardá-los, ou ser obrigada a entregá-los. Por isso, quando um serviço diz que os seus dados são “criptografados”, muitas vezes quer dizer só isso, talvez junto com a criptografia em repouso. Para ter um provedor que não consiga ler as suas coisas, você precisa de criptografia de ponta a ponta ou de conhecimento zero.

    O e-mail é um caso à parte. As mensagens entre provedores também costumam ser criptografadas em trânsito, mas só quando os dois servidores têm suporte a isso, então algumas mensagens ainda atravessam a internet em texto puro. E, mesmo quando estão criptografadas, todo servidor que lida com elas consegue lê-las.
  TLS encryption: criptografia TLS
  SSL encryption: criptografia SSL
  transport encryption: criptografia de transporte
  Federation: Federação
  Lots of independently run servers that talk to each other, so you can pick (or run) your own server and still reach everyone else.: Vários servidores administrados de forma independente que conversam entre si, para que você possa escolher (ou rodar) o seu próprio servidor e ainda assim falar com todo mundo.
  ? |
    Email is the classic example of federation: you can be with one provider and email someone with
    another, and neither of them is in charge. Matrix (for chat) and Mastodon (for social media)
    work the same way, each made up of thousands of servers that speak a shared protocol. Mastodon
    and everything else built on ActivityPub are known together as the fediverse.

    No single company owns the network, so nobody can sell it, fill it with ads or lock you in, and
    if you don't like your server's rules you can move. The flip side is that your server's admins
    can see anything it stores unencrypted, and whatever you send to people on other servers gets
    copied there too. Deleting it later asks those servers to delete their copies, but nothing
    forces them to.

    So pick a server run by people you trust, or run your own. And check what's end-to-end
    encrypted - on some federated platforms private messages are, and on others the admins of both
    servers can read them.
  : |-
    O e-mail é o exemplo clássico de federação: você pode usar um provedor e mandar e-mail para alguém que usa outro, e nenhum dos dois provedores está no comando. O Matrix (para chat) e o Mastodon (para redes sociais) funcionam do mesmo jeito, cada um formado por milhares de servidores que falam um protocolo em comum. O Mastodon e tudo o mais que é construído sobre o ActivityPub são conhecidos, juntos, como o fediverso.

    Nenhuma empresa é dona da rede, então ninguém pode vendê-la, enchê-la de anúncios ou prender você nela, e, se você não gostar das regras do seu servidor, pode trocar de servidor. O outro lado da moeda é que os administradores do seu servidor podem ver tudo o que ele guarda sem criptografia, e o que você envia para pessoas em outros servidores também é copiado para lá. Se você apagar depois, esses servidores recebem um pedido para apagar as cópias deles, mas nada os obriga a fazer isso.

    Então escolha um servidor administrado por pessoas em quem você confia, ou rode o seu. E confira o que tem criptografia de ponta a ponta: em algumas plataformas federadas, as mensagens privadas têm, e em outras os administradores dos dois servidores conseguem lê-las.
  federated networks: redes federadas
  Five Eyes and Fourteen Eyes: Cinco Olhos e Quatorze Olhos
  An intelligence-sharing alliance between the UK, US, Canada, Australia and New Zealand, plus wider groups known as the Nine and Fourteen Eyes.: Uma aliança de compartilhamento de inteligência entre o Reino Unido, os EUA, o Canadá, a Austrália e a Nova Zelândia, além de grupos maiores conhecidos como Nove Olhos e Quatorze Olhos.
  ? |
    The [Five Eyes](https://en.wikipedia.org/wiki/Five_Eyes) grew out of the UKUSA Agreement of
    1946, and today the UK, US, Canada, Australia and New Zealand share signals intelligence through
    it. Wider, looser groups have been reported too. The Nine Eyes adds Denmark, France, the
    Netherlands and Norway, and the Fourteen Eyes adds Belgium, Germany, Italy, Spain and Sweden.

    You'll see it all over VPN marketing, usually as "based outside the 14 Eyes". These countries do
    work closely together, and some have sweeping surveillance laws. But it isn't a magic line.
    Intelligence agencies spy on foreign communications anyway, and every country has some way of
    making a business on its own soil cooperate.

    What a provider can be forced to hand over, and what it actually keeps, matter far more than
    which list its country is on. A service that only ever holds encrypted data it can't read is in
    a much better spot wherever it's based.
  : |-
    Os [Cinco Olhos](https://en.wikipedia.org/wiki/Five_Eyes) nasceram do Acordo UKUSA, de 1946, e hoje é por meio deles que o Reino Unido, os EUA, o Canadá, a Austrália e a Nova Zelândia compartilham inteligência de sinais. Também já foram noticiados grupos mais amplos e menos formais. Os Nove Olhos acrescentam a Dinamarca, a França, os Países Baixos e a Noruega, e os Quatorze Olhos acrescentam a Bélgica, a Alemanha, a Itália, a Espanha e a Suécia.

    Você vai ver isso por toda parte no marketing das VPNs, geralmente como “com sede fora dos 14 Olhos”. Esses países de fato trabalham em estreita colaboração, e alguns têm leis de vigilância muito abrangentes. Mas essa fronteira não tem nada de mágica. As agências de inteligência espionam as comunicações estrangeiras de qualquer jeito, e todo país tem alguma forma de obrigar uma empresa instalada no próprio território a cooperar.

    O que um provedor pode ser obrigado a entregar, e o que ele realmente guarda, importam muito mais do que a lista em que o país dele está. Um serviço que só guarda dados criptografados que ele mesmo não consegue ler fica numa posição muito melhor, não importa onde tenha sede.
  FVEY: FVEY
  5 Eyes: Five Eyes
  14 Eyes: 14 Olhos
  Forward secrecy: Forward secrecy
  Giving each session or message its own short-lived keys, so a key stolen later can't decrypt all your old conversations.: Dar a cada sessão ou mensagem chaves próprias de curta duração, para que uma chave roubada mais tarde não consiga descriptografar todas as suas conversas antigas.
  ? |
    Without forward secrecy, everything encrypted with a long-term key is only as safe as that key.
    If someone records your encrypted traffic today and steals the key in five years, they can go
    back and decrypt all of it. With forward secrecy, each session (or, in good messaging apps, each
    message) uses short-lived keys that get thrown away, so old traffic stays scrambled even if a
    long-term key leaks.

    Modern HTTPS (TLS 1.3) has it built in, and so does the Signal Protocol, which goes a step
    further and can recover after a key's been stolen, so future messages become safe again. PGP
    email doesn't have forward secrecy, which is one of the main criticisms of it.

    It's not something you can usually switch on yourself, as it's down to the protocol an app uses.
    When you're comparing messaging apps, having it is a good sign the encryption is modern and well
    designed.
  : |-
    Sem forward secrecy, a segurança de tudo o que é criptografado com uma chave de longo prazo depende só dessa chave. Se alguém gravar o seu tráfego criptografado hoje e roubar a chave daqui a cinco anos, pode voltar e descriptografar tudo. Com forward secrecy, cada sessão (ou, nos bons apps de mensagens, cada mensagem) usa chaves de curta duração que depois são descartadas, então o tráfego antigo continua embaralhado mesmo que uma chave de longo prazo vaze.

    O HTTPS moderno (TLS 1.3) já vem com isso, assim como o protocolo Signal, que vai além e consegue se recuperar depois que uma chave é roubada, de modo que as mensagens futuras voltam a ficar seguras. O e-mail com PGP não tem forward secrecy, e essa é uma das principais críticas a ele.

    Normalmente não é algo que você mesmo possa ativar, porque depende do protocolo que o app usa. Na hora de comparar apps de mensagens, ter forward secrecy é um bom sinal de que a criptografia é moderna e bem projetada.
  perfect forward secrecy: perfect forward secrecy
  PFS: PFS
  Free and open source software: Software livre e de código aberto
  Software that's free as in freedom - you can run, study, change and share it - which in practice nearly always means open source too.: "Software que respeita a sua liberdade: você pode rodá-lo, estudá-lo, modificá-lo e compartilhá-lo. Na prática, isso quase sempre significa que ele também é de código aberto."
  ? |
    The "free" in FOSS is about freedom, not price, or as the old line goes, "free as in speech, not
    as in beer". The Free Software Foundation
    [defines it](https://www.gnu.org/philosophy/free-sw.html) as four freedoms: to run the program
    however you like, to study and change how it works, to share copies, and to share your changed
    versions. FLOSS (free/libre and open source software) means the same thing, with "libre" added
    to dodge the price confusion.

    In practice, nearly all free software is open source and the other way round. The difference is
    mostly philosophy: free software folk see it as an ethical issue, open source folk as a better
    way to build software. Licences split along a different line. Copyleft licences like the GPL
    make anyone who distributes a changed version share their code on the same terms, while
    permissive ones like MIT let people make closed versions.

    The AGPL goes a step further and covers software run as an online service, so anyone hosting a
    modified version has to offer its users the source. On Android, the F-Droid app store only lists
    FOSS apps, and flags the ones with tracking or other anti-features.
  : |-
    O “free” de FOSS se refere à liberdade, não ao preço, ou, como diz a velha frase, “free” como em liberdade de expressão, não como em cerveja grátis. A Free Software Foundation [define o conceito](https://www.gnu.org/philosophy/free-sw.html) em quatro liberdades: rodar o programa como você quiser, estudar e modificar o funcionamento dele, compartilhar cópias e compartilhar as suas versões modificadas. FLOSS (free/libre and open source software) quer dizer a mesma coisa, com o “libre” acrescentado para evitar a confusão com preço.

    Na prática, quase todo software livre é de código aberto, e vice-versa. A diferença é mais de filosofia: o pessoal do software livre vê a questão como ética, e o do código aberto, como uma forma melhor de desenvolver software. As licenças se dividem de outro jeito. As licenças copyleft, como a GPL, obrigam quem distribui uma versão modificada a compartilhar o código nos mesmos termos, enquanto as permissivas, como a MIT, deixam as pessoas criarem versões fechadas.

    A AGPL vai um passo além e cobre também o software rodado como serviço online, então quem hospeda uma versão modificada tem que oferecer o código-fonte aos usuários dela. No Android, a loja de apps F-Droid só lista apps FOSS e sinaliza os que têm rastreamento ou outras características indesejáveis.
  FOSS: FOSS
  FLOSS: FLOSS
  free software: free software
  libre software: software livre
  Hardware security key: Chave de segurança física
  A small USB or NFC device you tap to log in, which proves it's really you and won't work on phishing sites.: Um pequeno dispositivo USB ou NFC que você toca para fazer login, provando que é você mesmo, e que não funciona em sites de phishing.
  ? |
    A hardware security key is a small device, usually on your keyring, that plugs into a USB port
    or taps against your phone over NFC. It holds cryptographic keys that never leave it, so malware
    on your computer can't copy them. You can use it as a second factor alongside your password, or
    on newer keys to hold passkeys and skip the password entirely.

    Like passkeys, security keys check the website's real address before they'll sign you in, so
    they're one of the few logins that phishing can't easily beat. That's why they're the usual
    advice for anyone likely to be targeted, like journalists, activists or people with money or
    access worth stealing. Some can also generate TOTP codes, hold PGP keys or work as a smart card.

    Buy two and register both, and keep the spare somewhere safe, because losing your only key means
    relying on recovery codes (or getting locked out). Check that the services you care about
    support them and let you add more than one. Keys only have room for a limited number of
    passkeys, so check the spec if you plan to store a lot.
  : |-
    Uma chave de segurança física é um pequeno dispositivo, geralmente pendurado no chaveiro, que você conecta numa porta USB ou encosta no celular por NFC. Ela guarda chaves criptográficas que nunca saem dela, por isso um malware no seu computador não consegue copiá-las. Você pode usá-la como segundo fator junto com a senha ou, nas chaves mais novas, para guardar chaves de acesso e dispensar a senha de vez.

    Assim como as chaves de acesso, as chaves de segurança conferem o endereço real do site antes de deixar você entrar, o que as coloca entre os poucos tipos de login que o phishing não consegue vencer com facilidade. É por isso que elas são a recomendação de sempre para quem tem mais chance de virar alvo, como jornalistas, ativistas ou pessoas com dinheiro ou acessos que valham a pena roubar. Algumas também conseguem gerar códigos TOTP, guardar chaves PGP ou funcionar como smart card.

    Compre duas, registre as duas e guarde a reserva num lugar seguro, porque perder a sua única chave significa depender dos códigos de recuperação (ou ficar sem acesso). Confira se os serviços que importam para você têm suporte a elas e deixam adicionar mais de uma. As chaves só têm espaço para um número limitado de chaves de acesso, então veja as especificações se você pretende guardar muitas.
  security key: chave de segurança
  FIDO key: chave FIDO
  U2F key: chave U2F
  Jurisdiction: Jurisdição
  The country whose laws a service has to follow, which decides who can demand your data and what the company can be made to do.: O país cujas leis um serviço tem que seguir, o que define quem pode exigir os seus dados e o que a empresa pode ser obrigada a fazer.
  ? |
    A service's jurisdiction is the country (or countries) whose laws it has to follow, usually
    where it's registered plus wherever it has servers or staff. Those laws decide whether it can be
    made to hand over your data, keep logs it otherwise wouldn't, monitor a particular user, or keep
    quiet about any of it. They also set your rights - in the UK and EU, for example, you can ask
    for a copy of your data or have it deleted.

    Privacy-focused companies often base themselves somewhere with strong privacy laws, and say so
    loudly. That's a real plus, but it has limits. Providers in privacy-friendly countries have
    still been ordered to log specific users, and police in one country can ask another to get data
    on their behalf.

    Jurisdiction matters most when a company holds data it can read. If your data's end-to-end
    encrypted and the provider keeps little else, there's much less for any court to get hold of.
  : |-
    A jurisdição de um serviço é o país (ou os países) cujas leis ele tem que seguir, geralmente o lugar onde está registrado e também qualquer lugar onde tenha servidores ou funcionários. Essas leis definem se ele pode ser obrigado a entregar os seus dados, guardar logs que normalmente não guardaria, monitorar um usuário específico ou ficar calado sobre tudo isso. Elas também definem os seus direitos: no Reino Unido e na UE, por exemplo, você pode pedir uma cópia dos seus dados ou que eles sejam apagados.

    Empresas focadas em privacidade muitas vezes se instalam em países com leis de privacidade fortes, e fazem questão de anunciar isso. É uma vantagem real, mas tem limites. Provedores em países favoráveis à privacidade mesmo assim já receberam ordens para registrar a atividade de usuários específicos, e a polícia de um país pode pedir a outro país que obtenha dados em nome dela.

    A jurisdição pesa mais quando a empresa guarda dados que consegue ler. Se os seus dados têm criptografia de ponta a ponta e o provedor guarda pouca coisa além disso, sobra bem menos para qualquer tribunal pôr as mãos.
  Kill switch: Kill switch
  A VPN setting that cuts off your internet if the VPN connection drops, so nothing gets sent outside the tunnel.: Uma configuração da VPN que corta a sua internet se a conexão com a VPN cair, para que nada seja enviado fora do túnel.
  ? |
    VPN connections drop more often than you'd think, like when you switch networks, wake your
    laptop or a server goes down. Without a kill switch your device just carries on over your normal
    connection, often without telling you, and your real IP address and browsing are out in the
    open. A kill switch blocks all traffic until the VPN's back.

    They're not all equal. Some only work while the VPN app's running, so if the app crashes, your
    protection goes with it. Better ones set firewall rules in your operating system that stay in
    place even if the app doesn't, and some block traffic from the moment your device starts up. On
    Android, look for the built-in "Always-on VPN" and "Block connections without VPN" settings.

    Check whether it's on by default, since it isn't always. Some apps also have a stricter mode
    that blocks everything unless the VPN's connected, even after you've switched the VPN off
    yourself.
  : |-
    As conexões de VPN caem mais do que você imagina, como quando você troca de rede, tira o notebook da suspensão ou um servidor sai do ar. Sem um kill switch, o seu aparelho simplesmente continua pela conexão normal, muitas vezes sem avisar, e o seu endereço IP real e a sua navegação ficam expostos. O kill switch bloqueia todo o tráfego até a VPN voltar.

    Nem todos são iguais. Alguns só funcionam enquanto o app da VPN está rodando, então, se o app travar, a proteção vai junto. Os melhores criam regras de firewall no sistema operacional que continuam valendo mesmo que o app pare, e alguns bloqueiam o tráfego desde o momento em que o aparelho liga. No Android, procure as configurações nativas “VPN sempre ativa” e “Bloquear conexões sem VPN”.

    Confira se ele vem ativado por padrão, porque nem sempre vem. Alguns apps também têm um modo mais rígido, que bloqueia tudo a não ser que a VPN esteja conectada, mesmo depois de você mesmo ter desligado a VPN.
  VPN kill switch: kill switch de VPN
  Know your customer: Conheça seu cliente
  The identity checks that banks, card providers and crypto exchanges have to run before you can use them, usually with a photo ID.: As verificações de identidade que bancos, emissores de cartão e corretoras de criptomoedas são obrigados a fazer antes de você poder usá-los, geralmente com um documento com foto.
  ? |
    KYC rules are there to fight fraud and money laundering, and they apply to most regulated
    financial services, including banks, card issuers, payment apps and big crypto exchanges.
    Signing up means handing over your name, address and date of birth, often with a photo of your
    ID and a selfie, and the company has to keep those records for years.

    For privacy, that means your real identity is tied to everything you do on the service, and
    copies of your ID are stored in a database that could leak (and some have). Some services
    outside finance ask for ID too, like phone number providers in countries where the law requires
    it.

    Doing without KYC, legally, usually means smaller amounts and fewer features: cash, prepaid
    cards with low limits, peer-to-peer crypto trading or services that don't ask. The rules vary a
    lot by country, so check what applies where you are.
  : |-
    As regras de KYC existem para combater fraudes e lavagem de dinheiro e valem para a maioria dos serviços financeiros regulados, incluindo bancos, emissores de cartão, apps de pagamento e as grandes corretoras de criptomoedas. Fazer o cadastro significa entregar o seu nome, endereço e data de nascimento, muitas vezes com uma foto do seu documento e uma selfie, e a empresa tem que guardar esses registros por anos.

    Para a privacidade, isso quer dizer que a sua identidade real fica ligada a tudo o que você faz no serviço, e que cópias do seu documento ficam guardadas num banco de dados que pode vazar (e alguns já vazaram). Alguns serviços fora do setor financeiro também pedem documento, como serviços de número de telefone em países onde a lei exige isso.

    Ficar sem KYC, dentro da lei, geralmente significa valores menores e menos recursos: dinheiro vivo, cartões pré-pagos com limites baixos, negociação de criptomoedas peer-to-peer ou serviços que não pedem documento. As regras variam muito de país para país, então confira o que vale onde você está.
  KYC: KYC
  ID verification: verificação de identidade
  Metadata: Metadados
  Data about your data - who you contacted, when, from where and on what device - rather than what you actually said or saved.: Dados sobre os seus dados (com quem você falou, quando, de onde e em qual aparelho), e não o que você de fato disse ou salvou.
  ? |
    Metadata is everything around the content. For a message, that's who sent it to whom, when, how
    often and from which IP address. For a photo, it's often baked into the file as EXIF data: the
    phone or camera model, the time it was taken and sometimes the exact GPS location. Office
    documents can carry your name, your organisation and leftover comments or tracked changes.

    It's easy to shrug off, but it adds up fast. Who you talk to and where you go can reveal more
    than the messages themselves, which is why so much surveillance collects it. Michael Hayden, a
    former head of the NSA, once said "we kill people based on metadata", and he wasn't joking.

    End-to-end encryption protects the content, not usually the metadata, so messaging apps vary a
    lot in how much of it they can see or keep. With email, the servers always see who it's from,
    who it's to and when, encrypted or not. For files, strip the metadata before you share them -
    some sites remove EXIF data from uploads, but they may keep it for themselves.
  : |-
    Metadados são tudo o que fica em volta do conteúdo. Numa mensagem, são quem enviou para quem, quando, com que frequência e de qual endereço IP. Numa foto, eles costumam vir embutidos no arquivo como dados EXIF: o modelo do celular ou da câmera, a hora em que ela foi tirada e, às vezes, a localização exata por GPS. Documentos do Office podem conter o seu nome, a sua organização e comentários ou alterações controladas que ficaram para trás.

    É fácil não dar importância, mas os metadados se acumulam rápido. Com quem você fala e aonde você vai pode revelar mais do que as próprias mensagens, e é por isso que a vigilância se esforça tanto para coletá-los. Michael Hayden, ex-diretor da NSA, chegou a dizer “matamos pessoas com base em metadados”, e não estava brincando.

    A criptografia de ponta a ponta protege o conteúdo, mas geralmente não os metadados, então os apps de mensagens variam muito na quantidade de metadados que conseguem ver ou guardar. No e-mail, os servidores sempre veem quem enviou, para quem e quando, com ou sem criptografia. No caso de arquivos, remova os metadados antes de compartilhar: alguns sites apagam os dados EXIF dos uploads, mas podem ficar com eles para si.
  No-logs policy: Política sem logs
  A provider's promise not to keep records of what you do on its service, most often made by VPNs and DNS providers.: A promessa de um provedor de não guardar registros do que você faz no serviço, feita principalmente por VPNs e provedores de DNS.
  ? |
    A no-logs policy is a promise not to record what you get up to, like the sites you visit, the IP
    address you connect from, and when and for how long you're connected. It's most common with
    VPNs, where the provider can see all your traffic and says it won't keep any of it. It never
    means no data at all - they'll usually still have your account details and payment records, so
    read what the policy actually covers.

    The problem is you can't check it from the outside, and providers that advertised no logs have
    handed records to the police before. The best signs are independent audits (repeated, ideally),
    servers that run from memory so nothing survives a reboot, and real-world tests: court cases or
    server seizures where the provider had nothing to hand over.

    Even a perfect policy only covers the provider. Your ISP can still see that you're connected to
    a VPN, and the sites you visit can still log what you do once you get there.
  : |-
    Uma política sem logs é a promessa de não registrar o que você anda fazendo, como os sites que você visita, o endereço IP de onde se conecta e quando e por quanto tempo fica conectado. É mais comum em VPNs, em que o provedor consegue ver todo o seu tráfego e diz que não vai guardar nada dele. Isso nunca quer dizer que não haja dado nenhum: o provedor geralmente ainda tem os dados da sua conta e os registros de pagamento, então leia o que a política realmente cobre.

    O problema é que não dá para verificar isso de fora, e provedores que anunciavam não guardar logs já entregaram registros à polícia. Os melhores sinais são auditorias independentes (de preferência repetidas), servidores que rodam só na memória RAM, para que nada sobreviva a uma reinicialização, e testes no mundo real: processos judiciais ou apreensões de servidores em que o provedor não tinha nada para entregar.

    Mesmo uma política perfeita só vale para o provedor. O seu provedor de internet ainda consegue ver que você está conectado a uma VPN, e os sites que você visita ainda podem registrar o que você faz depois que entra neles.
  no-log policy: política de não registro
  zero-logs policy: política de zero logs
  Open source: Código aberto
  Software whose source code is public, under a licence that lets anyone read, use, change and share it.: Software cujo código-fonte é público, sob uma licença que permite que qualquer pessoa o leia, use, modifique e compartilhe.
  ? |
    Open source means the code is published under a licence that meets the
    [Open Source Definition](https://opensource.org/osd), so anyone can read it, use it, change it
    and pass it on. It doesn't have to be free of charge. For privacy tools that's the main draw,
    because people outside the company can check what the app really does with your data instead of
    taking the marketing's word for it.

    It's no guarantee, mind. Published code doesn't mean anyone's checked it, and serious bugs have
    gone unnoticed in popular open source projects for years. The app you download might not be
    built from exactly the code you can see, unless the project has reproducible builds that let
    people confirm it. With online services you also can't see what's running on their servers,
    which matters less if the app on your device encrypts everything before it leaves.

    When you're choosing, check which parts are actually open (the app, the server or both), what
    the licence is, and whether the project's still active. "Open source" in marketing sometimes
    means "some of it", so have a look at the code repository yourself.
  : |-
    Código aberto quer dizer que o código é publicado sob uma licença que atende à [Open Source Definition](https://opensource.org/osd), então qualquer pessoa pode lê-lo, usá-lo, modificá-lo e repassá-lo. Não precisa ser de graça. Nas ferramentas de privacidade, esse é o principal atrativo, porque pessoas de fora da empresa podem conferir o que o app realmente faz com os seus dados, em vez de acreditar no que diz o marketing.

    Só que isso não é garantia. Código publicado não quer dizer que alguém o tenha revisado, e falhas graves já passaram anos despercebidas em projetos de código aberto populares. O app que você baixa pode não ter sido compilado exatamente a partir do código que você vê, a menos que o projeto tenha compilações reproduzíveis, que permitem que outras pessoas confirmem isso. Nos serviços online, você também não consegue ver o que está rodando nos servidores, o que importa menos quando o app no seu aparelho criptografa tudo antes do envio.

    Na hora de escolher, confira quais partes são abertas de verdade (o app, o servidor ou os dois), qual é a licença e se o projeto ainda está ativo. No marketing, “código aberto” às vezes quer dizer “só uma parte”, então vá conferir você mesmo o repositório de código.
  open-source software: software de código aberto
  OSS: OSS
  Passkeys: Chaves de acesso (passkeys)
  A login that uses a cryptographic key stored on your device or in your password manager instead of a password, and resists phishing.: Uma forma de login que usa uma chave criptográfica guardada no seu aparelho ou no seu gerenciador de senhas, em vez de uma senha, e que resiste a phishing.
  ? |
    A passkey is a pair of keys made when you set one up for a site. The site keeps the public half,
    and the private half stays on your phone, computer, password manager or security key. To sign
    in, you confirm it's you with your fingerprint, face or PIN, and your device proves it has the
    private key without ever sending it. Your fingerprint never leaves your device either, and the
    whole thing runs on standards called FIDO2 and WebAuthn.

    The big win is phishing. A passkey is tied to the real website's address, so it just won't work
    on a lookalike site, however convincing it is. There's no password to reuse or to leak in a
    breach, because the site only stores the public key, which is no use to an attacker. Since you
    need both the device and your fingerprint or PIN, many sites also treat a passkey as two factors
    in one.

    Synced passkeys live in a password manager (including the one built into your phone) and get
    backed up with it, which is convenient but means trusting that provider. Device-bound ones stay
    on a single device or security key and can't be copied, so you'll want a backup way in. Before
    you go all in, check how your provider lets you move passkeys elsewhere.
  : |-
    Uma chave de acesso é um par de chaves criado quando você configura uma para um site. O site fica com a metade pública, e a metade privada fica no seu celular, no computador, no gerenciador de senhas ou numa chave de segurança. Para entrar, você confirma que é você com a impressão digital, o rosto ou o PIN, e o aparelho prova que tem a chave privada sem nunca enviá-la. A sua impressão digital também nunca sai do aparelho, e tudo isso funciona com base em padrões chamados FIDO2 e WebAuthn.

    A grande vantagem é contra o phishing. A chave de acesso fica vinculada ao endereço verdadeiro do site, então simplesmente não funciona num site falso parecido, por mais convincente que ele seja. Não há senha para reutilizar nem para vazar quando o site é invadido, porque ele só guarda a chave pública, que não serve de nada para um atacante. Como você precisa tanto do aparelho quanto da impressão digital ou do PIN, muitos sites também tratam a chave de acesso como dois fatores em um.

    As chaves de acesso sincronizadas ficam num gerenciador de senhas (inclusive o que já vem no celular) e entram no backup junto com ele, o que é prático, mas exige confiar em quem oferece esse gerenciador. As vinculadas ao aparelho ficam num único aparelho ou chave de segurança e não podem ser copiadas, então é bom ter outra forma de entrar como reserva. Antes de apostar tudo nelas, veja como o seu gerenciador permite transferir as chaves de acesso para outro lugar.
  Password manager: Gerenciador de senhas
  An app that creates, stores and fills in a different strong password for every account, all locked behind one master password.: Um app que cria, guarda e preenche uma senha forte e diferente para cada conta, tudo protegido por uma única senha mestra.
  ? |
    Reusing passwords is how one breach turns into ten. A password manager fixes that by making a
    long random password for every site and remembering them all, so you only need one strong master
    password (a long passphrase works well). Most also fill in logins for you, sync across your
    devices, and can store passkeys, 2FA codes and notes.

    There are two main types. Cloud-based ones sync your vault through the provider's servers, which
    is convenient, and the good ones encrypt everything on your device first so the provider can't
    read it. Offline ones, like those using the KeePass format, keep your vault in a file you sync
    or back up yourself - more control, more faff.

    Whichever you go for, look for zero-knowledge encryption, a published security audit, open
    source code and an easy way to export everything if you ever want to leave. Turn on 2FA for the
    account itself. And remember the vault is only as strong as your master password - if it's weak
    and the encrypted vault ever gets stolen, it can be cracked offline.
  : |-
    Reutilizar senhas é o que faz um vazamento virar dez. O gerenciador de senhas resolve isso criando uma senha longa e aleatória para cada site e lembrando de todas elas, então você só precisa de uma senha mestra forte (uma frase-senha longa funciona bem). A maioria também preenche os logins para você, sincroniza entre os seus aparelhos e consegue guardar chaves de acesso, códigos de 2FA e notas.

    Existem dois tipos principais. Os baseados na nuvem sincronizam o cofre pelos servidores da empresa, o que é prático, e os bons criptografam tudo no seu aparelho antes, para que a empresa não consiga ler nada. Já os offline, como os que usam o formato do KeePass, guardam o cofre num arquivo, e sincronizar esse arquivo ou fazer backup dele fica por sua conta: mais controle, mais trabalho.

    Seja qual for a sua escolha, procure criptografia de conhecimento zero, uma auditoria de segurança publicada, código aberto e um jeito fácil de exportar tudo se um dia quiser sair. Ative a autenticação de dois fatores na conta do próprio gerenciador. E lembre-se de que o cofre só é tão seguro quanto a sua senha mestra: se ela for fraca e alguém um dia roubar o cofre criptografado, dá para quebrá-lo offline.
  password vault: cofre de senhas
  Peer-to-peer: Peer-to-peer
  Devices connecting straight to each other to share data, rather than going through a company's central server.: Aparelhos que se conectam diretamente uns aos outros para trocar dados, em vez de passar pelo servidor central de uma empresa.
  ? |
    In a peer-to-peer (P2P) network, devices talk to each other directly. There's no central server
    holding everyone's messages or files, so there's nothing for a company to scan, lose in a
    breach, hand over or shut down. BitTorrent is the famous example, and some messengers and file
    sync tools work the same way.

    The downside is that peers can usually see each other's IP addresses. With torrents the whole
    swarm can, which is how copyright firms find people. Some P2P messengers get round this by
    routing everything over Tor. Pure P2P can also mean both devices need to be online at once,
    which is why many apps also use servers for finding each other, notifications or relaying
    traffic when a direct connection fails.

    When an app says it's P2P, check what happens when a direct connection isn't possible, whether
    your IP address is shown to the people you talk to, and whether it's end-to-end encrypted.
  : |-
    Numa rede peer-to-peer (P2P), os aparelhos se comunicam diretamente. Não há um servidor central guardando as mensagens ou os arquivos de todo mundo, então não sobra nada para uma empresa vasculhar, perder num vazamento, entregar ou tirar do ar. O BitTorrent é o exemplo mais famoso, e alguns apps de mensagens e ferramentas de sincronização de arquivos funcionam do mesmo jeito.

    A desvantagem é que os participantes geralmente conseguem ver o endereço IP uns dos outros. Nos torrents, o enxame inteiro vê, e é assim que as empresas que fiscalizam direitos autorais encontram as pessoas. Alguns apps de mensagens P2P contornam isso passando tudo pelo Tor. O P2P puro também pode exigir que os dois aparelhos estejam online ao mesmo tempo, e é por isso que muitos apps, mesmo sendo P2P, usam servidores para os aparelhos se encontrarem, para as notificações ou para retransmitir o tráfego quando a conexão direta falha.

    Se um app diz que é P2P, veja o que acontece quando não dá para fazer uma conexão direta, se o seu endereço IP fica visível para as pessoas com quem você conversa e se ele tem criptografia de ponta a ponta.
  P2P: P2P
  PGP and OpenPGP: PGP e OpenPGP
  An encryption standard for email and files that uses a public key you share and a private key you keep, and can sign things too.: Um padrão de criptografia para e-mails e arquivos que usa uma chave pública, que você compartilha, e uma chave privada, que fica com você. Também serve para assinar coisas.
  ? |
    PGP (Pretty Good Privacy) dates back to 1991, and OpenPGP is the open standard that grew out of
    it. GnuPG, or GPG, is the most widely used free implementation, and lots of PGP tools are built
    on it. It works with a key pair: you share your public key so people can encrypt things to you,
    and keep your private key to decrypt them. You can also sign messages and files, which proves
    they came from you and haven't been changed.

    It's still used for encrypted email, and it's how many software projects sign their downloads so
    you can check you've got the real thing. But it has well-known gaps. With email, the sender,
    recipient and date stay visible, and depending on your app, so might the subject line. There's
    no forward secrecy, so if your private key is ever stolen, anyone holding copies of your old
    messages can read every one. And it's easy to get wrong - one unencrypted reply that quotes the
    whole thread gives the game away.

    Look for tools that make key management easy, keep your private key under your control (ideally
    on a hardware key for anything important), and help you check other people's key fingerprints.
    For chatting rather than email, a modern end-to-end encrypted messenger is usually a better fit.
  : |-
    O PGP (Pretty Good Privacy) surgiu em 1991, e o OpenPGP é o padrão aberto que nasceu dele. O GnuPG, ou GPG, é a implementação livre mais usada, e muitas ferramentas de PGP são construídas em cima dele. Tudo funciona com um par de chaves: você compartilha a sua chave pública para que as pessoas possam criptografar coisas para você e guarda a chave privada para descriptografá-las. Você também pode assinar mensagens e arquivos, o que prova que eles vieram de você e não foram alterados.

    O PGP ainda é usado para criptografar e-mails, e é assim que muitos projetos de software assinam os próprios downloads, para você poder conferir que baixou o arquivo verdadeiro. Mas ele tem limitações bem conhecidas. No e-mail, o remetente, o destinatário e a data continuam visíveis e, dependendo do app, o assunto também. Não há forward secrecy, então, se a sua chave privada um dia for roubada, qualquer pessoa que tenha cópias das suas mensagens antigas consegue ler todas elas. E é fácil errar: basta uma resposta sem criptografia com a conversa inteira citada para pôr tudo a perder.

    Procure ferramentas que facilitem o gerenciamento de chaves, mantenham a sua chave privada sob o seu controle (de preferência numa chave de segurança física, para qualquer coisa importante) e ajudem você a conferir a impressão digital das chaves das outras pessoas. Para conversar, em vez de trocar e-mails, um app de mensagens moderno com criptografia de ponta a ponta costuma ser uma opção melhor.
  Pretty Good Privacy: Pretty Good Privacy
  GPG: GPG
  GnuPG: GnuPG
  Phishing: Phishing
  Tricking you into handing over passwords, codes, money or personal details with a fake email, text, call or website.: Enganar você com e-mails, SMS, ligações ou sites falsos para que você entregue senhas, códigos, dinheiro ou dados pessoais.
  ? |
    Phishing is one of the commonest ways accounts get broken into. You get an email, text or call
    that looks like it's from your bank, a delivery firm or your boss, with a reason to act right
    now and a link to a page that looks like the real thing. Anything you type there goes straight
    to the attacker. Phishing by text is called smishing, by phone it's vishing, and attacks
    tailored to one person are spear phishing.

    Modern phishing kits can pass what you type to the real site as you go, so they can grab SMS and
    authenticator codes as well as your password. The logins that resist it are passkeys and
    hardware security keys, which check the site's real address and refuse to work on a fake one.

    A password manager helps too, as it only fills in your login on the site it was saved for - if
    it doesn't offer to fill, treat that as a warning. Beyond that, be suspicious of urgency, go to
    sites directly rather than through links in messages, and check where a link really goes before
    you click.
  : |-
    O phishing é uma das formas mais comuns de invadir contas. Você recebe um e-mail, um SMS ou uma ligação que parece vir do seu banco, de uma empresa de entregas ou do seu chefe, com um motivo para agir agora mesmo e um link para uma página que parece a de verdade. Tudo o que você digitar ali vai direto para o atacante. O phishing por SMS se chama smishing, por telefone é vishing, e os ataques feitos sob medida para uma pessoa são o spear phishing.

    Os kits de phishing modernos conseguem repassar ao site verdadeiro o que você digita, em tempo real, e assim capturam os códigos por SMS e os do app autenticador, além da sua senha. As formas de login que resistem a isso são as chaves de acesso e as chaves de segurança físicas, que conferem o endereço verdadeiro do site e se recusam a funcionar num falso.

    Um gerenciador de senhas também ajuda, porque só preenche o seu login no site para o qual ele foi salvo. Se ele não oferecer o preenchimento, encare isso como um alerta. Fora isso, desconfie de qualquer urgência, entre nos sites diretamente em vez de usar links de mensagens e confira para onde um link leva de verdade antes de clicar.
  Proxy: Proxy
  A server that passes your requests on to the internet for you, so the sites you visit see the proxy's address instead of yours.: Um servidor que repassa os seus pedidos para a internet por você, para que os sites que você visita vejam o endereço do proxy, e não o seu.
  ? |
    A proxy sits between you and the sites you visit and fetches things on your behalf. Unlike a
    VPN, it usually only covers the apps you point at it, like your browser, and many don't add any
    encryption of their own. That makes proxies handy for specific jobs, like getting round a block,
    and a poor choice for hiding everything you do.

    The proxy operator can see where you're going and, for anything not on HTTPS, what you're doing,
    and can tamper with it. That's why free public proxies are such a bad idea: you've no idea who
    runs them, and some exist to collect data or inject ads and malware.

    Privacy front-ends work in a similar way. They're sites that load content from big platforms
    like YouTube or Reddit for you, so the platform sees the front-end's server rather than you.
    They cut out a lot of tracking, but whoever runs the instance can see what you look at, and they
    tend to break when the platform changes things.
  : |-
    O proxy fica entre você e os sites que você visita e busca as coisas em seu nome. Diferente de uma VPN, ele geralmente só cobre os apps que você configura para usá-lo, como o navegador, e muitos não acrescentam nenhuma criptografia própria. Por isso, os proxies são úteis para tarefas específicas, como driblar um bloqueio, mas são uma escolha ruim para esconder tudo o que você faz.

    Quem opera o proxy consegue ver aonde você vai e, em tudo o que não usa HTTPS, o que você está fazendo, e ainda pode adulterar isso. É por isso que proxies públicos gratuitos são uma ideia tão ruim: você não sabe quem está por trás deles, e alguns existem para coletar dados ou injetar anúncios e malware.

    Os front-ends de privacidade funcionam de um jeito parecido. São sites que carregam para você o conteúdo de grandes plataformas, como o YouTube ou o Reddit, então a plataforma vê o servidor do front-end, e não você. Eles cortam boa parte do rastreamento, mas quem mantém a instância consegue ver o que você acessa, e eles costumam parar de funcionar quando a plataforma muda alguma coisa.
  proxy server: servidor proxy
  web proxy: proxy web
  Sandboxing: Sandboxing
  Running an app in a walled-off space with limited access to the rest of your system, so a bad or hacked app can only do so much damage.: Rodar um app num espaço isolado, com acesso restrito ao resto do sistema, para limitar o estrago que um app malicioso ou comprometido pode causar.
  ? |
    A sandbox limits what an app can touch, like your files, other apps, your camera or the network.
    If something inside it is malicious or gets hacked, the damage should stay inside the box. You
    use sandboxes all the time without noticing: phone apps each run in one, and browsers sandbox
    the code that runs web pages so a malicious site can't read your files.

    On a desktop you can go further. Linux has tools that sandbox individual programs, and app
    formats like Flatpak come with a permission system, though plenty of apps ask for far more
    access than they need. Virtual machines go further still by running a whole separate operating
    system, which is why they're popular for opening suspicious files or keeping different parts of
    your life in separate compartments.

    A sandbox is only as good as its rules. Broad permissions make it close to pointless, and bugs
    that let code escape do turn up, so keep things updated. It also can't protect anything you hand
    to the app inside it.
  : |-
    Um sandbox limita o que um app pode acessar, como os seus arquivos, outros apps, a câmera ou a rede. Se algo lá dentro for malicioso ou for comprometido, o estrago deve ficar contido ali. Você usa sandboxes o tempo todo sem perceber: cada app do celular roda no próprio sandbox, e os navegadores isolam num sandbox o código das páginas, para que um site malicioso não consiga ler os seus arquivos.

    No computador, dá para ir além. O Linux tem ferramentas que isolam programas um a um, e formatos de app como o Flatpak vêm com um sistema de permissões, embora muitos apps peçam muito mais acesso do que precisam. As máquinas virtuais vão ainda mais longe, rodando um sistema operacional inteiro à parte, e por isso são populares para abrir arquivos suspeitos ou para manter diferentes partes da sua vida em compartimentos separados.

    Um sandbox vale o que valem as suas regras. Permissões amplas o tornam quase inútil, e falhas que deixam o código escapar aparecem, sim, então mantenha tudo atualizado. Ele também não consegue proteger nada que você mesmo entregue ao app que está lá dentro.
  sandbox: sandbox
  app sandbox: sandbox de apps
  Security audit: Auditoria de segurança
  An outside firm checking an app's code, systems or policies for security holes and false claims, ideally with a public report.: Uma empresa de fora que examina o código, os sistemas ou as políticas de um app em busca de brechas de segurança e de afirmações falsas, de preferência com um relatório público.
  ? |
    In a security audit, a company pays an independent firm to go through its code or systems
    looking for weaknesses, then (ideally) publishes the report. There are a few kinds: code
    reviews, penetration tests where the auditors actively try to break in, reviews of the
    cryptography, and policy audits like the no-logs audits VPN providers use to back up their
    claims.

    An audit is a snapshot. It only covers what was in scope at the time, and the app may have
    changed a lot since. It's also paid for by the company being audited, which doesn't make it
    worthless, but it's a good reason to read the details rather than trust a badge on the homepage.

    Good signs are a full public report rather than a summary, a well-known auditing firm, a recent
    date, a clear scope and a note of which issues got fixed. Regular audits over several years
    count for more than a single one from 2019. No audit doesn't mean unsafe - plenty of small open
    source projects can't afford one - but it does mean you're relying on whoever's read the code.
  : |-
    Numa auditoria de segurança, uma empresa paga uma firma independente para examinar o código ou os sistemas dela em busca de pontos fracos e depois (de preferência) publica o relatório. Há alguns tipos: revisões de código, testes de invasão, em que os auditores tentam ativamente entrar, revisões da criptografia e auditorias de políticas, como as auditorias da política sem logs que os provedores de VPN usam para comprovar o que dizem.

    Uma auditoria é um retrato de um momento. Ela só cobre o que estava no escopo naquela época, e o app pode ter mudado muito desde então. Ela também é paga pela própria empresa auditada, o que não a torna inútil, mas é um bom motivo para ler os detalhes em vez de confiar num selo na página inicial.

    Os bons sinais são um relatório público completo em vez de um resumo, uma empresa de auditoria conhecida, uma data recente, um escopo claro e a indicação de quais problemas foram corrigidos. Auditorias regulares ao longo de vários anos valem mais do que uma única de 2019. Não ter auditoria não significa ser inseguro (muitos projetos pequenos de código aberto não têm como pagar uma), mas significa que você depende de quem tiver lido o código.
  independent audit: auditoria independente
  third-party audit: auditoria externa
  Self-hosting: Auto-hospedagem (self-hosting)
  Running an app or service on hardware you control, at home or on a rented server, instead of relying on someone else's.: Rodar um app ou serviço num hardware sob o seu controle, em casa ou num servidor alugado, em vez de depender do hardware de terceiros.
  ? |
    Self-hosting means running the server side of something yourself, like your own cloud storage,
    password manager server, chat server or media library. It might live on an old laptop, a
    Raspberry Pi or a rented server. Your data stays somewhere you control, and no company can scan
    it, sell it, change the terms or shut the service down on you.

    The trade-off is that you're now the IT department. Updates, backups, security and fixing it at
    2am are all on you, and a neglected server is easy pickings. On a rented server the hosting
    company can get at your disk in principle, so encryption still matters. Email is notoriously
    hard to self-host well, since the big providers are quick to treat mail from small servers as
    spam.

    Stick to open source apps with clear docs, an active project and an easy way to update. If you'd
    rather not run it all yourself, plenty of privacy-focused services offer both - a hosted
    version, and the code to run your own.
  : |-
    Auto-hospedagem é você mesmo rodar o lado do servidor de alguma coisa, como o seu próprio armazenamento na nuvem, um servidor de gerenciador de senhas, um servidor de chat ou uma biblioteca de mídia. Isso pode ficar num notebook velho, num Raspberry Pi ou num servidor alugado. Os seus dados ficam num lugar que você controla, e nenhuma empresa pode vasculhá-los, vendê-los, mudar os termos ou tirar o serviço do ar e deixar você na mão.

    O preço é que agora o departamento de TI é você. Atualizações, backups, segurança e consertar tudo às 2 da manhã ficam por sua conta, e um servidor largado é presa fácil. Num servidor alugado, a empresa de hospedagem pode, em teoria, acessar o seu disco, então a criptografia continua importando. O e-mail é famoso por ser difícil de hospedar bem por conta própria, porque os grandes provedores não demoram a tratar como spam as mensagens que vêm de servidores pequenos.

    Prefira apps de código aberto com documentação clara, um projeto ativo e um jeito fácil de atualizar. Se você não quiser cuidar de tudo sozinho, muitos serviços focados em privacidade oferecem as duas coisas: uma versão hospedada e o código para rodar a sua.
  self-hosted: auto-hospedado
  Source-available software: Software de código-fonte disponível (source-available)
  Software whose code you can read, but under a licence that limits what you can do with it, so it doesn't count as open source.: Software cujo código você pode ler, mas sob uma licença que limita o que você pode fazer com ele, por isso não conta como código aberto.
  ? |
    Source-available code is public, but the licence holds back some of the freedoms open source
    gives you. It might ban commercial use, stop you running it as a competing service, or forbid
    sharing changed versions. The Business Source License and the Server Side Public License are
    well-known examples, and neither is approved by the Open Source Initiative.

    For privacy, it gets you most of the way. You (or anyone) can still read the code and check what
    it does with your data, which is the main reason to care. What you lose is the safety net: if
    the company goes bust or goes bad, usually nobody else is allowed to pick up the code and carry
    on.

    Watch the wording. Some projects call themselves open source when the licence says otherwise,
    and code published with no licence at all is technically all rights reserved, even on GitHub. A
    few source-available licences turn into proper open source ones after a set number of years.
  : |-
    No software de código-fonte disponível, o código é público, mas a licença deixa de fora algumas das liberdades que o código aberto dá. Ela pode vetar o uso comercial, impedir que você o rode como um serviço concorrente ou proibir que versões modificadas sejam compartilhadas. A Business Source License e a Server Side Public License são exemplos conhecidos, e nenhuma das duas é aprovada pela Open Source Initiative.

    Para a privacidade, isso já resolve a maior parte. Você (ou qualquer pessoa) continua podendo ler o código e conferir o que ele faz com os seus dados, e é sobretudo por isso que o código aberto importa. O que você perde é a rede de segurança: se a empresa falir ou passar a agir de má-fé, normalmente ninguém mais tem permissão para pegar o código e continuar o projeto.

    Preste atenção nas palavras. Alguns projetos se apresentam como de código aberto quando a licença diz o contrário, e código publicado sem licença nenhuma fica, tecnicamente, com todos os direitos reservados, mesmo no GitHub. Algumas licenças de código-fonte disponível viram licenças de código aberto de verdade depois de um número definido de anos.
  Telemetry: Telemetria
  Data an app or operating system sends back to its maker about how you use it, what device you're on and what went wrong.: "Dados que um app ou sistema operacional manda de volta para a empresa que o desenvolveu: como você o usa, que aparelho você tem e o que deu errado."
  ? |
    Telemetry ranges from harmless to nosy. A crash report that helps someone fix a bug is one
    thing. A steady stream of which buttons you click and what hardware you're on, tied to an ID
    that follows you around, is another. Most of it's on by default and buried a few menus deep, if
    it can be turned off at all.

    Even "anonymous" telemetry has to be sent from somewhere, so the server receiving it sees your
    IP address unless it goes through a proxy first. Windows, for one, lets you turn diagnostic data
    down but not off unless you're on an Enterprise or Education edition, which is why so many tools
    exist to block it.

    The better apps make telemetry opt-in, list exactly what gets sent, and publish code you (or
    someone else) can check. Open source apps can collect telemetry too, it's just harder to hide.
    Blocking it with a firewall or a DNS blocklist works for plenty of apps, though some break or
    nag you when they can't phone home.
  : |-
    A telemetria vai do inofensivo ao intrometido. Uma coisa é um relatório de falha que ajuda alguém a corrigir um bug. Outra é um fluxo constante de informações sobre os botões em que você clica e o hardware que você usa, ligado a um identificador que acompanha você por toda parte. A maior parte vem ativada por padrão e escondida lá no fundo dos menus, isso quando dá para desativar.

    Até a telemetria “anônima” precisa ser enviada de algum lugar, então o servidor que a recebe vê o seu endereço IP, a menos que ela passe antes por um proxy. O Windows, por exemplo, deixa você reduzir os dados de diagnóstico, mas não desativá-los, a não ser nas edições Enterprise ou Education, e é por isso que existem tantas ferramentas feitas para bloqueá-los.

    Os melhores apps deixam a telemetria desligada até você decidir ativá-la, listam exatamente o que é enviado e publicam o código-fonte para que você (ou outra pessoa) possa conferir. Apps de código aberto também podem coletar telemetria, só que é mais difícil esconder. Barrá-la com um firewall ou uma lista de bloqueio de DNS dá certo com muitos apps, embora alguns parem de funcionar ou fiquem reclamando quando não conseguem falar com a empresa.
  diagnostic data: dados de diagnóstico
  usage data: dados de uso
  Third-party cookies: Cookies de terceiros
  Cookies set by a company other than the site you're on, usually an ad network, so it can recognise you on every site it's embedded in.: Cookies criados por uma empresa diferente do site em que você está, geralmente uma rede de anúncios, para que ela reconheça você em todos os sites em que está presente.
  ? |
    A cookie is a small bit of data a website stores in your browser. First-party cookies come from
    the site you're actually on and do useful things like keep you logged in. Third-party cookies
    come from something embedded in the page, like an ad, a share button or an analytics script, and
    because the same company is embedded on thousands of sites, it can follow you from one to the
    next.

    Browsers have been clamping down on them. Safari blocks them by default, and Firefox gives every
    site its own separate cookie jar so they can't follow you around. Chrome still allows them
    unless you change the setting, after Google dropped its plan to phase them out.

    Blocking them doesn't stop tracking on its own, since fingerprinting, tracking from a site's own
    domain and being logged in to accounts all still work. In the UK and EU, sites need your consent
    for non-essential cookies, which is what those banners are for. "Reject all" turns most of them
    off, at least on sites that respect your choice.
  : |-
    Um cookie é um pedacinho de informação que um site guarda no seu navegador. Os cookies primários vêm do site em que você realmente está e fazem coisas úteis, como manter você conectado. Os cookies de terceiros vêm de algo incorporado à página, como um anúncio, um botão de compartilhar ou um script de análise, e, como a mesma empresa está presente em milhares de sites, ela consegue seguir você de um para outro.

    Os navegadores vêm apertando o cerco contra eles. O Safari os bloqueia por padrão, e o Firefox dá a cada site o seu próprio pote de cookies, separado dos outros, para que eles não consigam seguir você por aí. Depois que o Google desistiu do plano de eliminá-los aos poucos, o Chrome continua permitindo esses cookies, a menos que você mude a configuração.

    Bloqueá-los não acaba sozinho com o rastreamento, porque a impressão digital do navegador, o rastreamento pelo próprio domínio do site e o login nas suas contas continuam funcionando. No Reino Unido e na UE, os sites precisam do seu consentimento para cookies não essenciais, e é para isso que servem aqueles banners. “Rejeitar todos” desativa a maioria deles, pelo menos nos sites que respeitam a sua escolha.
  tracking cookies: cookies de rastreamento
  cross-site cookies: cookies entre sites
  Threat model: Modelo de ameaças
  Working out what you're protecting, who from and how much hassle it's worth, so you pick tools that fit your real risks.: Pensar no que você quer proteger, de quem e quanto esforço vale a pena, para escolher ferramentas que se encaixem nos seus riscos reais.
  ? |
    A threat model is just a plan. You work out what you want to protect (your messages, your
    location, your identity), who you're protecting it from (advertisers, a nosy ex, scammers, a
    government), how likely that is, how bad it'd be if it went wrong, and how much effort you're
    prepared to put in. The EFF's Surveillance Self-Defense guide has a
    [good walk-through](https://ssd.eff.org/module/your-security-plan).

    Your answers decide what you need. Someone avoiding ad tracking needs a decent browser and an ad
    blocker. A journalist protecting sources needs a lot more, and shouldn't rely on any one tool.
    Most people are somewhere in between.

    It also stops you overdoing it. Every extra tool is something else to maintain and something
    else to break, and a setup that's a pain to live with tends to get abandoned. Pick protections
    that match the threats you actually face, and look at them again when your situation changes.
  : |-
    Um modelo de ameaças é só um plano. Você define o que quer proteger (suas mensagens, sua localização, sua identidade), de quem quer proteger (anunciantes, um ex enxerido, golpistas, um governo), qual é a chance de isso acontecer, quão grave seria se desse errado e quanto esforço você está disposto a fazer. O guia Surveillance Self-Defense, da EFF, tem um [bom passo a passo](https://ssd.eff.org/module/your-security-plan).

    As suas respostas definem do que você precisa. Quem quer fugir do rastreamento publicitário precisa de um navegador decente e de um bloqueador de anúncios. Um jornalista que protege as próprias fontes precisa de muito mais e não deveria depender de uma ferramenta só. A maioria das pessoas fica em algum ponto entre os dois.

    O modelo de ameaças também evita que você exagere. Cada ferramenta a mais é mais uma coisa para manter e mais uma coisa que pode quebrar, e uma configuração que dá dor de cabeça no dia a dia costuma acabar abandonada. Escolha proteções que combinem com as ameaças que você enfrenta de verdade e reveja tudo quando a sua situação mudar.
  threat modelling: modelagem de ameaças
  Tor and onion routing: Tor e roteamento cebola
  A free network that bounces your traffic through three volunteer-run relays, so no single one knows both who you are and where you're going.: Uma rede gratuita que faz o seu tráfego passar por três retransmissores mantidos por voluntários, para que nenhum deles saiba ao mesmo tempo quem você é e aonde você vai.
  ? |
    Tor wraps your traffic in three layers of encryption and sends it through three relays run by
    volunteers. Each relay peels off one layer (hence "onion"), so the first knows your IP address
    but not where you're going, and the last knows where you're going but not who you are.
    [Tor Browser](https://www.torproject.org/) is the easiest way in, and it also makes its users
    look as alike as possible, so you're harder to fingerprint.

    Onion services (the .onion addresses) never leave the Tor network, so both sides stay hidden.
    For ordinary sites, the last relay can see your traffic if the site doesn't use HTTPS. Tor is
    also slower than a normal connection, and some sites block it or pile on the CAPTCHAs.

    Your ISP can see that you're using Tor, though not what for, unless you connect through a bridge
    that disguises it. Tor can't protect you from yourself either - logging into your usual
    accounts, or opening a downloaded file outside Tor Browser, can give you away. Someone who can
    watch both ends of your connection at once may also be able to match up the traffic.
  : |-
    O Tor envolve o seu tráfego em três camadas de criptografia e o envia por três retransmissores mantidos por voluntários. Cada retransmissor tira uma camada (daí a “cebola”), então o primeiro sabe o seu endereço IP, mas não aonde você vai, e o último sabe aonde você vai, mas não quem você é. O [Tor Browser](https://www.torproject.org/) é o jeito mais fácil de começar, e ele ainda deixa os usuários o mais parecidos possível entre si, o que dificulta identificar você pela impressão digital do navegador.

    Os serviços onion (os endereços .onion) nunca saem da rede Tor, então os dois lados ficam ocultos. Nos sites comuns, o último retransmissor consegue ver o seu tráfego se o site não usar HTTPS. O Tor também é mais lento que uma conexão normal, e alguns sites o bloqueiam ou enchem você de CAPTCHAs.

    O seu provedor de internet consegue ver que você está usando o Tor, mas não para quê, a menos que você se conecte por uma ponte que disfarce isso. O Tor também não protege você de você mesmo: entrar nas suas contas de sempre ou abrir um arquivo baixado fora do Tor Browser pode entregar quem você é. E quem puder observar as duas pontas da sua conexão ao mesmo tempo talvez consiga casar o tráfego de uma com o da outra.
  The Onion Router: The Onion Router
  Terms of Service; Didn't Read: Terms of Service; Didn't Read
  A community project that reads the terms and privacy policies of websites and apps, and grades them from A (very good) to E (very bad).: Um projeto comunitário que lê os termos de uso e as políticas de privacidade de sites e apps e dá a eles uma nota de A (muito bom) a E (muito ruim).
  ? |
    Hardly anyone reads the terms they agree to, so [ToS;DR](https://tosdr.org/) reads them for you.
    Since 2012 its contributors have been going through the terms of service and privacy policies of
    sites and apps, picking out the parts that matter, like whether you can delete your account or
    whether your data gets shared with advertisers. Each point is labelled good, neutral, bad or,
    for the worst ones, a blocker.

    Those points add up to a grade from A, for very good, down to E, for very bad. Services with no
    reviewed points don't get one. It's a quick way to spot terms that let a company do things you'd
    object to.

    Treat it as a starting point. Reviews come from a community of contributors, so smaller services
    are often missing, and a company can change its terms after they've been reviewed. A grade is
    also about what the terms say, not how secure the service is or whether the company sticks to
    its word.
  : |-
    Quase ninguém lê os termos que aceita, então o [ToS;DR](https://tosdr.org/) lê por você. Desde 2012, os colaboradores do projeto analisam os termos de uso e as políticas de privacidade de sites e apps e destacam as partes que importam, como se você pode excluir a sua conta ou se os seus dados são compartilhados com anunciantes. Cada ponto recebe o rótulo de bom, neutro, ruim ou, nos piores casos, bloqueador.

    Somados, esses pontos dão uma nota que vai de A, muito bom, até E, muito ruim. Serviços sem nenhum ponto analisado ficam sem nota. É um jeito rápido de identificar termos que permitem que uma empresa faça coisas com as quais você não concordaria.

    Encare o ToS;DR como um ponto de partida. As análises vêm de uma comunidade de colaboradores, então serviços menores muitas vezes ficam de fora, e uma empresa pode mudar os termos depois que eles foram analisados. A nota também reflete o que está escrito nos termos, e não o quanto o serviço é seguro ou se a empresa cumpre a palavra.
  ToS;DR: ToS;DR
  TOSDR: TOSDR
  Time-based one-time password: Senha de uso único baseada em tempo
  The short-lived codes from an authenticator app, worked out from a secret shared with the site and the current time.: Os códigos de curta duração de um app autenticador, calculados a partir de um segredo compartilhado com o site e da hora atual.
  ? |
    When you turn on app-based 2FA, the site shows you a QR code containing a secret key, which your
    authenticator app saves. From then on, the app and the site both combine that secret with the
    current time to work out the same short code, which usually changes every 30 seconds. It's all
    done offline, so your phone doesn't need signal and the app doesn't need an account.

    It's a big step up from SMS codes, since there's nothing for a SIM swap to intercept. It's not
    phishing-proof, though. If you type a code into a convincing fake login page, the attacker can
    pass it straight on to the real site while it's still valid. Anyone who gets hold of the secret
    (from a backup, say, or a screenshot of the QR code) can also make your codes until you reset
    2FA.

    Pick an authenticator app that lets you back up or export your accounts, ideally encrypted, so a
    lost or broken phone isn't a disaster. Some apps make it hard to get your secrets out, which
    feels secure right up until you change phones.
  : |-
    Quando você ativa a autenticação de dois fatores por app, o site mostra um QR code com uma chave secreta, que o seu app autenticador salva. Dali em diante, o app e o site combinam esse segredo com a hora atual para chegar ao mesmo código curto, que costuma mudar a cada 30 segundos. Tudo é feito offline, então o celular não precisa de sinal e o app não precisa de conta.

    É um grande avanço em relação aos códigos por SMS, já que num SIM swap não há nada para interceptar. Mas não é à prova de phishing. Se você digitar um código numa página de login falsa e convincente, o atacante pode repassá-lo na hora para o site verdadeiro enquanto o código ainda vale. E quem puser as mãos no segredo (de um backup, por exemplo, ou de uma captura de tela do QR code) também consegue gerar os seus códigos até você redefinir a autenticação de dois fatores.

    Escolha um app autenticador que permita fazer backup ou exportar as suas contas, de preferência com criptografia, para que perder ou quebrar o celular não vire um desastre. Alguns apps dificultam tirar os seus segredos de lá, o que parece seguro até o dia em que você troca de celular.
  TOTP: TOTP
  authenticator codes: códigos do autenticador
  Tracker: Rastreador
  Code in a website, app or email that records what you do and reports it to another company, usually for advertising.: Código num site, app ou e-mail que registra o que você faz e repassa isso para outra empresa, geralmente para fins de publicidade.
  ? |
    Trackers come in a few shapes. On websites, they're scripts and invisible images from ad
    networks and analytics firms, sometimes dozens on a single page. In apps, they're bits of code
    from those same companies that the developer has bundled in, and they get whatever access the
    app has. In emails, a tiny invisible image (a tracking pixel) tells the sender when you opened
    it, roughly where you were and what device you used.

    Because the same few companies are on so many sites and apps, they can follow you between them
    and build up a profile of your interests, habits and whereabouts. That profile is used for
    targeted ads, and some of it gets sold on to data brokers.

    Blocking them is one of the easier wins. Content blockers in your browser use filter lists of
    known trackers, DNS-level blockers do the same for every device on your network, and most email
    apps can stop remote images loading. Blockers only catch trackers they know about, and some
    sites now serve tracking from their own domain to get round them.
  : |-
    Os rastreadores aparecem de algumas formas. Nos sites, são scripts e imagens invisíveis de redes de anúncios e empresas de análise de dados, às vezes dezenas numa única página. Nos apps, são trechos de código dessas mesmas empresas que o desenvolvedor embutiu, e eles ganham todo o acesso que o app tiver. Nos e-mails, uma imagem minúscula e invisível (um pixel de rastreamento) conta ao remetente quando você abriu a mensagem, mais ou menos onde você estava e que aparelho usou.

    Como as mesmas poucas empresas estão em tantos sites e apps, elas conseguem seguir você de um para outro e montar um perfil dos seus interesses, dos seus hábitos e dos lugares por onde você anda. Esse perfil é usado para anúncios direcionados, e parte dele é revendida para corretores de dados.

    Bloqueá-los é uma das melhorias mais fáceis. Os bloqueadores de conteúdo do navegador usam listas de filtros com rastreadores conhecidos, os bloqueadores no nível do DNS fazem o mesmo para todos os aparelhos da sua rede, e a maioria dos apps de e-mail consegue impedir o carregamento de imagens remotas. Os bloqueadores só pegam os rastreadores que conhecem, e alguns sites agora fazem o rastreamento a partir do próprio domínio para driblá-los.
  web tracker: rastreador web
  ad tracker: rastreador de anúncios
  Virtual private network: Rede privada virtual
  An encrypted tunnel from your device to a VPN provider's server, which hides your traffic from your network and your IP address from sites.: Um túnel criptografado do seu aparelho até o servidor de uma empresa de VPN, que esconde o seu tráfego da rede em que você está e o seu endereço IP dos sites.
  ? |
    A VPN sends all your traffic through an encrypted tunnel to a server run by the VPN provider,
    and from there out to the internet. Your ISP, or the Wi-Fi network you're on, can see that
    you're using a VPN but not which sites you visit. The sites see the VPN server's IP address
    instead of yours.

    It doesn't make you anonymous. It moves your trust from your ISP to the VPN provider, who can
    now see everything your ISP used to. It won't stop cookies, browser fingerprinting or a site
    recognising you the moment you log in. It's good for hiding your IP address, using dodgy public
    Wi-Fi, getting round blocks and geo-restrictions, and keeping your browsing away from your ISP,
    and not much else.

    The provider matters more than the tech. Look for an audited no-logs policy, open source apps, a
    kill switch and leak protection, and a way to pay that doesn't tie the account to your name if
    that matters to you. Be wary of free VPNs, which have to pay for their servers somehow, often
    with your data.
  : |-
    Uma VPN manda todo o seu tráfego por um túnel criptografado até um servidor da empresa de VPN e, de lá, para a internet. O seu provedor de internet, ou a rede Wi-Fi em que você está, consegue ver que você está usando uma VPN, mas não quais sites você visita. Os sites veem o endereço IP do servidor da VPN, e não o seu.

    Uma VPN não deixa você anônimo. Ela muda a sua confiança de lugar: sai o provedor de internet, entra a empresa de VPN, que agora consegue ver tudo o que o provedor via antes. Ela também não protege contra cookies nem contra a impressão digital do navegador, e não impede que um site reconheça você assim que você faz login. Serve para esconder o seu endereço IP, usar um Wi-Fi público duvidoso, driblar bloqueios e restrições geográficas e manter a sua navegação longe do provedor de internet, e não muito mais que isso.

    Quem oferece a VPN importa mais do que a tecnologia. Procure uma política sem logs auditada, apps de código aberto, um kill switch, proteção contra vazamentos e, se isso for importante para você, uma forma de pagamento que não ligue a conta ao seu nome. Desconfie das VPNs gratuitas, que precisam pagar pelos servidores de algum jeito, muitas vezes com os seus dados.
  VPN: VPN
  Warrant canary: Warrant canary
  A regularly updated statement that a company hasn't received a secret government order, which it stops updating if it ever does.: Uma declaração, atualizada com regularidade, de que uma empresa não recebeu nenhuma ordem secreta do governo. Se um dia receber, a empresa para de atualizá-la.
  ? |
    Some government orders, like US National Security Letters, come with a gag order that stops the
    company telling anyone. A warrant canary is the workaround, named after the canaries miners used
    to take underground. The company regularly publishes a statement saying it hasn't received any
    such order, and if the statement disappears or stops being updated on schedule, you're meant to
    assume it has.

    It relies on the idea that a government can stop you saying something, but can't force you to
    keep saying something false. That's never really been tested in court, and some lawyers think
    pulling a canary could land a company in just as much trouble as speaking out.

    So treat a canary as a hint. Check that it's updated on a regular schedule and signed (often
    with PGP) so you know it's genuine. A lapsed canary can also just mean someone forgot to update
    it, so look for an explanation before you panic.
  : |-
    Algumas determinações do governo, como as National Security Letters dos EUA, vêm com uma ordem de sigilo que proíbe a empresa de contar isso a quem quer que seja. O warrant canary é o jeito de contornar isso, e o nome vem dos canários que os mineiros levavam para dentro das minas. A empresa publica regularmente uma declaração dizendo que não recebeu nenhuma ordem desse tipo e, se a declaração sumir ou deixar de ser atualizada no prazo, a ideia é você presumir que recebeu.

    O canary parte do princípio de que um governo pode impedir você de dizer alguma coisa, mas não pode obrigar você a continuar dizendo algo falso. Isso nunca foi testado de verdade na Justiça, e alguns advogados acham que tirar um canary do ar pode criar tantos problemas para a empresa quanto falar abertamente.

    Por isso, trate um canary como um indício. Confira se ele é atualizado com uma frequência fixa e se é assinado (muitas vezes com PGP), para saber que é autêntico. Um canary vencido também pode significar só que alguém esqueceu de atualizá-lo, então procure uma explicação antes de entrar em pânico.
  WebRTC leak: Vazamento de WebRTC
  When a website uses your browser's built-in calling tech to find your real IP address, even though you're on a VPN or proxy.: Quando um site usa a tecnologia de chamadas embutida no seu navegador para descobrir o seu endereço IP real, mesmo que você esteja usando uma VPN ou um proxy.
  ? |
    WebRTC is the browser tech behind video calls and other live connections that work without a
    plugin. To connect people directly, it has to work out their IP addresses, and any website can
    ask it to do that with a few lines of code. A WebRTC leak is when that reveals an address you
    were hoping to hide.

    It mostly bites with browser proxy extensions and VPN setups that don't send everything through
    the tunnel, since WebRTC can go around them and expose your real public IP. A VPN app that
    routes all your traffic usually isn't affected. Most major browsers now hide your local network
    address from it by default, too.

    To check, visit a WebRTC leak test page while you're connected. If it shows your real IP, you
    can turn WebRTC off in some browsers (which breaks video calls in the browser), limit it with an
    extension, or fix the VPN so it covers everything.
  : |-
    O WebRTC é a tecnologia do navegador por trás das videochamadas e de outras conexões ao vivo que funcionam sem plugin. Para conectar as pessoas diretamente, ele precisa descobrir os endereços IP delas, e qualquer site pode pedir isso a ele com poucas linhas de código. O vazamento de WebRTC acontece quando isso revela um endereço que você esperava esconder.

    O problema aparece principalmente com extensões de proxy para o navegador e configurações de VPN que não mandam tudo pelo túnel, já que o WebRTC pode passar por fora delas e expor o seu IP público real. Um app de VPN que encaminha todo o seu tráfego geralmente não é afetado. A maioria dos grandes navegadores também já esconde dele, por padrão, o seu endereço na rede local.

    Para conferir, abra uma página de teste de vazamento de WebRTC enquanto estiver conectado à VPN ou ao proxy. Se ela mostrar o seu IP real, você pode desativar o WebRTC em alguns navegadores (o que faz as videochamadas no navegador pararem de funcionar), limitá-lo com uma extensão ou ajustar a VPN para que ela cubra tudo.
  WebRTC IP leak: vazamento de IP pelo WebRTC
  Zero-knowledge encryption: Criptografia de conhecimento zero
  Encryption done on your device before anything's uploaded, so the provider can store and sync your data but has no way to read it.: Criptografia feita no seu aparelho antes de qualquer envio, para que a empresa possa guardar e sincronizar os seus dados sem ter como lê-los.
  ? |
    Zero-knowledge is mostly a marketing term, but a useful one. Your files, notes or passwords are
    encrypted on your device with a key that comes from your password (or a key only you hold), and
    only the encrypted version is ever sent to the provider. They can store and sync it, but they
    can't read it, and neither can anyone who breaches them.

    Check what's actually covered, as your email address, file sizes, timestamps and sometimes file
    names can still be readable. Forget your password and there's usually no way to get your data
    back - that's the point, but it catches people out. And if you use the web app, the provider
    sends you fresh code every time you load it, so a provider that went bad (or was forced to)
    could serve a version that grabs your password. Desktop and mobile apps make that harder to pull
    off.

    You'll also see "zero-access encryption", which some providers use for data that arrives
    readable (an ordinary incoming email, say) and is encrypted with your key as soon as it lands.
    Don't confuse any of it with zero-knowledge proofs, the maths behind some privacy coins - same
    name, different idea.
  : |-
    “Conhecimento zero” é sobretudo um termo de marketing, mas um termo útil. Os seus arquivos, notas ou senhas são criptografados no seu aparelho com uma chave que vem da sua senha (ou com uma chave que só você tem), e só a versão criptografada é enviada para a empresa. Ela consegue guardar e sincronizar esses dados, mas não consegue lê-los, e quem invadir os sistemas dela também não.

    Confira o que está coberto de fato, porque o seu endereço de e-mail, o tamanho dos arquivos, os registros de data e hora e às vezes o nome dos arquivos podem continuar legíveis. Se você esquecer a senha, geralmente não há como recuperar os dados. É justamente essa a ideia, mas pega muita gente de surpresa. E, se você usa o app web, a empresa manda um código novo toda vez que você o abre, então, se ela passasse a agir de má-fé (ou fosse obrigada a isso), poderia entregar uma versão que captura a sua senha. Os apps para computador e celular dificultam esse tipo de coisa.

    Você também vai ver “criptografia de acesso zero”, que algumas empresas usam para dados que chegam legíveis (um e-mail comum que você recebe, por exemplo) e que são criptografados com a sua chave na mesma hora. Não confunda nada disso com provas de conhecimento zero, a matemática por trás de algumas criptomoedas de privacidade: o nome é o mesmo, mas a ideia é outra.
  client-side encryption: criptografia do lado do cliente
  zero-access encryption: criptografia de acesso zero
