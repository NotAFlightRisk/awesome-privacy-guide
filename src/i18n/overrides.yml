  # The glossary, translated by hand
  Two-factor authentication: Autenticazione a due fattori
  Logging in with your password plus a second thing, like a code from your phone or a security key, so a stolen password isn't enough.: Accedere con la password più qualcos'altro, come un codice sul telefono o una chiave di sicurezza, così una password rubata non basta.
  ? |
    With two-factor authentication, someone who steals your password still can't get in without your
    second factor. That might be a code texted to you, a code from an authenticator app, a prompt on
    your phone or a hardware security key. Turn it on for anything that matters, starting with your
    email, since that's where most password resets go.

    The options aren't equal. SMS codes are the weakest, because attackers can talk your mobile
    network into moving your number to their SIM (a SIM swap), but they still beat nothing.
    Authenticator apps are better. Phone prompts can be abused by attackers who spam you with
    requests until you tap "approve". Passkeys and hardware security keys are the strongest, since
    they won't work on a fake site.

    Whatever you use, save the backup codes somewhere safe, or a lost phone can mean a lost account.
    Keeping your 2FA codes in the same password manager as your passwords is convenient, but if that
    one vault is ever compromised, both factors go with it.
  : |-
    Con l'autenticazione a due fattori, chi ti ruba la password non riesce comunque a entrare senza il tuo secondo fattore. Può essere un codice che ti arriva via SMS, un codice generato da un'app di autenticazione, una richiesta di conferma sul telefono o una chiave di sicurezza hardware. Attivala su tutto ciò che conta, a cominciare dall'email, perché è lì che arriva la maggior parte dei link per reimpostare le password.

    Le opzioni non si equivalgono. I codici via SMS sono i più deboli, perché chi attacca può convincere il tuo operatore telefonico a spostare il tuo numero sulla propria SIM (il cosiddetto SIM swap), ma sono comunque meglio di niente. Le app di autenticazione sono migliori. Le richieste di conferma sul telefono si prestano agli abusi di chi ti tempesta di notifiche finché non tocchi «approva». Le passkey e le chiavi di sicurezza hardware sono le più sicure, perché su un sito falso non funzionano.

    Qualunque metodo usi, conserva i codici di backup in un posto sicuro, altrimenti perdere il telefono può voler dire perdere l'account. Tenere i codici 2FA nello stesso password manager che usi per le password è comodo, ma se quell'unica cassaforte viene compromessa, perdi tutti e due i fattori in un colpo solo.
  2FA: 2FA
  MFA: MFA
  multi-factor authentication: autenticazione a più fattori
  two-step verification: verifica in due passaggi
  Anonymity, pseudonymity and privacy: Anonimato, pseudonimato e privacy
  Privacy hides what you do, anonymity hides who you are, and pseudonymity puts a consistent made-up name between you and what you do.: La privacy nasconde quello che fai, l'anonimato nasconde chi sei, e lo pseudonimato mette un nome inventato, sempre lo stesso, tra te e quello che fai.
  ? |
    These get mixed up all the time. Privacy is keeping what you do between you and the people you
    choose, like your messages, files and browsing. Anonymity is nobody knowing who did something,
    even if what was done is public. Pseudonymity sits in between: you act under a consistent name
    that isn't your real one, like a username, so people can recognise you without knowing who you
    are.

    You can have one without the others. An end-to-end encrypted chat with a friend is private but
    not anonymous, since you both know who's on the other end. A post made through Tor on a public
    forum can be anonymous but not private. Most online accounts are pseudonymous, and a pseudonym
    is only as good as the weakest link back to you, like a reused email address, a payment or a
    slip in something you post.

    Real anonymity is hard, and usually takes several tools plus careful habits - a VPN or a "no
    sign-up" app won't get you there alone. Work out which of the three you actually need, as it
    changes which tools make sense.
  : |-
    Si confondono di continuo. La privacy è tenere quello che fai tra te e le persone che scegli tu, come i tuoi messaggi, i tuoi file e la tua navigazione. L'anonimato vuol dire che nessuno sa chi ha fatto una cosa, anche se la cosa in sé è pubblica. Lo pseudonimato sta nel mezzo: agisci con un nome che non è quello vero ma resta sempre lo stesso, come un nome utente, così gli altri possono riconoscerti senza sapere chi sei.

    Puoi avere una cosa senza le altre. Una chat cifrata end-to-end con un amico è privata ma non anonima, perché sapete tutti e due chi c'è dall'altra parte. Un post scritto tramite Tor su un forum pubblico può essere anonimo ma non privato. La maggior parte degli account online usa uno pseudonimo, e uno pseudonimo è solido solo quanto l'anello più debole che porta fino a te, come un indirizzo email riutilizzato, un pagamento o una svista in qualcosa che pubblichi.

    Il vero anonimato è difficile e di solito richiede più strumenti e abitudini attente: una VPN o un'app «senza registrazione» da sole non bastano. Cerca di capire quale delle tre cose ti serve davvero, perché da questo dipende quali strumenti hanno senso.
  Browser fingerprinting: Impronta digitale del browser
  Identifying you by combining lots of small details about your browser and device, which works without cookies and survives clearing them.: Un modo di identificarti mettendo insieme tanti piccoli dettagli sul tuo browser e sul tuo dispositivo, che funziona senza cookie e resiste anche se li cancelli.
  ? |
    Any page you load can read dozens of small details about your browser: screen size, time zone,
    language, installed fonts, tiny differences in how your hardware draws graphics (canvas
    fingerprinting) and plenty more. None of them identifies you on its own, but together they're
    often close to unique, so trackers can recognise you across sites and visits without storing
    anything on your device.

    That's what makes it awkward. Clearing cookies or opening a private window doesn't change your
    fingerprint, and a VPN only changes your IP address. Piling on extensions and unusual settings
    can make you stand out more, not less.

    There are two main defences. One is to look like everyone else, which is what Tor Browser does
    by making its users as alike as possible. The other is to randomise some of those details so
    your fingerprint keeps changing. You can see how your own browser does with the EFF's
    [Cover Your Tracks](https://coveryourtracks.eff.org/).
  : |-
    Qualsiasi pagina che apri può leggere decine di piccoli dettagli sul tuo browser: le dimensioni dello schermo, il fuso orario, la lingua, i font installati, minime differenze nel modo in cui il tuo hardware disegna la grafica (il canvas fingerprinting) e molto altro. Nessuno di questi basta da solo a identificarti, ma messi insieme spesso sono quasi unici, quindi i tracker possono riconoscerti da un sito all'altro e da una visita all'altra senza salvare niente sul tuo dispositivo.

    Il problema è proprio questo. Cancellare i cookie o aprire una finestra in incognito non cambia la tua impronta, e una VPN cambia solo il tuo indirizzo IP. Accumulare estensioni e impostazioni insolite può renderti più riconoscibile, non meno.

    Le difese principali sono due. Una è somigliare a tutti gli altri, ed è quello che fa Tor Browser, rendendo i suoi utenti il più possibile simili tra loro. L'altra è rendere casuali alcuni di quei dettagli, così la tua impronta continua a cambiare. Puoi vedere come se la cava il tuo browser con [Cover Your Tracks](https://coveryourtracks.eff.org/) dell'EFF.
  device fingerprinting: impronta digitale del dispositivo
  Custom ROM: Custom ROM
  A replacement version of Android you install yourself, often with Google's apps and services stripped out to cut down on tracking.: Una versione alternativa di Android che installi da te, spesso senza le app e i servizi di Google, per ridurre il tracciamento.
  ? |
    A custom ROM is an alternative version of Android, built from Google's open source code but put
    together by someone else. Many are "de-Googled", meaning they leave out Google Play Services,
    the background layer that runs with deep access on most Android phones. Installing one usually
    wipes your phone and means switching off its bootloader lock, which normally only lets the
    maker's own software start up.

    There are trade-offs. Some apps lean on Play Services for notifications, maps or payments and
    break or complain without it, though some ROMs offer workarounds like an open source stand-in or
    a sandboxed copy of Google's own. Banking and payment apps may refuse to run at all. Not every
    ROM is as secure as the stock software, either - some can't turn the bootloader lock back on,
    which makes it easier for someone who gets hold of your phone to tamper with it.

    Device support matters most. Check that your exact model is officially supported, how quickly
    security updates arrive and whether the project's still active, since a ROM that stops getting
    updates can leave you worse off than the stock software it replaced.
  : |-
    Una custom ROM è una versione alternativa di Android, costruita a partire dal codice open source di Google ma assemblata da qualcun altro. Molte sono «degooglizzate», cioè fanno a meno dei Google Play Services, il pacchetto di servizi che gira in background con permessi molto estesi sulla maggior parte dei telefoni Android. Installarne una di solito cancella tutto il contenuto del telefono e vuol dire sbloccare il bootloader, che da bloccato lascia avviare solo il software del produttore.

    Ci sono dei compromessi. Alcune app si appoggiano ai Play Services per notifiche, mappe o pagamenti, e se mancano smettono di funzionare o si lamentano, anche se alcune ROM offrono delle soluzioni, come un sostituto open source o una copia di quelli originali di Google isolata in una sandbox. Le app bancarie e di pagamento potrebbero proprio rifiutarsi di partire. E non tutte le ROM sono sicure quanto il software originale: alcune non permettono di bloccare di nuovo il bootloader, e così chi mette le mani sul tuo telefono può manometterlo più facilmente.

    Conta soprattutto il supporto per i dispositivi. Controlla che il tuo modello esatto sia supportato ufficialmente, quanto in fretta arrivano gli aggiornamenti di sicurezza e se il progetto è ancora attivo, perché una ROM che smette di ricevere aggiornamenti può lasciarti messo peggio che con il software originale che ha sostituito.
  de-Googled phone: telefono degooglizzato
  de-Googled Android: Android degooglizzato
  Data broker: Data broker
  A company that collects personal information about you from lots of sources and sells or rents it to whoever's buying.: Un'azienda che raccoglie informazioni personali su di te da tantissime fonti e le vende o le affitta a chiunque voglia comprarle.
  ? |
    Data brokers build profiles on people without ever dealing with them directly. They pull from
    public records, loyalty schemes, apps, online tracking, purchase histories and other companies'
    databases, then piece it all together: your name, addresses, phone numbers, age, likely income,
    interests and sometimes where you go.

    Those profiles get sold to advertisers, people-search sites, insurers and sometimes police or
    government agencies. You've almost certainly never heard of most of the companies involved,
    which is rather the point.

    You can ask brokers to delete your data - in the UK and EU you've got a legal right to, and some
    US states have similar laws - but there are hundreds of them and your details tend to reappear.
    Paid removal services send the requests for you, though they can't reach every broker. The
    longer-term fix is giving out less in the first place, with email aliases, virtual phone numbers
    and virtual cards.
  : |-
    I data broker costruiscono profili sulle persone senza averci mai a che fare direttamente. Attingono a registri pubblici, programmi fedeltà, app, tracciamento online, storici degli acquisti e database di altre aziende, poi mettono insieme tutti i pezzi: il tuo nome, i tuoi indirizzi, i numeri di telefono, l'età, il reddito stimato, gli interessi e a volte i posti in cui vai.

    Questi profili vengono venduti a inserzionisti, siti di ricerca di persone, assicurazioni e a volte alla polizia o ad agenzie governative. Quasi certamente non hai mai sentito nominare la maggior parte delle aziende coinvolte, ed è un po' questo il punto.

    Puoi chiedere ai data broker di cancellare i tuoi dati (nel Regno Unito e nell'UE è un tuo diritto per legge, e alcuni stati americani hanno leggi simili), ma sono centinaia e i tuoi dati tendono a ricomparire. I servizi di rimozione a pagamento mandano le richieste al posto tuo, anche se non riescono a raggiungere tutti i broker. La soluzione a lungo termine è dare meno informazioni fin dall'inizio, con alias email, numeri di telefono virtuali e carte virtuali.
  information broker: broker di informazioni
  data aggregator: aggregatore di dati
  Domain Name System: Domain Name System
  The internet's phone book, which turns names like example.com into the IP addresses your device actually connects to.: L'elenco telefonico di internet, che trasforma nomi come example.com negli indirizzi IP a cui il tuo dispositivo si collega davvero.
  ? |
    Before your device can load a site, it asks a DNS resolver for the site's IP address. By default
    that's usually your ISP's resolver, handed out by your router. Ordinary DNS isn't encrypted, so
    your ISP and anyone else on the network can see every domain you look up, even when the site
    itself uses HTTPS. Whoever runs the resolver can also log your lookups, block them or send you
    somewhere else.

    That's why your choice of resolver matters. Switching to a privacy-focused one (ideally over
    encrypted DNS) means your ISP isn't the one keeping a list, and many also block ads, trackers or
    malware for you. The new provider sees your lookups instead, so check its logging policy and
    where it's based.

    Running DNS for your own domain is a separate job, called DNS hosting. That's about publishing
    records so other people can find your website and email, rather than looking things up for
    yourself.
  : |-
    Prima di caricare un sito, il tuo dispositivo chiede a un resolver DNS l'indirizzo IP di quel sito. Se non hai cambiato niente, di solito è il resolver del tuo provider internet, che ti viene assegnato dal router. Il DNS tradizionale non è cifrato, quindi il tuo provider e chiunque altro sulla rete possono vedere tutti i domini che cerchi, anche quando il sito usa HTTPS. Chi gestisce il resolver può anche registrare le tue richieste, bloccarle o mandarti da un'altra parte.

    Per questo conta quale resolver usi. Se passi a uno attento alla privacy (meglio ancora tramite DNS cifrato), non è più il tuo provider internet a tenere l'elenco, e molti bloccano anche pubblicità, tracker o malware. Però a quel punto le tue richieste le vede il nuovo fornitore, quindi controlla la sua politica sui log e dove ha sede.

    Gestire il DNS del tuo dominio è un altro lavoro, che si chiama DNS hosting. Lì si tratta di pubblicare dei record perché gli altri trovino il tuo sito e la tua email, non di cercare indirizzi per conto tuo.
  DNS: DNS
  DNS leak: DNS leak
  When your DNS lookups go around your VPN, usually to your ISP, giving away the sites you visit while you think you're covered.: Quando le tue richieste DNS aggirano la VPN, di solito finendo al tuo provider internet, e rivelano i siti che visiti mentre credi di essere protetto.
  ? |
    On a VPN, your DNS lookups should go through the tunnel to the resolver your VPN uses. A DNS
    leak is when some of them go out the normal way instead, usually to your ISP. Your traffic's
    still encrypted, but your ISP gets a running list of the domains you're visiting, which is a
    good chunk of what you were trying to hide.

    Leaks usually come from your operating system doing its own thing: sending lookups out over
    every network connection it has, using IPv6 when the VPN only handles IPv4, or sticking with a
    DNS server you set by hand.

    Good VPN apps have leak protection built in and switched on. To check, connect to your VPN and
    run a DNS leak test - if any of the servers it lists belong to your ISP, you've got a leak. A
    kill switch that blocks everything outside the tunnel usually stops it too.
  : |-
    Con una VPN, le tue richieste DNS dovrebbero passare dentro il tunnel e arrivare al resolver che usa la VPN. Si ha un DNS leak quando alcune escono invece per la strada normale, di solito verso il tuo provider internet. Il traffico resta cifrato, ma il provider si ritrova un elenco sempre aggiornato dei domini che visiti, cioè buona parte di quello che volevi nascondere.

    In genere i leak nascono dal sistema operativo che fa di testa sua: manda le richieste su tutte le connessioni di rete che ha, usa IPv6 quando la VPN gestisce solo IPv4, oppure resta attaccato a un server DNS che hai impostato a mano.

    Le app VPN fatte bene hanno una protezione dai leak integrata e già attiva. Per controllare, connettiti alla VPN e fai un test per i DNS leak: se tra i server elencati ce n'è qualcuno del tuo provider internet, hai un leak. Anche un kill switch che ferma tutto il traffico fuori dal tunnel di norma lo impedisce.
  End-to-end encryption: Crittografia end-to-end
  Encryption where only the people at each end hold the keys, so the company in the middle can't read your messages or files.: "Un tipo di crittografia in cui solo le persone alle due estremità hanno le chiavi: l'azienda che sta in mezzo non può leggere i tuoi messaggi o i tuoi file."
  ? |
    With end-to-end encryption, your message is encrypted on your device and only decrypted on the
    recipient's. The service in between just passes along scrambled data it has no key for, so
    anything it leaks in a breach or is forced to hand over is gibberish. The Signal Protocol is the
    best-known way of doing it, and plenty of apps use it.

    What it doesn't hide is metadata - who you talked to, when and how often. It can't help if
    someone gets into your phone, and it won't stop the person you're talking to from taking
    screenshots. Backups are a common gap too: if your chat history goes to the cloud without the
    same encryption, that copy isn't protected.

    In a closed source app you're taking the company's word that it's really end-to-end, so look for
    open source apps, a published security audit and a way to check you're talking to the right
    person (usually by comparing a safety number or scanning a QR code). Be wary of "encrypted" on
    its own, as it often only means encrypted in transit, which the company can still read.
  : |-
    Con la crittografia end-to-end, il messaggio viene cifrato sul tuo dispositivo e decifrato solo su quello di chi lo riceve. Il servizio che sta in mezzo si limita a passare dati incomprensibili di cui non ha la chiave, quindi qualunque cosa esca in una violazione di dati, o che il servizio sia costretto a consegnare, è illeggibile. Il protocollo Signal è il modo più conosciuto per farlo, e lo usano parecchie app.

    Quello che non nasconde sono i metadati: con chi hai parlato, quando e quanto spesso. Non ti protegge se qualcuno entra nel tuo telefono, e non impedisce alla persona con cui parli di fare screenshot. Anche i backup sono spesso un punto scoperto: se la cronologia delle chat finisce nel cloud senza la stessa crittografia, quella copia non è protetta.

    In un'app a codice chiuso devi credere sulla parola all'azienda quando dice che è davvero end-to-end, perciò cerca app open source, un audit di sicurezza pubblicato e un modo per verificare che tu stia parlando con la persona giusta (di solito confrontando un numero di sicurezza o scansionando un codice QR). Diffida della parola «cifrato» da sola, perché spesso vuol dire solo cifrato in transito, e quindi leggibile dall'azienda.
  E2EE: E2EE
  E2E encryption: crittografia E2E
  Email alias: Alias email
  A separate email address that forwards to your real inbox, so each site gets its own address and you can switch it off if it gets spammed.: Un indirizzo email separato che inoltra la posta alla tua vera casella, così ogni sito ha il suo indirizzo e puoi disattivarlo se comincia a ricevere spam.
  ? |
    An alias is an address that just forwards mail to your real inbox. Use a different one for every
    site and your real address never gets out. If one starts getting spam, you'll know exactly who
    leaked or sold it, and you can turn that alias off without touching anything else. Many alias
    services also let you reply from the alias, so the other side never sees your real address.

    Aliases make it much harder for data brokers and marketers to join up your accounts by email
    address, and they limit the fallout when a site gets breached. Plus addressing
    (`yourname+shop@example.com`) is a weaker version of the same trick, as your real address is
    right there for anyone who strips off the plus bit.

    The alias provider sees every email that passes through, so pick one you'd trust with your
    inbox. Using your own domain means you can switch providers later without losing your aliases,
    and some services will encrypt forwarded mail with your PGP key. Aliases aren't the same as
    disposable inboxes, which are often public and short-lived.
  : |-
    Un alias è un indirizzo che si limita a inoltrare la posta alla tua vera casella. Usane uno diverso per ogni sito e il tuo indirizzo vero non andrà mai in giro. Se uno comincia a ricevere spam, sai esattamente chi l'ha fatto trapelare o l'ha venduto, e puoi disattivare quell'alias senza toccare nient'altro. Molti servizi di alias ti permettono anche di rispondere dall'alias, così dall'altra parte non vedono mai il tuo indirizzo vero.

    Con gli alias, per i data broker e per chi fa marketing diventa molto più difficile collegare i tuoi account attraverso l'indirizzo email, e quando un sito subisce una violazione i danni restano contenuti. Aggiungere un + all'indirizzo (`tuonome+shop@example.com`) è una versione più debole dello stesso trucco, perché il tuo indirizzo vero resta lì in bella vista per chiunque tolga la parte dal + in poi.

    Il servizio di alias vede ogni email che ci passa, quindi scegline uno a cui affideresti la tua casella di posta. Con un dominio tuo puoi cambiare servizio in futuro senza perdere gli alias, e alcuni servizi cifrano la posta inoltrata con la tua chiave PGP. Gli alias non sono la stessa cosa delle caselle usa e getta, che spesso sono pubbliche e durano poco.
  masked email: email mascherata
  forwarding address: indirizzo di inoltro
  email aliasing: uso di alias email
  DNS over HTTPS and DNS over TLS: DNS over HTTPS e DNS over TLS
  Ways of encrypting your DNS lookups, so your ISP or the network you're on can't read or tamper with them on the way to the resolver.: Modi per cifrare le tue richieste DNS, così il tuo provider internet o la rete a cui sei connesso non possono leggerle o manometterle lungo la strada verso il resolver.
  ? |
    Both protect your lookups between your device and the resolver. DNS over HTTPS (DoH) sends them
    as ordinary web traffic, which makes it harder to spot or block. DNS over TLS (DoT) uses its own
    port, which is tidier but easier for a network to block. DNSCrypt is an older protocol that does
    a similar job. Most browsers and operating systems support at least one of them, and on Android
    it's the "Private DNS" setting.

    They only hide your lookups from the network in between. The resolver still sees every one, so
    you need to trust whoever runs it. Your ISP can also still see the IP addresses you connect to,
    and often the site's name too, which goes out unencrypted at the start of most secure
    connections. It's a sensible upgrade, but it won't hide your browsing on its own.

    If you use a VPN, your lookups already travel inside the tunnel, so the VPN's own resolver is
    usually the simplest choice.
  : |-
    Entrambi proteggono le tue richieste tra il dispositivo e il resolver. DNS over HTTPS (DoH) le manda come normale traffico web, e questo le rende più difficili da individuare o bloccare. DNS over TLS (DoT) usa una porta tutta sua, una soluzione più pulita ma più facile da bloccare per una rete. DNSCrypt è un protocollo più vecchio che fa un lavoro simile. La maggior parte dei browser e dei sistemi operativi ne supporta almeno uno, e su Android è l'impostazione «DNS privato».

    Nascondono le tue richieste solo alla rete che sta in mezzo. Il resolver continua a vederle tutte, quindi devi fidarti di chi lo gestisce. Il tuo provider internet, poi, vede ancora gli indirizzi IP a cui ti colleghi, e spesso anche il nome del sito, che viaggia in chiaro all'inizio della maggior parte delle connessioni sicure. È un passo avanti sensato, ma da solo non nasconde la tua navigazione.

    Se usi una VPN, le tue richieste viaggiano già dentro il tunnel, quindi di solito la scelta più semplice è il resolver della VPN stessa.
  DoH: DoH
  DoT: DoT
  encrypted DNS: DNS cifrato
  Encryption at rest: Crittografia a riposo
  Encrypting data while it's stored on a disk, phone or server, so it's unreadable if the hardware is lost, stolen or thrown out.: Cifrare i dati mentre sono salvati su un disco, un telefono o un server, in modo che restino illeggibili se l'hardware viene perso, rubato o buttato via.
  ? |
    Encryption at rest protects stored data. On your own devices that means full-disk encryption: if
    your laptop's nicked or your phone goes missing, nobody can read what's on it without your
    password or PIN. Phones do it by default these days, and the main desktop operating systems have
    it built in, though it isn't always switched on.

    It does most of its work while the device is off or locked. Once you've logged in, your data is
    readable to you and to any malware you've picked up. For online services, "encrypted at rest"
    usually means the company encrypts its disks and keeps the keys itself. That stops someone
    walking out of a data centre with a hard drive, but the company can still read your data, and so
    can anyone with a court order.

    If you want a provider that can't read your stuff, you need zero-knowledge or end-to-end
    encryption instead, or to encrypt files yourself before you upload them.
  : |-
    La crittografia a riposo (in inglese «at rest») protegge i dati archiviati. Sui tuoi dispositivi vuol dire crittografia completa del disco: se ti fregano il portatile o perdi il telefono, nessuno può leggerne il contenuto senza la tua password o il tuo PIN. Ormai i telefoni lo fanno di serie, e i principali sistemi operativi desktop ce l'hanno integrata, anche se non sempre è attiva.

    Fa quasi tutto il suo lavoro mentre il dispositivo è spento o bloccato. Una volta che hai fatto l'accesso, i tuoi dati sono leggibili per te e per qualsiasi malware tu abbia preso. Nei servizi online, «cifrati a riposo» di solito vuol dire che l'azienda cifra i propri dischi e tiene le chiavi per sé. Serve contro chi esce da un data center con un hard disk sotto il braccio, ma l'azienda può comunque leggere i tuoi dati, e così chiunque abbia un ordine del giudice.

    Se vuoi un fornitore che non possa leggere le tue cose, ti serve invece la crittografia a conoscenza zero o end-to-end, oppure cifrare da te i file prima di caricarli.
  storage encryption: crittografia dei dati archiviati
  full-disk encryption: crittografia completa del disco
  Encryption in transit: Crittografia in transito
  Encrypting data while it travels between your device and a server, so people on the network can't read it, though the server still can.: Cifrare i dati mentre viaggiano tra il tuo dispositivo e un server, così chi è sulla rete non può leggerli, anche se il server sì.
  ? |
    Encryption in transit protects data on its way from A to B. It's what the S in HTTPS is about:
    TLS (the successor to SSL) encrypts the connection, so your ISP, the coffee shop Wi-Fi or anyone
    else in the middle can't read or change what you send. Almost every site and app uses it now,
    and one that doesn't is a red flag.

    But it stops at the server. The company decrypts your data when it arrives and can read, scan or
    store it, or be made to hand it over. So when a service says your data is "encrypted", that
    often just means this, maybe with encryption at rest on top. For a provider that can't read your
    stuff, you need end-to-end or zero-knowledge encryption.

    Email is a special case. Mail between providers is usually encrypted in transit too, but only
    when both servers support it, so some messages still cross the internet in plain text. Even when
    it's encrypted, every server that handles it can read it.
  : |-
    La crittografia in transito protegge i dati lungo il tragitto da A a B. È quello a cui si riferisce la S di HTTPS: TLS (il successore di SSL) cifra la connessione, quindi il tuo provider internet, il Wi-Fi del bar o chiunque altro stia in mezzo non può leggere né modificare quello che invii. Ormai la usano quasi tutti i siti e le app, e uno che non la usa è un campanello d'allarme.

    Però si ferma al server. L'azienda decifra i tuoi dati quando arrivano e può leggerli, analizzarli o conservarli, oppure essere costretta a consegnarli. Per questo, quando un servizio dice che i tuoi dati sono «cifrati», spesso intende solo questo, magari con in più la crittografia a riposo. Se vuoi un fornitore che non possa leggere le tue cose, ti serve la crittografia end-to-end o a conoscenza zero.

    L'email è un caso a parte. Anche la posta che passa da un fornitore all'altro di solito è cifrata in transito, ma solo quando tutti e due i server lo supportano, quindi alcuni messaggi attraversano ancora internet in chiaro. E anche quando è cifrata, ogni server che la gestisce può leggerla.
  TLS encryption: crittografia TLS
  SSL encryption: crittografia SSL
  transport encryption: crittografia del trasporto
  Federation: Federazione
  Lots of independently run servers that talk to each other, so you can pick (or run) your own server and still reach everyone else.: Tanti server gestiti in modo indipendente che comunicano tra loro, così puoi scegliere (o gestire) il tuo server e raggiungere comunque tutti gli altri.
  ? |
    Email is the classic example of federation: you can be with one provider and email someone with
    another, and neither of them is in charge. Matrix (for chat) and Mastodon (for social media)
    work the same way, each made up of thousands of servers that speak a shared protocol. Mastodon
    and everything else built on ActivityPub are known together as the fediverse.

    No single company owns the network, so nobody can sell it, fill it with ads or lock you in, and
    if you don't like your server's rules you can move. The flip side is that your server's admins
    can see anything it stores unencrypted, and whatever you send to people on other servers gets
    copied there too. Deleting it later asks those servers to delete their copies, but nothing
    forces them to.

    So pick a server run by people you trust, or run your own. And check what's end-to-end
    encrypted - on some federated platforms private messages are, and on others the admins of both
    servers can read them.
  : |-
    L'email è l'esempio classico di federazione: puoi avere un indirizzo presso un fornitore e scrivere a qualcuno che ne usa un altro, senza che nessuno dei due comandi. Matrix (per la chat) e Mastodon (per i social) funzionano allo stesso modo, e ognuno è fatto di migliaia di server che parlano un protocollo comune. Mastodon e tutto ciò che si basa su ActivityPub, nel loro insieme, si chiamano fediverso.

    Nessuna singola azienda possiede la rete, quindi nessuno può venderla, riempirla di pubblicità o tenerti in trappola, e se le regole del tuo server non ti piacciono puoi trasferirti. Il lato negativo è che gli amministratori del tuo server possono vedere tutto quello che conserva in chiaro, e tutto quello che mandi a persone su altri server viene copiato anche lì. Se poi lo elimini, a quei server viene chiesto di eliminare le loro copie, ma niente li obbliga a farlo.

    Quindi scegli un server gestito da persone di cui ti fidi, oppure gestiscine uno tuo. E controlla cosa è cifrato end-to-end: su alcune piattaforme federate i messaggi privati lo sono, su altre li possono leggere gli amministratori di entrambi i server.
  federated networks: reti federate
  Five Eyes and Fourteen Eyes: Five Eyes e Fourteen Eyes
  An intelligence-sharing alliance between the UK, US, Canada, Australia and New Zealand, plus wider groups known as the Nine and Fourteen Eyes.: Un'alleanza per la condivisione dell'intelligence tra Regno Unito, Stati Uniti, Canada, Australia e Nuova Zelanda, a cui si aggiungono gruppi più ampi noti come Nine Eyes e Fourteen Eyes.
  ? |
    The [Five Eyes](https://en.wikipedia.org/wiki/Five_Eyes) grew out of the UKUSA Agreement of
    1946, and today the UK, US, Canada, Australia and New Zealand share signals intelligence through
    it. Wider, looser groups have been reported too. The Nine Eyes adds Denmark, France, the
    Netherlands and Norway, and the Fourteen Eyes adds Belgium, Germany, Italy, Spain and Sweden.

    You'll see it all over VPN marketing, usually as "based outside the 14 Eyes". These countries do
    work closely together, and some have sweeping surveillance laws. But it isn't a magic line.
    Intelligence agencies spy on foreign communications anyway, and every country has some way of
    making a business on its own soil cooperate.

    What a provider can be forced to hand over, and what it actually keeps, matter far more than
    which list its country is on. A service that only ever holds encrypted data it can't read is in
    a much better spot wherever it's based.
  : |-
    L'alleanza [Five Eyes](https://en.wikipedia.org/wiki/Five_Eyes) è nata dall'accordo UKUSA del 1946, e oggi Regno Unito, Stati Uniti, Canada, Australia e Nuova Zelanda la usano per condividere l'intelligence dei segnali. Si parla anche di gruppi più ampi e meno stretti. I Nine Eyes aggiungono Danimarca, Francia, Paesi Bassi e Norvegia, e i Fourteen Eyes aggiungono Belgio, Germania, Italia, Spagna e Svezia.

    Se ne parla ovunque nel marketing delle VPN, di solito nella forma «con sede fuori dai 14 Eyes». Questi paesi collaborano davvero a stretto contatto, e alcuni hanno leggi sulla sorveglianza molto estese. Ma non è un confine magico. Le agenzie di intelligence spiano comunque le comunicazioni straniere, e ogni paese ha qualche modo per costringere un'azienda sul proprio territorio a collaborare.

    Quello che un fornitore può essere costretto a consegnare, e quello che conserva davvero, contano molto più della lista in cui compare il suo paese. Un servizio che tiene solo dati cifrati che non è in grado di leggere è in una posizione molto migliore, ovunque abbia sede.
  FVEY: FVEY
  5 Eyes: 5 Eyes
  14 Eyes: 14 Eyes
  Forward secrecy: Forward secrecy
  Giving each session or message its own short-lived keys, so a key stolen later can't decrypt all your old conversations.: Dare a ogni sessione o messaggio chiavi proprie e di breve durata, così una chiave rubata in futuro non può decifrare tutte le tue vecchie conversazioni.
  ? |
    Without forward secrecy, everything encrypted with a long-term key is only as safe as that key.
    If someone records your encrypted traffic today and steals the key in five years, they can go
    back and decrypt all of it. With forward secrecy, each session (or, in good messaging apps, each
    message) uses short-lived keys that get thrown away, so old traffic stays scrambled even if a
    long-term key leaks.

    Modern HTTPS (TLS 1.3) has it built in, and so does the Signal Protocol, which goes a step
    further and can recover after a key's been stolen, so future messages become safe again. PGP
    email doesn't have forward secrecy, which is one of the main criticisms of it.

    It's not something you can usually switch on yourself, as it's down to the protocol an app uses.
    When you're comparing messaging apps, having it is a good sign the encryption is modern and well
    designed.
  : |-
    Senza forward secrecy, tutto quello che è cifrato con una chiave a lungo termine è al sicuro solo quanto quella chiave. Se qualcuno registra oggi il tuo traffico cifrato e ruba la chiave tra cinque anni, può tornare indietro e decifrarlo tutto. Con la forward secrecy, ogni sessione (o, nelle app di messaggistica fatte bene, ogni messaggio) usa chiavi di breve durata che poi vengono buttate via, quindi il traffico vecchio resta illeggibile anche se una chiave a lungo termine finisce in mani sbagliate.

    L'HTTPS moderno (TLS 1.3) ce l'ha integrata, e lo stesso vale per il protocollo Signal, che fa un passo in più e riesce a riprendersi dopo il furto di una chiave, così i messaggi futuri tornano al sicuro. L'email con PGP non ha la forward secrecy, ed è una delle principali critiche che le vengono mosse.

    Di solito non è una cosa che puoi attivare tu, perché dipende dal protocollo che usa l'app. Quando confronti app di messaggistica, se c'è è un buon segno che la crittografia sia moderna e progettata bene.
  perfect forward secrecy: perfect forward secrecy
  PFS: PFS
  Free and open source software: Software libero e open source
  Software that's free as in freedom - you can run, study, change and share it - which in practice nearly always means open source too.: "Software «free» nel senso di libero, non gratuito: puoi usarlo, studiarlo, modificarlo e condividerlo, e in pratica è quasi sempre anche open source."
  ? |
    The "free" in FOSS is about freedom, not price, or as the old line goes, "free as in speech, not
    as in beer". The Free Software Foundation
    [defines it](https://www.gnu.org/philosophy/free-sw.html) as four freedoms: to run the program
    however you like, to study and change how it works, to share copies, and to share your changed
    versions. FLOSS (free/libre and open source software) means the same thing, with "libre" added
    to dodge the price confusion.

    In practice, nearly all free software is open source and the other way round. The difference is
    mostly philosophy: free software folk see it as an ethical issue, open source folk as a better
    way to build software. Licences split along a different line. Copyleft licences like the GPL
    make anyone who distributes a changed version share their code on the same terms, while
    permissive ones like MIT let people make closed versions.

    The AGPL goes a step further and covers software run as an online service, so anyone hosting a
    modified version has to offer its users the source. On Android, the F-Droid app store only lists
    FOSS apps, and flags the ones with tracking or other anti-features.
  : |-
    In inglese «free» vuol dire sia «libero» sia «gratis», e quello di FOSS riguarda la libertà, non il prezzo, come ricorda il vecchio motto «free as in speech, not as in beer». La Free Software Foundation [definisce](https://www.gnu.org/philosophy/free-sw.html) il software libero attraverso quattro libertà: eseguire il programma come vuoi, studiare come funziona e modificarlo, condividerne copie e condividere le tue versioni modificate. FLOSS (free/libre and open source software) vuol dire la stessa cosa, con «libre» aggiunto per evitare l'equivoco sul prezzo.

    In pratica, quasi tutto il software libero è open source, e viceversa. La differenza è soprattutto filosofica: per la comunità del software libero è una questione etica, per quella dell'open source è un modo migliore di sviluppare software. Le licenze, invece, si dividono secondo un altro criterio. Le licenze copyleft come la GPL obbligano chiunque distribuisca una versione modificata a condividerne il codice alle stesse condizioni, mentre quelle permissive come la MIT permettono di farne versioni chiuse.

    L'AGPL fa un passo in più e copre anche il software usato come servizio online, quindi chi ospita una versione modificata deve offrirne il codice sorgente ai suoi utenti. Su Android, lo store F-Droid elenca solo app FOSS e segnala quelle con tracciamento o altre anti-funzionalità.
  FOSS: FOSS
  FLOSS: FLOSS
  free software: software libero
  libre software: software libre
  Hardware security key: Chiave di sicurezza hardware
  A small USB or NFC device you tap to log in, which proves it's really you and won't work on phishing sites.: Un piccolo dispositivo USB o NFC da toccare quando accedi, che dimostra che sei davvero tu e sui siti di phishing non funziona.
  ? |
    A hardware security key is a small device, usually on your keyring, that plugs into a USB port
    or taps against your phone over NFC. It holds cryptographic keys that never leave it, so malware
    on your computer can't copy them. You can use it as a second factor alongside your password, or
    on newer keys to hold passkeys and skip the password entirely.

    Like passkeys, security keys check the website's real address before they'll sign you in, so
    they're one of the few logins that phishing can't easily beat. That's why they're the usual
    advice for anyone likely to be targeted, like journalists, activists or people with money or
    access worth stealing. Some can also generate TOTP codes, hold PGP keys or work as a smart card.

    Buy two and register both, and keep the spare somewhere safe, because losing your only key means
    relying on recovery codes (or getting locked out). Check that the services you care about
    support them and let you add more than one. Keys only have room for a limited number of
    passkeys, so check the spec if you plan to store a lot.
  : |-
    Una chiave di sicurezza hardware è un piccolo dispositivo, di solito attaccato al portachiavi, che si inserisce in una porta USB o si appoggia al telefono via NFC. Contiene chiavi crittografiche che non ne escono mai: un malware sul tuo computer non può copiarle. Puoi usarla come secondo fattore insieme alla password oppure, con le chiavi più recenti, per conservare delle passkey e fare del tutto a meno della password.

    Come le passkey, le chiavi di sicurezza controllano il vero indirizzo del sito prima di farti accedere, quindi sono uno dei pochi metodi di accesso che il phishing non riesce a superare facilmente. Per questo sono il consiglio classico per chi rischia di finire nel mirino, come giornalisti, attivisti o persone con soldi o accessi che vale la pena rubare. Alcune possono anche generare codici TOTP, contenere chiavi PGP o funzionare come smart card.

    Comprane due e registrale entrambe, e tieni quella di scorta in un posto sicuro, perché se perdi l'unica chiave che hai dovrai affidarti ai codici di recupero (o resterai chiuso fuori). Verifica che i servizi che ti interessano le supportino e ti permettano di aggiungerne più di una. Le chiavi hanno spazio solo per un numero limitato di passkey: se pensi di salvarne tante, guarda le specifiche.
  security key: chiave di sicurezza
  FIDO key: chiave FIDO
  U2F key: chiave U2F
  Jurisdiction: Giurisdizione
  The country whose laws a service has to follow, which decides who can demand your data and what the company can be made to do.: Il paese di cui un servizio deve rispettare le leggi, che decide chi può pretendere i tuoi dati e cosa si può obbligare l'azienda a fare.
  ? |
    A service's jurisdiction is the country (or countries) whose laws it has to follow, usually
    where it's registered plus wherever it has servers or staff. Those laws decide whether it can be
    made to hand over your data, keep logs it otherwise wouldn't, monitor a particular user, or keep
    quiet about any of it. They also set your rights - in the UK and EU, for example, you can ask
    for a copy of your data or have it deleted.

    Privacy-focused companies often base themselves somewhere with strong privacy laws, and say so
    loudly. That's a real plus, but it has limits. Providers in privacy-friendly countries have
    still been ordered to log specific users, and police in one country can ask another to get data
    on their behalf.

    Jurisdiction matters most when a company holds data it can read. If your data's end-to-end
    encrypted and the provider keeps little else, there's much less for any court to get hold of.
  : |-
    La giurisdizione di un servizio è il paese (o i paesi) di cui deve rispettare le leggi, di solito quello in cui è registrato più tutti quelli in cui ha server o personale. Sono quelle leggi a decidere se può essere costretto a consegnare i tuoi dati, a conservare log che altrimenti non terrebbe, a sorvegliare un determinato utente o a tenere segreto tutto questo. Stabiliscono anche i tuoi diritti: nel Regno Unito e nell'UE, per esempio, puoi chiedere una copia dei tuoi dati o farli cancellare.

    Le aziende attente alla privacy spesso si stabiliscono in paesi con leggi forti sulla privacy, e lo fanno sapere a gran voce. È un vantaggio reale, ma ha dei limiti. A fornitori con sede in paesi favorevoli alla privacy è stato comunque ordinato di registrare l'attività di utenti specifici, e la polizia di un paese può chiedere a un altro di ottenere dati per suo conto.

    La giurisdizione conta soprattutto quando un'azienda conserva dati che può leggere. Se i tuoi dati sono cifrati end-to-end e il fornitore conserva poco altro, c'è molto meno su cui un tribunale possa mettere le mani.
  Kill switch: Kill switch
  A VPN setting that cuts off your internet if the VPN connection drops, so nothing gets sent outside the tunnel.: Un'impostazione della VPN che blocca la connessione a internet se la VPN cade, perché niente venga inviato fuori dal tunnel.
  ? |
    VPN connections drop more often than you'd think, like when you switch networks, wake your
    laptop or a server goes down. Without a kill switch your device just carries on over your normal
    connection, often without telling you, and your real IP address and browsing are out in the
    open. A kill switch blocks all traffic until the VPN's back.

    They're not all equal. Some only work while the VPN app's running, so if the app crashes, your
    protection goes with it. Better ones set firewall rules in your operating system that stay in
    place even if the app doesn't, and some block traffic from the moment your device starts up. On
    Android, look for the built-in "Always-on VPN" and "Block connections without VPN" settings.

    Check whether it's on by default, since it isn't always. Some apps also have a stricter mode
    that blocks everything unless the VPN's connected, even after you've switched the VPN off
    yourself.
  : |-
    Le connessioni VPN cadono più spesso di quanto pensi, per esempio quando cambi rete, riattivi il portatile o un server va giù. Senza un kill switch il dispositivo va avanti tranquillo sulla connessione normale, spesso senza dirti niente, e il tuo vero indirizzo IP e la tua navigazione restano allo scoperto. Un kill switch blocca tutto il traffico finché la VPN non torna.

    Non sono tutti uguali. Alcuni funzionano solo finché l'app della VPN è in esecuzione, quindi se l'app va in crash, salta anche la protezione. Quelli migliori impostano nel sistema operativo regole del firewall che restano in vigore anche se l'app si chiude, e alcuni fermano il traffico fin dall'avvio del dispositivo. Su Android, cerca le impostazioni integrate «VPN sempre attiva» e «Blocca connessioni senza VPN».

    Controlla se è attivo di default, perché non sempre lo è. Alcune app hanno anche una modalità più rigida che blocca tutto se la VPN non è connessa, anche dopo che l'hai disattivata tu.
  VPN kill switch: kill switch VPN
  Know your customer: Know your customer
  The identity checks that banks, card providers and crypto exchanges have to run before you can use them, usually with a photo ID.: I controlli d'identità che banche, emittenti di carte ed exchange di criptovalute devono fare prima che tu possa usare i loro servizi, di solito con un documento d'identità con foto.
  ? |
    KYC rules are there to fight fraud and money laundering, and they apply to most regulated
    financial services, including banks, card issuers, payment apps and big crypto exchanges.
    Signing up means handing over your name, address and date of birth, often with a photo of your
    ID and a selfie, and the company has to keep those records for years.

    For privacy, that means your real identity is tied to everything you do on the service, and
    copies of your ID are stored in a database that could leak (and some have). Some services
    outside finance ask for ID too, like phone number providers in countries where the law requires
    it.

    Doing without KYC, legally, usually means smaller amounts and fewer features: cash, prepaid
    cards with low limits, peer-to-peer crypto trading or services that don't ask. The rules vary a
    lot by country, so check what applies where you are.
  : |-
    Le regole KYC servono a combattere le frodi e il riciclaggio di denaro, e valgono per la maggior parte dei servizi finanziari regolamentati, tra cui banche, emittenti di carte, app di pagamento e i grandi exchange di criptovalute. Per iscriverti devi fornire nome, indirizzo e data di nascita, spesso insieme alla foto di un documento d'identità e a un selfie, e l'azienda è tenuta a conservare quei dati per anni.

    Per la privacy, questo vuol dire che la tua vera identità è legata a tutto quello che fai sul servizio, e che le copie del tuo documento sono conservate in un database che potrebbe subire una fuga di dati (e ad alcuni è successo). Anche alcuni servizi fuori dal mondo della finanza chiedono un documento, come i fornitori di numeri di telefono nei paesi in cui lo impone la legge.

    Fare a meno del KYC, legalmente, di solito vuol dire importi più piccoli e meno funzioni: contanti, carte prepagate con limiti ridotti, compravendita di criptovalute peer-to-peer o servizi che non lo chiedono. Le regole cambiano parecchio da un paese all'altro, quindi controlla cosa vale dove vivi.
  KYC: KYC
  ID verification: verifica dell'identità
  Metadata: Metadati
  Data about your data - who you contacted, when, from where and on what device - rather than what you actually said or saved.: Dati sui tuoi dati, cioè chi hai contattato, quando, da dove e da quale dispositivo, anziché quello che hai detto o salvato davvero.
  ? |
    Metadata is everything around the content. For a message, that's who sent it to whom, when, how
    often and from which IP address. For a photo, it's often baked into the file as EXIF data: the
    phone or camera model, the time it was taken and sometimes the exact GPS location. Office
    documents can carry your name, your organisation and leftover comments or tracked changes.

    It's easy to shrug off, but it adds up fast. Who you talk to and where you go can reveal more
    than the messages themselves, which is why so much surveillance collects it. Michael Hayden, a
    former head of the NSA, once said "we kill people based on metadata", and he wasn't joking.

    End-to-end encryption protects the content, not usually the metadata, so messaging apps vary a
    lot in how much of it they can see or keep. With email, the servers always see who it's from,
    who it's to and when, encrypted or not. For files, strip the metadata before you share them -
    some sites remove EXIF data from uploads, but they may keep it for themselves.
  : |-
    I metadati sono tutto quello che sta intorno al contenuto. Per un messaggio sono chi l'ha mandato a chi, quando, quanto spesso e da quale indirizzo IP. Per una foto spesso sono incorporati nel file come dati EXIF: il modello del telefono o della fotocamera, l'ora dello scatto e a volte la posizione GPS esatta. I documenti di Office possono portarsi dietro il tuo nome, quello della tua organizzazione e commenti o revisioni rimasti nel file.

    È facile non darci peso, ma si accumulano in fretta. Con chi parli e dove vai possono rivelare più dei messaggi stessi, ed è per questo che tanti programmi di sorveglianza li raccolgono. Michael Hayden, ex direttore della NSA, una volta ha detto: «Uccidiamo persone sulla base dei metadati». E non stava scherzando.

    La crittografia end-to-end protegge il contenuto, ma di solito non i metadati, quindi da un'app di messaggistica all'altra cambia molto quanti ne possono vedere o conservare. Con l'email, i server vedono sempre chi l'ha mandata, a chi e quando, che sia cifrata o no. Per i file, togli i metadati prima di condividerli: alcuni siti rimuovono i dati EXIF da quello che carichi, ma potrebbero tenerseli per sé.
  No-logs policy: Politica no-log
  A provider's promise not to keep records of what you do on its service, most often made by VPNs and DNS providers.: La promessa di un fornitore di non tenere traccia di quello che fai sul suo servizio, fatta soprattutto da VPN e servizi DNS.
  ? |
    A no-logs policy is a promise not to record what you get up to, like the sites you visit, the IP
    address you connect from, and when and for how long you're connected. It's most common with
    VPNs, where the provider can see all your traffic and says it won't keep any of it. It never
    means no data at all - they'll usually still have your account details and payment records, so
    read what the policy actually covers.

    The problem is you can't check it from the outside, and providers that advertised no logs have
    handed records to the police before. The best signs are independent audits (repeated, ideally),
    servers that run from memory so nothing survives a reboot, and real-world tests: court cases or
    server seizures where the provider had nothing to hand over.

    Even a perfect policy only covers the provider. Your ISP can still see that you're connected to
    a VPN, and the sites you visit can still log what you do once you get there.
  : |-
    Una politica no-log è la promessa di non registrare quello che fai, come i siti che visiti, l'indirizzo IP da cui ti colleghi, e quando e per quanto tempo resti connesso. È più diffusa tra le VPN, dove il fornitore può vedere tutto il tuo traffico e dice di non conservarne niente. Non vuol mai dire nessun dato in assoluto: di solito il fornitore ha comunque i dati del tuo account e dei pagamenti, quindi leggi cosa copre davvero la politica.

    Il problema è che da fuori non puoi verificarla, e in passato fornitori che pubblicizzavano l'assenza di log hanno consegnato dati alla polizia. I segnali migliori sono gli audit indipendenti (meglio se ripetuti), i server che girano interamente in RAM, così che niente sopravviva a un riavvio, e le prove sul campo: casi giudiziari o sequestri di server in cui il fornitore non aveva niente da consegnare.

    Anche una politica perfetta riguarda solo il fornitore. Il tuo provider internet vede comunque che sei connesso a una VPN, e i siti che visiti possono ancora registrare quello che fai una volta che ci entri.
  no-log policy: policy no-log
  zero-logs policy: politica zero-log
  Open source: Open source
  Software whose source code is public, under a licence that lets anyone read, use, change and share it.: Software il cui codice sorgente è pubblico, con una licenza che permette a chiunque di leggerlo, usarlo, modificarlo e condividerlo.
  ? |
    Open source means the code is published under a licence that meets the
    [Open Source Definition](https://opensource.org/osd), so anyone can read it, use it, change it
    and pass it on. It doesn't have to be free of charge. For privacy tools that's the main draw,
    because people outside the company can check what the app really does with your data instead of
    taking the marketing's word for it.

    It's no guarantee, mind. Published code doesn't mean anyone's checked it, and serious bugs have
    gone unnoticed in popular open source projects for years. The app you download might not be
    built from exactly the code you can see, unless the project has reproducible builds that let
    people confirm it. With online services you also can't see what's running on their servers,
    which matters less if the app on your device encrypts everything before it leaves.

    When you're choosing, check which parts are actually open (the app, the server or both), what
    the licence is, and whether the project's still active. "Open source" in marketing sometimes
    means "some of it", so have a look at the code repository yourself.
  : |-
    Open source vuol dire che il codice è pubblicato con una licenza conforme alla [Open Source Definition](https://opensource.org/osd), quindi chiunque può leggerlo, usarlo, modificarlo e passarlo ad altri. Non deve per forza essere gratis. Per gli strumenti di privacy il vantaggio principale è che chi non lavora per l'azienda può controllare cosa fa davvero l'app con i tuoi dati, invece di fidarsi di quello che dice il marketing.

    Non è una garanzia, sia chiaro. Che il codice sia pubblico non vuol dire che qualcuno l'abbia controllato, e in progetti open source molto popolari dei bug gravi sono passati inosservati per anni. L'app che scarichi potrebbe non essere compilata esattamente a partire dal codice che vedi, a meno che il progetto non abbia build riproducibili che permettano di verificarlo. Con i servizi online, poi, non puoi vedere cosa gira sui loro server, ma questo conta meno se l'app sul tuo dispositivo cifra tutto prima di inviarlo.

    Quando scegli, controlla quali parti sono davvero aperte (l'app, il server o entrambi), qual è la licenza e se il progetto è ancora attivo. Nel marketing, «open source» a volte vuol dire «solo in parte», quindi dai tu stesso un'occhiata al repository del codice.
  open-source software: software open source
  OSS: OSS
  Passkeys: Passkey
  A login that uses a cryptographic key stored on your device or in your password manager instead of a password, and resists phishing.: Un accesso che usa, al posto della password, una chiave crittografica salvata sul tuo dispositivo o nel tuo password manager, e che resiste al phishing.
  ? |
    A passkey is a pair of keys made when you set one up for a site. The site keeps the public half,
    and the private half stays on your phone, computer, password manager or security key. To sign
    in, you confirm it's you with your fingerprint, face or PIN, and your device proves it has the
    private key without ever sending it. Your fingerprint never leaves your device either, and the
    whole thing runs on standards called FIDO2 and WebAuthn.

    The big win is phishing. A passkey is tied to the real website's address, so it just won't work
    on a lookalike site, however convincing it is. There's no password to reuse or to leak in a
    breach, because the site only stores the public key, which is no use to an attacker. Since you
    need both the device and your fingerprint or PIN, many sites also treat a passkey as two factors
    in one.

    Synced passkeys live in a password manager (including the one built into your phone) and get
    backed up with it, which is convenient but means trusting that provider. Device-bound ones stay
    on a single device or security key and can't be copied, so you'll want a backup way in. Before
    you go all in, check how your provider lets you move passkeys elsewhere.
  : |-
    Una passkey è una coppia di chiavi creata nel momento in cui ne configuri una per un sito. Il sito conserva la metà pubblica, mentre quella privata resta sul tuo telefono, sul computer, nel password manager o su una chiave di sicurezza. Per accedere confermi che sei tu con l'impronta digitale, il volto o il PIN, e il tuo dispositivo dimostra di avere la chiave privata senza mai inviarla. Neanche l'impronta esce mai dal dispositivo, e tutto il meccanismo si basa sugli standard FIDO2 e WebAuthn.

    Il grande vantaggio riguarda il phishing. Una passkey è legata all'indirizzo del sito vero, quindi su un sito che lo imita semplicemente non funziona, per quanto convincente sia. Non c'è nessuna password da riutilizzare o che possa trapelare in una violazione, perché il sito conserva solo la chiave pubblica, che a chi attacca non serve a niente. Dato che servono sia il dispositivo sia l'impronta o il PIN, molti siti considerano la passkey anche come due fattori in uno.

    Le passkey sincronizzate stanno in un password manager (compreso quello integrato nel telefono) e finiscono nei suoi backup, il che è comodo ma significa fidarsi di chi te lo fornisce. Quelle legate a un dispositivo restano su un solo dispositivo o su una chiave di sicurezza e non si possono copiare, quindi ti conviene avere un modo di riserva per entrare. Prima di passare del tutto alle passkey, controlla come il tuo fornitore ti permette di trasferirle altrove.
  Password manager: Password manager
  An app that creates, stores and fills in a different strong password for every account, all locked behind one master password.: Un'app che crea, conserva e compila una password forte e diversa per ogni account, tutte protette da un'unica password principale.
  ? |
    Reusing passwords is how one breach turns into ten. A password manager fixes that by making a
    long random password for every site and remembering them all, so you only need one strong master
    password (a long passphrase works well). Most also fill in logins for you, sync across your
    devices, and can store passkeys, 2FA codes and notes.

    There are two main types. Cloud-based ones sync your vault through the provider's servers, which
    is convenient, and the good ones encrypt everything on your device first so the provider can't
    read it. Offline ones, like those using the KeePass format, keep your vault in a file you sync
    or back up yourself - more control, more faff.

    Whichever you go for, look for zero-knowledge encryption, a published security audit, open
    source code and an easy way to export everything if you ever want to leave. Turn on 2FA for the
    account itself. And remember the vault is only as strong as your master password - if it's weak
    and the encrypted vault ever gets stolen, it can be cracked offline.
  : |-
    È riutilizzando le password che una sola violazione diventa dieci. Un password manager risolve il problema creando una password lunga e casuale per ogni sito e ricordandole tutte, così ti basta una sola password principale forte (una passphrase lunga va benissimo). La maggior parte compila anche i dati di accesso al posto tuo, si sincronizza tra i tuoi dispositivi e può conservare passkey, codici 2FA e note.

    Ce ne sono di due tipi principali. Quelli basati sul cloud sincronizzano la cassaforte attraverso i server del fornitore, il che è comodo, e quelli fatti bene la cifrano sul tuo dispositivo prima di caricarla, così il fornitore non può leggerla. Quelli offline, come i programmi che usano il formato KeePass, tengono la cassaforte in un file che sincronizzi o di cui fai il backup per conto tuo: più controllo, più fatica.

    Qualunque tipo tu scelga, cerca la crittografia a conoscenza zero, un audit di sicurezza pubblicato, il codice open source e un modo semplice per esportare tutto se un giorno vuoi andartene. Attiva l'autenticazione a due fattori sull'account del password manager. E ricorda che la cassaforte è solida solo quanto la tua password principale: se la password è debole e un giorno qualcuno ruba la cassaforte cifrata, può forzarla offline.
  password vault: cassaforte delle password
  Peer-to-peer: Peer-to-peer
  Devices connecting straight to each other to share data, rather than going through a company's central server.: Dispositivi che si collegano direttamente tra loro per scambiarsi dati, invece di passare dal server centrale di un'azienda.
  ? |
    In a peer-to-peer (P2P) network, devices talk to each other directly. There's no central server
    holding everyone's messages or files, so there's nothing for a company to scan, lose in a
    breach, hand over or shut down. BitTorrent is the famous example, and some messengers and file
    sync tools work the same way.

    The downside is that peers can usually see each other's IP addresses. With torrents the whole
    swarm can, which is how copyright firms find people. Some P2P messengers get round this by
    routing everything over Tor. Pure P2P can also mean both devices need to be online at once,
    which is why many apps also use servers for finding each other, notifications or relaying
    traffic when a direct connection fails.

    When an app says it's P2P, check what happens when a direct connection isn't possible, whether
    your IP address is shown to the people you talk to, and whether it's end-to-end encrypted.
  : |-
    In una rete peer-to-peer (P2P) i dispositivi comunicano direttamente tra loro. Non c'è un server centrale che conserva i messaggi o i file di tutti, quindi non c'è niente che un'azienda possa analizzare, perdere in una violazione, consegnare o chiudere. L'esempio più famoso è BitTorrent, e alcune app di messaggistica e di sincronizzazione dei file funzionano allo stesso modo.

    Lo svantaggio è che di solito ogni dispositivo può vedere l'indirizzo IP degli altri. Con i torrent lo vede l'intero sciame, ed è così che le società antipirateria rintracciano le persone. Alcune app di messaggistica P2P aggirano il problema facendo passare tutto attraverso Tor. Il P2P puro può anche richiedere che entrambi i dispositivi siano online nello stesso momento, motivo per cui molte app usano anche dei server per far trovare i dispositivi tra loro, per le notifiche o per inoltrare il traffico quando la connessione diretta non riesce.

    Quando un'app dice di essere P2P, controlla cosa succede quando una connessione diretta non è possibile, se il tuo indirizzo IP è visibile alle persone con cui parli e se usa la crittografia end-to-end.
  P2P: P2P
  PGP and OpenPGP: PGP e OpenPGP
  An encryption standard for email and files that uses a public key you share and a private key you keep, and can sign things too.: Uno standard di crittografia per email e file che usa una chiave pubblica da condividere e una chiave privata da tenere per te, e permette anche di firmare.
  ? |
    PGP (Pretty Good Privacy) dates back to 1991, and OpenPGP is the open standard that grew out of
    it. GnuPG, or GPG, is the most widely used free implementation, and lots of PGP tools are built
    on it. It works with a key pair: you share your public key so people can encrypt things to you,
    and keep your private key to decrypt them. You can also sign messages and files, which proves
    they came from you and haven't been changed.

    It's still used for encrypted email, and it's how many software projects sign their downloads so
    you can check you've got the real thing. But it has well-known gaps. With email, the sender,
    recipient and date stay visible, and depending on your app, so might the subject line. There's
    no forward secrecy, so if your private key is ever stolen, anyone holding copies of your old
    messages can read every one. And it's easy to get wrong - one unencrypted reply that quotes the
    whole thread gives the game away.

    Look for tools that make key management easy, keep your private key under your control (ideally
    on a hardware key for anything important), and help you check other people's key fingerprints.
    For chatting rather than email, a modern end-to-end encrypted messenger is usually a better fit.
  : |-
    PGP (Pretty Good Privacy) risale al 1991, e OpenPGP è lo standard aperto che ne è nato. GnuPG, o GPG, è l'implementazione libera più diffusa, e molti strumenti PGP si basano su di essa. Funziona con una coppia di chiavi: condividi la tua chiave pubblica così gli altri possono cifrare le cose che ti mandano, e tieni per te la chiave privata per decifrarle. Puoi anche firmare messaggi e file, il che dimostra che vengono da te e che nessuno li ha modificati.

    Si usa ancora per le email cifrate, ed è il modo in cui molti progetti software firmano i file da scaricare, così puoi verificare che siano autentici. Ma ha dei limiti ben noti. Nelle email restano visibili mittente, destinatario e data, e a seconda dell'app che usi anche l'oggetto. Non c'è forward secrecy, quindi se un giorno ti rubano la chiave privata, chiunque abbia delle copie dei tuoi vecchi messaggi può leggerli tutti. Ed è facile sbagliare: basta una sola risposta non cifrata che cita l'intera conversazione per svelare tutto.

    Cerca strumenti che rendano facile gestire le chiavi, che lascino la chiave privata sotto il tuo controllo (per tutto ciò che è importante, meglio su una chiave di sicurezza hardware) e che ti aiutino a verificare le impronte digitali delle chiavi altrui. Per chattare, invece che per le email, di solito è più adatta un'app di messaggistica moderna con crittografia end-to-end.
  Pretty Good Privacy: Pretty Good Privacy
  GPG: GPG
  GnuPG: GnuPG
  Phishing: Phishing
  Tricking you into handing over passwords, codes, money or personal details with a fake email, text, call or website.: Ingannarti con un'email, un SMS, una telefonata o un sito falsi per farti consegnare password, codici, soldi o dati personali.
  ? |
    Phishing is one of the commonest ways accounts get broken into. You get an email, text or call
    that looks like it's from your bank, a delivery firm or your boss, with a reason to act right
    now and a link to a page that looks like the real thing. Anything you type there goes straight
    to the attacker. Phishing by text is called smishing, by phone it's vishing, and attacks
    tailored to one person are spear phishing.

    Modern phishing kits can pass what you type to the real site as you go, so they can grab SMS and
    authenticator codes as well as your password. The logins that resist it are passkeys and
    hardware security keys, which check the site's real address and refuse to work on a fake one.

    A password manager helps too, as it only fills in your login on the site it was saved for - if
    it doesn't offer to fill, treat that as a warning. Beyond that, be suspicious of urgency, go to
    sites directly rather than through links in messages, and check where a link really goes before
    you click.
  : |-
    Il phishing è uno dei modi più comuni con cui vengono violati gli account. Ricevi un'email, un SMS o una telefonata che sembra arrivare dalla tua banca, da un corriere o dal tuo capo, con un motivo per agire subito e un link a una pagina che sembra quella vera. Tutto quello che scrivi lì finisce dritto nelle mani di chi attacca. Il phishing via SMS si chiama smishing, quello per telefono vishing, e gli attacchi su misura per una singola persona si chiamano spear phishing.

    I kit di phishing moderni possono girare al sito vero quello che scrivi, in tempo reale, quindi riescono a prendere non solo la password ma anche i codici via SMS e quelli delle app di autenticazione. I metodi di accesso che resistono a questi kit sono le passkey e le chiavi di sicurezza hardware, che controllano l'indirizzo reale del sito e si rifiutano di funzionare su uno falso.

    Aiuta anche un password manager, perché compila i tuoi dati di accesso solo sul sito per cui li hai salvati: se non ti propone di compilarli, prendilo come un campanello d'allarme. Per il resto, diffida di chi ti mette fretta, vai direttamente sui siti invece di passare dai link nei messaggi e, prima di cliccare, controlla dove porta davvero un link.
  Proxy: Proxy
  A server that passes your requests on to the internet for you, so the sites you visit see the proxy's address instead of yours.: Un server che inoltra le tue richieste su internet al posto tuo, così i siti che visiti vedono l'indirizzo del proxy invece del tuo.
  ? |
    A proxy sits between you and the sites you visit and fetches things on your behalf. Unlike a
    VPN, it usually only covers the apps you point at it, like your browser, and many don't add any
    encryption of their own. That makes proxies handy for specific jobs, like getting round a block,
    and a poor choice for hiding everything you do.

    The proxy operator can see where you're going and, for anything not on HTTPS, what you're doing,
    and can tamper with it. That's why free public proxies are such a bad idea: you've no idea who
    runs them, and some exist to collect data or inject ads and malware.

    Privacy front-ends work in a similar way. They're sites that load content from big platforms
    like YouTube or Reddit for you, so the platform sees the front-end's server rather than you.
    They cut out a lot of tracking, but whoever runs the instance can see what you look at, and they
    tend to break when the platform changes things.
  : |-
    Un proxy si mette tra te e i siti che visiti e recupera i contenuti per conto tuo. A differenza di una VPN, di solito copre solo le app che configuri per usarlo, come il browser, e molti non aggiungono nessuna crittografia propria. Per questo i proxy sono comodi per compiti specifici, come aggirare un blocco, ma sono una cattiva scelta per nascondere tutto quello che fai.

    Chi gestisce il proxy può vedere dove vai e, per tutto ciò che non passa da HTTPS, cosa fai, e può anche manometterlo. Ecco perché i proxy pubblici gratuiti sono una pessima idea: non hai idea di chi li gestisca, e alcuni esistono apposta per raccogliere dati o inserire pubblicità e malware.

    I front-end per la privacy funzionano in modo simile. Sono siti che caricano per te i contenuti di grandi piattaforme come YouTube o Reddit, così la piattaforma vede il server del front-end anziché te. Eliminano buona parte del tracciamento, ma chi gestisce l'istanza può vedere cosa guardi, e tendono a smettere di funzionare quando la piattaforma cambia qualcosa.
  proxy server: server proxy
  web proxy: proxy web
  Sandboxing: Sandboxing
  Running an app in a walled-off space with limited access to the rest of your system, so a bad or hacked app can only do so much damage.: Far girare un'app in uno spazio isolato, con accesso limitato al resto del sistema, così un'app malevola o compromessa non può fare troppi danni.
  ? |
    A sandbox limits what an app can touch, like your files, other apps, your camera or the network.
    If something inside it is malicious or gets hacked, the damage should stay inside the box. You
    use sandboxes all the time without noticing: phone apps each run in one, and browsers sandbox
    the code that runs web pages so a malicious site can't read your files.

    On a desktop you can go further. Linux has tools that sandbox individual programs, and app
    formats like Flatpak come with a permission system, though plenty of apps ask for far more
    access than they need. Virtual machines go further still by running a whole separate operating
    system, which is why they're popular for opening suspicious files or keeping different parts of
    your life in separate compartments.

    A sandbox is only as good as its rules. Broad permissions make it close to pointless, and bugs
    that let code escape do turn up, so keep things updated. It also can't protect anything you hand
    to the app inside it.
  : |-
    Una sandbox limita quello a cui un'app può accedere, come i tuoi file, le altre app, la fotocamera o la rete. Se qualcosa al suo interno è malevolo o viene violato, i danni dovrebbero restare confinati lì dentro. Usi le sandbox di continuo senza accorgertene: sul telefono ogni app gira nella sua, e i browser chiudono in una sandbox il codice che fa funzionare le pagine web, così un sito malevolo non può leggere i tuoi file.

    Sul computer puoi spingerti oltre. Linux ha strumenti che isolano i singoli programmi in una sandbox, e formati di app come Flatpak hanno un sistema di permessi, anche se parecchie app chiedono molti più accessi del necessario. Le macchine virtuali vanno ancora più in là, perché fanno girare un intero sistema operativo separato, e infatti si usano spesso per aprire file sospetti o per tenere le varie parti della tua vita in compartimenti stagni.

    Una sandbox vale solo quanto le sue regole. Permessi molto ampi la rendono quasi inutile, e capita davvero che saltino fuori bug che permettono al codice di evadere, quindi tieni tutto aggiornato. E non può proteggere niente di quello che sei tu a dare all'app che ci gira dentro.
  sandbox: sandbox
  app sandbox: sandbox delle app
  Security audit: Audit di sicurezza
  An outside firm checking an app's code, systems or policies for security holes and false claims, ideally with a public report.: Una società esterna che controlla il codice, i sistemi o le policy di un'app alla ricerca di falle di sicurezza e affermazioni false, idealmente con un rapporto pubblico.
  ? |
    In a security audit, a company pays an independent firm to go through its code or systems
    looking for weaknesses, then (ideally) publishes the report. There are a few kinds: code
    reviews, penetration tests where the auditors actively try to break in, reviews of the
    cryptography, and policy audits like the no-logs audits VPN providers use to back up their
    claims.

    An audit is a snapshot. It only covers what was in scope at the time, and the app may have
    changed a lot since. It's also paid for by the company being audited, which doesn't make it
    worthless, but it's a good reason to read the details rather than trust a badge on the homepage.

    Good signs are a full public report rather than a summary, a well-known auditing firm, a recent
    date, a clear scope and a note of which issues got fixed. Regular audits over several years
    count for more than a single one from 2019. No audit doesn't mean unsafe - plenty of small open
    source projects can't afford one - but it does mean you're relying on whoever's read the code.
  : |-
    In un audit di sicurezza un'azienda paga una società indipendente perché esamini il suo codice o i suoi sistemi alla ricerca di punti deboli, e poi (idealmente) pubblica il rapporto. Ne esistono di diversi tipi: revisioni del codice, penetration test in cui i revisori cercano attivamente di entrare, analisi della crittografia e audit delle policy, come gli audit no-log che i fornitori di VPN usano a sostegno di quello che dichiarano.

    Un audit è un'istantanea. Copre solo quello che rientrava nel suo ambito in quel momento, e da allora l'app potrebbe essere cambiata parecchio. Inoltre lo paga l'azienda che viene controllata: questo non lo rende inutile, ma è un buon motivo per leggere i dettagli invece di fidarti di un bollino sulla homepage.

    I buoni segnali sono un rapporto completo e pubblico anziché un riassunto, una società di audit conosciuta, una data recente, un ambito chiaro e l'indicazione di quali problemi sono stati risolti. Audit regolari nell'arco di diversi anni valgono più di uno solo del 2019. La mancanza di un audit non vuol dire che l'app non sia sicura (molti piccoli progetti open source non possono permetterselo), ma vuol dire che ti stai affidando a chiunque abbia letto il codice.
  independent audit: audit indipendente
  third-party audit: audit di terze parti
  Self-hosting: Self-hosting
  Running an app or service on hardware you control, at home or on a rented server, instead of relying on someone else's.: Far girare un'app o un servizio su hardware che controlli tu, a casa o su un server in affitto, invece di dipendere da quello di qualcun altro.
  ? |
    Self-hosting means running the server side of something yourself, like your own cloud storage,
    password manager server, chat server or media library. It might live on an old laptop, a
    Raspberry Pi or a rented server. Your data stays somewhere you control, and no company can scan
    it, sell it, change the terms or shut the service down on you.

    The trade-off is that you're now the IT department. Updates, backups, security and fixing it at
    2am are all on you, and a neglected server is easy pickings. On a rented server the hosting
    company can get at your disk in principle, so encryption still matters. Email is notoriously
    hard to self-host well, since the big providers are quick to treat mail from small servers as
    spam.

    Stick to open source apps with clear docs, an active project and an easy way to update. If you'd
    rather not run it all yourself, plenty of privacy-focused services offer both - a hosted
    version, and the code to run your own.
  : |-
    Fare self-hosting vuol dire gestire in prima persona la parte server di qualcosa, come il tuo cloud personale, il server del password manager, un server di chat o una libreria multimediale. Può stare su un vecchio portatile, su un Raspberry Pi o su un server in affitto. I tuoi dati restano in un posto che controlli tu, e nessuna azienda può analizzarli, venderli, cambiare le condizioni o chiuderti il servizio da un giorno all'altro.

    Il prezzo da pagare è che adesso il reparto IT sei tu. Aggiornamenti, backup, sicurezza e riparazioni alle 2 di notte toccano tutti a te, e un server trascurato è una preda facile. Su un server in affitto, in teoria, la società di hosting può accedere al tuo disco, quindi la crittografia conta comunque. Ospitare bene la propria email è notoriamente difficile, perché i grandi servizi di posta fanno presto a trattare come spam i messaggi che arrivano dai server piccoli.

    Limitati ad app open source con una documentazione chiara, un progetto attivo e un modo semplice per aggiornarle. Se preferisci non gestire tutto per conto tuo, molti servizi attenti alla privacy offrono entrambe le cose: una versione ospitata da loro e il codice per farne girare una tua.
  self-hosted: self-hosted
  Source-available software: Software source-available
  Software whose code you can read, but under a licence that limits what you can do with it, so it doesn't count as open source.: Software di cui puoi leggere il codice, ma con una licenza che limita quello che puoi farci, quindi non conta come open source.
  ? |
    Source-available code is public, but the licence holds back some of the freedoms open source
    gives you. It might ban commercial use, stop you running it as a competing service, or forbid
    sharing changed versions. The Business Source License and the Server Side Public License are
    well-known examples, and neither is approved by the Open Source Initiative.

    For privacy, it gets you most of the way. You (or anyone) can still read the code and check what
    it does with your data, which is the main reason to care. What you lose is the safety net: if
    the company goes bust or goes bad, usually nobody else is allowed to pick up the code and carry
    on.

    Watch the wording. Some projects call themselves open source when the licence says otherwise,
    and code published with no licence at all is technically all rights reserved, even on GitHub. A
    few source-available licences turn into proper open source ones after a set number of years.
  : |-
    Il codice source-available è pubblico, ma la licenza ti nega alcune delle libertà che dà l'open source. Può vietare l'uso commerciale, impedirti di farlo girare come servizio concorrente o proibire la condivisione di versioni modificate. La Business Source License e la Server Side Public License sono esempi noti, e nessuna delle due è approvata dalla Open Source Initiative.

    Per la privacy, ti dà quasi tutto quello che serve. Tu (o chiunque altro) puoi comunque leggere il codice e controllare cosa fa con i tuoi dati, che è il motivo principale per interessartene. Quello che perdi è la rete di sicurezza: se l'azienda fallisce o cambia in peggio, di solito nessun altro ha il permesso di riprendere il codice e portarlo avanti.

    Fai attenzione alle parole. Alcuni progetti si definiscono open source anche quando la licenza dice il contrario, e il codice pubblicato senza alcuna licenza è tecnicamente coperto da «tutti i diritti riservati», anche su GitHub. Qualche licenza source-available diventa una vera licenza open source dopo un certo numero di anni.
  Telemetry: Telemetria
  Data an app or operating system sends back to its maker about how you use it, what device you're on and what went wrong.: I dati che un'app o un sistema operativo invia a chi l'ha sviluppato su come lo usi, su che dispositivo hai e su cosa è andato storto.
  ? |
    Telemetry ranges from harmless to nosy. A crash report that helps someone fix a bug is one
    thing. A steady stream of which buttons you click and what hardware you're on, tied to an ID
    that follows you around, is another. Most of it's on by default and buried a few menus deep, if
    it can be turned off at all.

    Even "anonymous" telemetry has to be sent from somewhere, so the server receiving it sees your
    IP address unless it goes through a proxy first. Windows, for one, lets you turn diagnostic data
    down but not off unless you're on an Enterprise or Education edition, which is why so many tools
    exist to block it.

    The better apps make telemetry opt-in, list exactly what gets sent, and publish code you (or
    someone else) can check. Open source apps can collect telemetry too, it's just harder to hide.
    Blocking it with a firewall or a DNS blocklist works for plenty of apps, though some break or
    nag you when they can't phone home.
  : |-
    Si va dalla telemetria innocua a quella impicciona. Una segnalazione di crash che aiuta qualcuno a correggere un bug è una cosa. Un flusso continuo di dati su quali pulsanti premi e che hardware usi, legato a un identificativo che ti segue ovunque, è tutt'altro. Di solito è attiva di default e nascosta in fondo a qualche menu, sempre che si possa disattivare.

    Anche la telemetria «anonima» deve partire da qualche parte, quindi il server che la riceve vede il tuo indirizzo IP, a meno che prima non passi da un proxy. Windows, tanto per dirne uno, ti permette di ridurre i dati di diagnostica ma non di disattivarli, se non hai un'edizione Enterprise o Education, ed è per questo che esistono così tanti strumenti per bloccarli.

    Le app migliori tengono la telemetria disattivata finché non scegli di attivarla, elencano con precisione cosa viene inviato e pubblicano codice che tu (o qualcun altro) puoi controllare. Anche le app open source possono raccogliere telemetria, solo che per loro è più difficile nasconderla. Con molte app basta bloccarla con un firewall o una blocklist DNS, anche se alcune smettono di funzionare o ti assillano quando non riescono a contattare la casa madre.
  diagnostic data: dati di diagnostica
  usage data: dati di utilizzo
  Third-party cookies: Cookie di terze parti
  Cookies set by a company other than the site you're on, usually an ad network, so it can recognise you on every site it's embedded in.: Cookie impostati da un'azienda diversa dal sito su cui ti trovi, di solito una rete pubblicitaria, che così può riconoscerti su tutti i siti in cui è integrata.
  ? |
    A cookie is a small bit of data a website stores in your browser. First-party cookies come from
    the site you're actually on and do useful things like keep you logged in. Third-party cookies
    come from something embedded in the page, like an ad, a share button or an analytics script, and
    because the same company is embedded on thousands of sites, it can follow you from one to the
    next.

    Browsers have been clamping down on them. Safari blocks them by default, and Firefox gives every
    site its own separate cookie jar so they can't follow you around. Chrome still allows them
    unless you change the setting, after Google dropped its plan to phase them out.

    Blocking them doesn't stop tracking on its own, since fingerprinting, tracking from a site's own
    domain and being logged in to accounts all still work. In the UK and EU, sites need your consent
    for non-essential cookies, which is what those banners are for. "Reject all" turns most of them
    off, at least on sites that respect your choice.
  : |-
    Un cookie è un piccolo frammento di dati che un sito salva nel tuo browser. I cookie di prima parte vengono dal sito su cui ti trovi davvero e fanno cose utili, come mantenere attivo l'accesso al tuo account. Quelli di terze parti vengono da qualcosa di incorporato nella pagina, come una pubblicità, un pulsante di condivisione o uno script di analisi, e dato che la stessa azienda è presente su migliaia di siti, può seguirti dall'uno all'altro.

    Da qualche tempo i browser stanno dando un giro di vite. Safari li blocca di default, e Firefox dà a ogni sito il suo contenitore di cookie separato, così non possono seguirti ovunque. Chrome invece li permette ancora, a meno che tu non cambi l'impostazione, da quando Google ha rinunciato al piano di eliminarli gradualmente.

    Bloccarli, da solo, non basta a fermare il tracciamento, perché restano l'impronta digitale del browser, il tracciamento dal dominio del sito stesso e gli account a cui hai fatto l'accesso. Nel Regno Unito e nell'UE i siti hanno bisogno del tuo consenso per i cookie non essenziali, ed è a questo che servono quei banner. «Rifiuta tutti» ne disattiva la maggior parte, almeno sui siti che rispettano la tua scelta.
  tracking cookies: cookie di tracciamento
  cross-site cookies: cookie cross-site
  Threat model: Modello delle minacce
  Working out what you're protecting, who from and how much hassle it's worth, so you pick tools that fit your real risks.: Capire cosa vuoi proteggere, da chi e quanto impegno vale la pena metterci, così scegli gli strumenti adatti ai rischi che corri davvero.
  ? |
    A threat model is just a plan. You work out what you want to protect (your messages, your
    location, your identity), who you're protecting it from (advertisers, a nosy ex, scammers, a
    government), how likely that is, how bad it'd be if it went wrong, and how much effort you're
    prepared to put in. The EFF's Surveillance Self-Defense guide has a
    [good walk-through](https://ssd.eff.org/module/your-security-plan).

    Your answers decide what you need. Someone avoiding ad tracking needs a decent browser and an ad
    blocker. A journalist protecting sources needs a lot more, and shouldn't rely on any one tool.
    Most people are somewhere in between.

    It also stops you overdoing it. Every extra tool is something else to maintain and something
    else to break, and a setup that's a pain to live with tends to get abandoned. Pick protections
    that match the threats you actually face, and look at them again when your situation changes.
  : |-
    Un modello delle minacce non è altro che un piano. Si tratta di capire cosa vuoi proteggere (i tuoi messaggi, la tua posizione, la tua identità), da chi lo stai proteggendo (inserzionisti, un ex impiccione, truffatori, un governo), quanto è probabile, quanto sarebbe grave se andasse male e quanto impegno sei disposto a metterci. La guida Surveillance Self-Defense dell'EFF ha una [buona spiegazione passo passo](https://ssd.eff.org/module/your-security-plan).

    Sono le tue risposte a decidere cosa ti serve. A chi vuole evitare il tracciamento pubblicitario servono un browser decente e un ad blocker. A un giornalista che protegge le sue fonti serve molto di più, e non dovrebbe affidarsi a un solo strumento. La maggior parte delle persone sta da qualche parte nel mezzo.

    Ti evita anche di esagerare. Ogni strumento in più è un'altra cosa da mantenere e un'altra cosa che può rompersi, e una configurazione che ti complica la vita di solito finisce abbandonata. Scegli protezioni adatte alle minacce a cui sei davvero esposto, e rivedile quando la tua situazione cambia.
  threat modelling: modellazione delle minacce
  Tor and onion routing: Tor e onion routing
  A free network that bounces your traffic through three volunteer-run relays, so no single one knows both who you are and where you're going.: Una rete gratuita che fa rimbalzare il tuo traffico tra tre nodi gestiti da volontari, così nessuno di loro sa sia chi sei sia dove stai andando.
  ? |
    Tor wraps your traffic in three layers of encryption and sends it through three relays run by
    volunteers. Each relay peels off one layer (hence "onion"), so the first knows your IP address
    but not where you're going, and the last knows where you're going but not who you are.
    [Tor Browser](https://www.torproject.org/) is the easiest way in, and it also makes its users
    look as alike as possible, so you're harder to fingerprint.

    Onion services (the .onion addresses) never leave the Tor network, so both sides stay hidden.
    For ordinary sites, the last relay can see your traffic if the site doesn't use HTTPS. Tor is
    also slower than a normal connection, and some sites block it or pile on the CAPTCHAs.

    Your ISP can see that you're using Tor, though not what for, unless you connect through a bridge
    that disguises it. Tor can't protect you from yourself either - logging into your usual
    accounts, or opening a downloaded file outside Tor Browser, can give you away. Someone who can
    watch both ends of your connection at once may also be able to match up the traffic.
  : |-
    Tor avvolge il tuo traffico in tre strati di crittografia e lo fa passare per tre nodi gestiti da volontari. Ogni nodo toglie uno strato (da qui il nome «onion», cipolla in inglese), quindi il primo conosce il tuo indirizzo IP ma non dove stai andando, e l'ultimo sa dove stai andando ma non chi sei. [Tor Browser](https://www.torproject.org/) è il modo più semplice per usarlo, e rende anche i suoi utenti il più possibile simili tra loro, così è più difficile riconoscerti dall'impronta digitale del browser.

    I servizi onion (gli indirizzi .onion) non escono mai dalla rete Tor, quindi entrambe le parti restano nascoste. Con i siti normali, l'ultimo nodo può vedere il tuo traffico se il sito non usa HTTPS. Tor è anche più lento di una connessione normale, e alcuni siti lo bloccano o ti sommergono di CAPTCHA.

    Il tuo provider internet può vedere che usi Tor, anche se non per cosa, a meno che tu non ti colleghi tramite un bridge che lo camuffa. E Tor non può proteggerti da te stesso: accedere ai tuoi soliti account, o aprire fuori da Tor Browser un file che hai scaricato, può tradirti. Chi può osservare contemporaneamente entrambi i capi della tua connessione potrebbe anche riuscire a mettere in relazione il traffico.
  The Onion Router: The Onion Router
  Terms of Service; Didn't Read: Terms of Service; Didn't Read
  A community project that reads the terms and privacy policies of websites and apps, and grades them from A (very good) to E (very bad).: Un progetto collaborativo che legge i termini di servizio e le informative sulla privacy di siti e app, e dà loro un voto da A (ottimo) a E (pessimo).
  ? |
    Hardly anyone reads the terms they agree to, so [ToS;DR](https://tosdr.org/) reads them for you.
    Since 2012 its contributors have been going through the terms of service and privacy policies of
    sites and apps, picking out the parts that matter, like whether you can delete your account or
    whether your data gets shared with advertisers. Each point is labelled good, neutral, bad or,
    for the worst ones, a blocker.

    Those points add up to a grade from A, for very good, down to E, for very bad. Services with no
    reviewed points don't get one. It's a quick way to spot terms that let a company do things you'd
    object to.

    Treat it as a starting point. Reviews come from a community of contributors, so smaller services
    are often missing, and a company can change its terms after they've been reviewed. A grade is
    also about what the terms say, not how secure the service is or whether the company sticks to
    its word.
  : |-
    Quasi nessuno legge i termini che accetta, quindi [ToS;DR](https://tosdr.org/) li legge al posto tuo. Dal 2012 i suoi collaboratori passano al setaccio i termini di servizio e le informative sulla privacy di siti e app, individuando le parti che contano, per esempio se puoi eliminare il tuo account o se i tuoi dati vengono condivisi con gli inserzionisti. Ogni punto viene etichettato come positivo, neutro, negativo o, per i peggiori, bloccante.

    Da questi punti nasce un voto che va da A, ottimo, fino a E, pessimo. I servizi senza punti esaminati non ricevono nessun voto. È un modo rapido per individuare i termini che permettono a un'azienda di fare cose che non ti andrebbero bene.

    Prendilo come un punto di partenza. Le analisi le fa una comunità di collaboratori, quindi spesso i servizi più piccoli mancano, e un'azienda può cambiare i propri termini dopo che sono stati esaminati. Il voto riguarda poi quello che dicono i termini, non quanto è sicuro il servizio o se l'azienda mantiene la parola data.
  ToS;DR: ToS;DR
  TOSDR: TOSDR
  Time-based one-time password: Password monouso basata sul tempo
  The short-lived codes from an authenticator app, worked out from a secret shared with the site and the current time.: I codici temporanei di un'app di autenticazione, calcolati a partire da un segreto condiviso con il sito e dall'ora corrente.
  ? |
    When you turn on app-based 2FA, the site shows you a QR code containing a secret key, which your
    authenticator app saves. From then on, the app and the site both combine that secret with the
    current time to work out the same short code, which usually changes every 30 seconds. It's all
    done offline, so your phone doesn't need signal and the app doesn't need an account.

    It's a big step up from SMS codes, since there's nothing for a SIM swap to intercept. It's not
    phishing-proof, though. If you type a code into a convincing fake login page, the attacker can
    pass it straight on to the real site while it's still valid. Anyone who gets hold of the secret
    (from a backup, say, or a screenshot of the QR code) can also make your codes until you reset
    2FA.

    Pick an authenticator app that lets you back up or export your accounts, ideally encrypted, so a
    lost or broken phone isn't a disaster. Some apps make it hard to get your secrets out, which
    feels secure right up until you change phones.
  : |-
    Quando attivi l'autenticazione a due fattori tramite app, il sito ti mostra un codice QR che contiene una chiave segreta, e la tua app di autenticazione la salva. Da quel momento sia l'app sia il sito combinano quel segreto con l'ora corrente per calcolare lo stesso codice breve, che di solito cambia ogni 30 secondi. Avviene tutto offline, quindi al telefono non serve campo e all'app non serve un account.

    È un bel passo avanti rispetto ai codici via SMS, perché non c'è niente che un SIM swap possa intercettare. Però non è a prova di phishing. Se scrivi un codice in una pagina di accesso falsa ma convincente, chi attacca può girarlo subito al sito vero mentre è ancora valido. E chi mette le mani sul segreto (da un backup, per esempio, o da uno screenshot del codice QR) può generare i tuoi codici finché non reimposti la 2FA.

    Scegli un'app di autenticazione che ti permetta di fare il backup degli account o di esportarli, meglio se in forma cifrata, così perdere o rompere il telefono non diventa un disastro. Alcune app rendono difficile tirare fuori i segreti, il che sembra una cosa sicura fino al giorno in cui cambi telefono.
  TOTP: TOTP
  authenticator codes: codici dell'app di autenticazione
  Tracker: Tracker
  Code in a website, app or email that records what you do and reports it to another company, usually for advertising.: Codice inserito in un sito, in un'app o in un'email che registra quello che fai e lo comunica a un'altra azienda, di solito a scopo pubblicitario.
  ? |
    Trackers come in a few shapes. On websites, they're scripts and invisible images from ad
    networks and analytics firms, sometimes dozens on a single page. In apps, they're bits of code
    from those same companies that the developer has bundled in, and they get whatever access the
    app has. In emails, a tiny invisible image (a tracking pixel) tells the sender when you opened
    it, roughly where you were and what device you used.

    Because the same few companies are on so many sites and apps, they can follow you between them
    and build up a profile of your interests, habits and whereabouts. That profile is used for
    targeted ads, and some of it gets sold on to data brokers.

    Blocking them is one of the easier wins. Content blockers in your browser use filter lists of
    known trackers, DNS-level blockers do the same for every device on your network, and most email
    apps can stop remote images loading. Blockers only catch trackers they know about, and some
    sites now serve tracking from their own domain to get round them.
  : |-
    I tracker si presentano in varie forme. Sui siti sono script e immagini invisibili di reti pubblicitarie e società di analisi, a volte decine in una sola pagina. Nelle app sono pezzi di codice delle stesse aziende che lo sviluppatore ha integrato, e hanno gli stessi accessi dell'app. Nelle email, un'immagine minuscola e invisibile (un pixel di tracciamento) dice al mittente quando hai aperto l'email, più o meno dove ti trovavi e che dispositivo hai usato.

    Visto che le stesse poche aziende sono presenti su così tanti siti e app, possono seguirti dall'uno all'altro e costruire un profilo dei tuoi interessi, delle tue abitudini e dei posti che frequenti. Quel profilo serve per la pubblicità mirata, e in parte viene rivenduto ai data broker.

    Bloccarli è uno dei miglioramenti più facili. Gli strumenti di blocco nel browser usano liste di filtri con i tracker noti, quelli a livello DNS fanno lo stesso per tutti i dispositivi della tua rete, e la maggior parte delle app di posta può impedire il caricamento delle immagini remote. Questi strumenti fermano solo i tracker che conoscono, e alcuni siti ora fanno partire il tracciamento dal proprio dominio per aggirarli.
  web tracker: tracker web
  ad tracker: tracker pubblicitario
  Virtual private network: Rete privata virtuale
  An encrypted tunnel from your device to a VPN provider's server, which hides your traffic from your network and your IP address from sites.: Un tunnel cifrato dal tuo dispositivo al server di un fornitore di VPN, che nasconde il tuo traffico alla rete a cui sei connesso e il tuo indirizzo IP ai siti.
  ? |
    A VPN sends all your traffic through an encrypted tunnel to a server run by the VPN provider,
    and from there out to the internet. Your ISP, or the Wi-Fi network you're on, can see that
    you're using a VPN but not which sites you visit. The sites see the VPN server's IP address
    instead of yours.

    It doesn't make you anonymous. It moves your trust from your ISP to the VPN provider, who can
    now see everything your ISP used to. It won't stop cookies, browser fingerprinting or a site
    recognising you the moment you log in. It's good for hiding your IP address, using dodgy public
    Wi-Fi, getting round blocks and geo-restrictions, and keeping your browsing away from your ISP,
    and not much else.

    The provider matters more than the tech. Look for an audited no-logs policy, open source apps, a
    kill switch and leak protection, and a way to pay that doesn't tie the account to your name if
    that matters to you. Be wary of free VPNs, which have to pay for their servers somehow, often
    with your data.
  : |-
    Una VPN fa passare tutto il tuo traffico in un tunnel cifrato fino a un server gestito dal fornitore della VPN, e da lì verso internet. Il tuo provider internet, o la rete Wi-Fi a cui sei connesso, può vedere che usi una VPN ma non quali siti visiti. I siti vedono l'indirizzo IP del server VPN invece del tuo.

    Non garantisce l'anonimato. Sposta la tua fiducia dal tuo provider internet al fornitore della VPN, che adesso può vedere tutto quello che prima vedeva il provider. Non ferma i cookie, l'impronta digitale del browser né un sito che ti riconosce appena fai l'accesso. È utile per nascondere il tuo indirizzo IP, usare reti Wi-Fi pubbliche poco raccomandabili, aggirare blocchi e restrizioni geografiche e tenere la tua navigazione lontana dal tuo provider internet, e per poco altro.

    Conta più il fornitore che la tecnologia. Cerca una politica no-log verificata da un audit, app open source, un kill switch e una protezione dai leak, e un modo di pagare che non leghi l'account al tuo nome, se per te è importante. Diffida delle VPN gratuite, che in qualche modo devono pur pagare i server, spesso con i tuoi dati.
  VPN: VPN
  Warrant canary: Warrant canary
  A regularly updated statement that a company hasn't received a secret government order, which it stops updating if it ever does.: Una dichiarazione aggiornata regolarmente in cui un'azienda afferma di non aver ricevuto ordini segreti dal governo, e che smette di aggiornare se un giorno ne riceve uno.
  ? |
    Some government orders, like US National Security Letters, come with a gag order that stops the
    company telling anyone. A warrant canary is the workaround, named after the canaries miners used
    to take underground. The company regularly publishes a statement saying it hasn't received any
    such order, and if the statement disappears or stops being updated on schedule, you're meant to
    assume it has.

    It relies on the idea that a government can stop you saying something, but can't force you to
    keep saying something false. That's never really been tested in court, and some lawyers think
    pulling a canary could land a company in just as much trouble as speaking out.

    So treat a canary as a hint. Check that it's updated on a regular schedule and signed (often
    with PGP) so you know it's genuine. A lapsed canary can also just mean someone forgot to update
    it, so look for an explanation before you panic.
  : |-
    Alcuni ordini del governo, come le National Security Letter statunitensi, arrivano con un vincolo di segretezza che impedisce all'azienda di parlarne con chiunque. Il warrant canary è il modo per aggirarlo, e prende il nome dai canarini («canary» in inglese) che i minatori si portavano sottoterra. L'azienda pubblica regolarmente una dichiarazione in cui afferma di non aver ricevuto ordini di quel tipo, e se la dichiarazione sparisce o smette di essere aggiornata nei tempi previsti, devi dedurne che invece ne ha ricevuto uno.

    Si basa sull'idea che un governo possa impedirti di dire qualcosa, ma non costringerti a continuare a dire una cosa falsa. Quest'idea non è mai stata davvero messa alla prova in tribunale, e alcuni avvocati pensano che ritirare un canary possa mettere un'azienda nei guai quanto parlare apertamente.

    Considera quindi un canary come un indizio. Controlla che venga aggiornato a scadenze regolari e che sia firmato (spesso con PGP), così sai che è autentico. Un canary scaduto può anche voler dire semplicemente che qualcuno si è dimenticato di aggiornarlo, quindi cerca una spiegazione prima di andare nel panico.
  WebRTC leak: WebRTC leak
  When a website uses your browser's built-in calling tech to find your real IP address, even though you're on a VPN or proxy.: Quando un sito sfrutta la tecnologia per le chiamate integrata nel browser per scoprire il tuo vero indirizzo IP, anche se stai usando una VPN o un proxy.
  ? |
    WebRTC is the browser tech behind video calls and other live connections that work without a
    plugin. To connect people directly, it has to work out their IP addresses, and any website can
    ask it to do that with a few lines of code. A WebRTC leak is when that reveals an address you
    were hoping to hide.

    It mostly bites with browser proxy extensions and VPN setups that don't send everything through
    the tunnel, since WebRTC can go around them and expose your real public IP. A VPN app that
    routes all your traffic usually isn't affected. Most major browsers now hide your local network
    address from it by default, too.

    To check, visit a WebRTC leak test page while you're connected. If it shows your real IP, you
    can turn WebRTC off in some browsers (which breaks video calls in the browser), limit it with an
    extension, or fix the VPN so it covers everything.
  : |-
    WebRTC è la tecnologia del browser alla base delle videochiamate e delle altre connessioni in tempo reale che funzionano senza plugin. Per collegare le persone direttamente deve scoprire i loro indirizzi IP, e qualsiasi sito può chiederle di farlo con poche righe di codice. Si parla di WebRTC leak quando in questo modo viene fuori un indirizzo che speravi di tenere nascosto.

    Il problema si presenta soprattutto con le estensioni proxy per il browser e con le configurazioni VPN che non fanno passare tutto dal tunnel, perché WebRTC può aggirarle ed esporre il tuo vero IP pubblico. Un'app VPN che instrada tutto il traffico di solito non ne risente. E ormai la maggior parte dei browser più diffusi nasconde di default a WebRTC il tuo indirizzo di rete locale.

    Per controllare, apri una pagina di test per i WebRTC leak mentre sei connesso. Se mostra il tuo vero IP, in alcuni browser puoi disattivare WebRTC (ma così non funzionano più le videochiamate nel browser), limitarlo con un'estensione oppure sistemare la VPN in modo che copra tutto.
  WebRTC IP leak: WebRTC IP leak
  Zero-knowledge encryption: Crittografia a conoscenza zero
  Encryption done on your device before anything's uploaded, so the provider can store and sync your data but has no way to read it.: Crittografia fatta sul tuo dispositivo prima di caricare qualsiasi cosa, così il fornitore può conservare e sincronizzare i tuoi dati ma non ha modo di leggerli.
  ? |
    Zero-knowledge is mostly a marketing term, but a useful one. Your files, notes or passwords are
    encrypted on your device with a key that comes from your password (or a key only you hold), and
    only the encrypted version is ever sent to the provider. They can store and sync it, but they
    can't read it, and neither can anyone who breaches them.

    Check what's actually covered, as your email address, file sizes, timestamps and sometimes file
    names can still be readable. Forget your password and there's usually no way to get your data
    back - that's the point, but it catches people out. And if you use the web app, the provider
    sends you fresh code every time you load it, so a provider that went bad (or was forced to)
    could serve a version that grabs your password. Desktop and mobile apps make that harder to pull
    off.

    You'll also see "zero-access encryption", which some providers use for data that arrives
    readable (an ordinary incoming email, say) and is encrypted with your key as soon as it lands.
    Don't confuse any of it with zero-knowledge proofs, the maths behind some privacy coins - same
    name, different idea.
  : |-
    «A conoscenza zero» (in inglese zero-knowledge) è più che altro un'espressione di marketing, ma utile. I tuoi file, le tue note o le tue password vengono cifrati sul tuo dispositivo con una chiave ricavata dalla tua password (o con una chiave che hai solo tu), e al fornitore arriva sempre e solo la versione cifrata. Può conservarla e sincronizzarla, ma non leggerla, e non può farlo nemmeno chi riesce a violarne i sistemi.

    Controlla cosa è coperto davvero, perché il tuo indirizzo email, le dimensioni dei file, date e orari e a volte i nomi dei file possono restare leggibili. Se dimentichi la password, di solito non c'è modo di recuperare i dati: è proprio questo il punto, ma coglie impreparate molte persone. E se usi la versione web, il fornitore ti manda codice nuovo ogni volta che la apri, quindi un fornitore che decidesse di agire in malafede (o fosse costretto a farlo) potrebbe mandarti una versione che ruba la tua password. Con le app desktop e mobile è più difficile riuscirci.

    Troverai anche l'espressione «crittografia ad accesso zero», che alcuni fornitori usano per i dati che arrivano leggibili (per esempio una normale email in entrata) e vengono cifrati con la tua chiave appena ricevuti. Non confondere niente di tutto questo con le prove a conoscenza zero, la matematica dietro alcune criptovalute pensate per la privacy: stesso nome, idea diversa.
  client-side encryption: crittografia lato client
  zero-access encryption: crittografia ad accesso zero
