  # The glossary, translated by hand
  Two-factor authentication: Двухэтапная аутентификация
  Logging in with your password plus a second thing, like a code from your phone or a security key, so a stolen password isn't enough.: Вход не только с паролем, но и со вторым подтверждением, например кодом с телефона или ключом безопасности, чтобы одного украденного пароля было мало.
  ? |
    With two-factor authentication, someone who steals your password still can't get in without your
    second factor. That might be a code texted to you, a code from an authenticator app, a prompt on
    your phone or a hardware security key. Turn it on for anything that matters, starting with your
    email, since that's where most password resets go.

    The options aren't equal. SMS codes are the weakest, because attackers can talk your mobile
    network into moving your number to their SIM (a SIM swap), but they still beat nothing.
    Authenticator apps are better. Phone prompts can be abused by attackers who spam you with
    requests until you tap "approve". Passkeys and hardware security keys are the strongest, since
    they won't work on a fake site.

    Whatever you use, save the backup codes somewhere safe, or a lost phone can mean a lost account.
    Keeping your 2FA codes in the same password manager as your passwords is convenient, but if that
    one vault is ever compromised, both factors go with it.
  : |-
    С двухэтапной аутентификацией тот, кто украдёт ваш пароль, всё равно не сможет войти без второго фактора. Это может быть код в SMS, код из приложения-аутентификатора, запрос на телефоне или аппаратный ключ безопасности. Включите её везде, где это важно, и начните с почты, ведь большинство писем для сброса пароля приходит именно туда.

    Способы не равноценны. Самые слабые — коды из SMS, потому что злоумышленники могут уговорить вашего оператора связи перенести номер на их SIM-карту (так называемый SIM-свопинг), но даже они лучше, чем ничего. Приложения-аутентификаторы надёжнее. Запросами на телефоне можно злоупотребить: атакующий шлёт их один за другим, пока вы не нажмёте «Подтвердить». Лучше всего защищают ключи доступа и аппаратные ключи безопасности: на поддельном сайте они просто не сработают.

    Что бы вы ни выбрали, сохраните резервные коды в надёжном месте, иначе вместе с телефоном можно потерять и аккаунт. Хранить коды 2FA в том же менеджере паролей, что и сами пароли, удобно, но если это единственное хранилище когда-нибудь взломают, в чужих руках окажутся сразу оба фактора.
  2FA: 2FA
  MFA: MFA
  multi-factor authentication: многофакторная аутентификация
  two-step verification: двухфакторная аутентификация
  Anonymity, pseudonymity and privacy: Анонимность, псевдонимность и приватность
  Privacy hides what you do, anonymity hides who you are, and pseudonymity puts a consistent made-up name between you and what you do.: Приватность скрывает, что вы делаете, анонимность — кто вы, а псевдонимность ставит между вами и вашими действиями постоянное вымышленное имя.
  ? |
    These get mixed up all the time. Privacy is keeping what you do between you and the people you
    choose, like your messages, files and browsing. Anonymity is nobody knowing who did something,
    even if what was done is public. Pseudonymity sits in between: you act under a consistent name
    that isn't your real one, like a username, so people can recognise you without knowing who you
    are.

    You can have one without the others. An end-to-end encrypted chat with a friend is private but
    not anonymous, since you both know who's on the other end. A post made through Tor on a public
    forum can be anonymous but not private. Most online accounts are pseudonymous, and a pseudonym
    is only as good as the weakest link back to you, like a reused email address, a payment or a
    slip in something you post.

    Real anonymity is hard, and usually takes several tools plus careful habits - a VPN or a "no
    sign-up" app won't get you there alone. Work out which of the three you actually need, as it
    changes which tools make sense.
  : |-
    Эти понятия постоянно путают. Приватность — это когда то, что вы делаете, остаётся между вами и теми, кого вы сами выбрали: например ваши сообщения, файлы и то, какие сайты вы посещаете. Анонимность — это когда никто не знает, кто что-то сделал, даже если само действие у всех на виду. Псевдонимность находится посередине: вы действуете под постоянным именем, которое не совпадает с настоящим, например под ником, и вас могут узнавать, не зная, кто вы на самом деле.

    Одно вполне может быть и без двух других. Переписка с другом со сквозным шифрованием приватна, но не анонимна: вы оба знаете, кто на другом конце. Пост на открытом форуме, опубликованный через Tor, может быть анонимным, но не приватным. Большинство аккаунтов в интернете псевдонимны, а псевдоним надёжен ровно настолько, насколько надёжна самая слабая ниточка, ведущая к вам, — например повторно использованный адрес почты, платёж или случайная оговорка в том, что вы публикуете.

    Настоящая анонимность даётся трудно и обычно требует нескольких инструментов и аккуратных привычек — одного VPN или приложения «без регистрации» тут не хватит. Разберитесь, что из этих трёх вещей вам на самом деле нужно, ведь от этого зависит, какие инструменты имеют смысл.
  Browser fingerprinting: Цифровой отпечаток браузера
  Identifying you by combining lots of small details about your browser and device, which works without cookies and survives clearing them.: Сочетание множества мелких деталей о браузере и устройстве, по которому вас можно узнать без всяких файлов cookie и даже после того, как вы их удалите.
  ? |
    Any page you load can read dozens of small details about your browser: screen size, time zone,
    language, installed fonts, tiny differences in how your hardware draws graphics (canvas
    fingerprinting) and plenty more. None of them identifies you on its own, but together they're
    often close to unique, so trackers can recognise you across sites and visits without storing
    anything on your device.

    That's what makes it awkward. Clearing cookies or opening a private window doesn't change your
    fingerprint, and a VPN only changes your IP address. Piling on extensions and unusual settings
    can make you stand out more, not less.

    There are two main defences. One is to look like everyone else, which is what Tor Browser does
    by making its users as alike as possible. The other is to randomise some of those details so
    your fingerprint keeps changing. You can see how your own browser does with the EFF's
    [Cover Your Tracks](https://coveryourtracks.eff.org/).
  : |-
    Любая страница, которую вы открываете, может считать десятки мелких деталей о вашем браузере: размер экрана, часовой пояс, язык, установленные шрифты, крошечные различия в том, как ваше железо отрисовывает графику (отпечаток canvas), и многое другое. Ни одна из них сама по себе вас не выдаёт, но вместе они часто почти уникальны, поэтому трекеры могут узнавать вас на разных сайтах и при повторных визитах, ничего не сохраняя на вашем устройстве.

    В этом-то и загвоздка. Очистка cookie или приватное окно ваш отпечаток не меняют, а VPN меняет только IP-адрес. А если обвешать браузер расширениями и необычными настройками, можно, наоборот, сильнее выделиться.

    Есть два основных способа защиты. Первый — выглядеть как все: этим путём идёт Tor Browser, который старается сделать своих пользователей как можно более похожими друг на друга. Второй — подменять часть этих деталей случайными значениями, чтобы отпечаток постоянно менялся. Проверить, как с этим справляется ваш браузер, можно с помощью [Cover Your Tracks](https://coveryourtracks.eff.org/) от EFF.
  device fingerprinting: цифровой отпечаток устройства
  Custom ROM: Кастомная прошивка
  A replacement version of Android you install yourself, often with Google's apps and services stripped out to cut down on tracking.: Альтернативная версия Android, которую вы устанавливаете сами, часто без приложений и сервисов Google, чтобы за вами меньше следили.
  ? |
    A custom ROM is an alternative version of Android, built from Google's open source code but put
    together by someone else. Many are "de-Googled", meaning they leave out Google Play Services,
    the background layer that runs with deep access on most Android phones. Installing one usually
    wipes your phone and means switching off its bootloader lock, which normally only lets the
    maker's own software start up.

    There are trade-offs. Some apps lean on Play Services for notifications, maps or payments and
    break or complain without it, though some ROMs offer workarounds like an open source stand-in or
    a sandboxed copy of Google's own. Banking and payment apps may refuse to run at all. Not every
    ROM is as secure as the stock software, either - some can't turn the bootloader lock back on,
    which makes it easier for someone who gets hold of your phone to tamper with it.

    Device support matters most. Check that your exact model is officially supported, how quickly
    security updates arrive and whether the project's still active, since a ROM that stops getting
    updates can leave you worse off than the stock software it replaced.
  : |-
    Кастомная прошивка — это альтернативная версия Android, построенная на открытом исходном коде Google, но собранная кем-то другим. Многие такие прошивки «очищены от Google»: в них нет сервисов Google Play — фоновой прослойки, которая на большинстве Android-телефонов работает с глубоким доступом к системе. Установка обычно стирает все данные с телефона и требует снять блокировку загрузчика, которая по умолчанию позволяет запускаться только родному ПО производителя.

    Без компромиссов не обойтись. Часть приложений полагается на сервисы Google Play для уведомлений, карт или платежей и без них ломается или ругается, хотя в некоторых прошивках есть обходные пути — например замена с открытым исходным кодом или копия оригинальных сервисов Google в песочнице. Банковские и платёжные приложения могут вообще отказаться запускаться. Да и не каждая прошивка так же безопасна, как стоковая, — в каких-то нельзя снова заблокировать загрузчик, и тому, кто доберётся до вашего телефона, будет проще что-нибудь в нём подменить.

    Важнее всего поддержка устройства. Проверьте, поддерживается ли официально именно ваша модель, как быстро приходят обновления безопасности и жив ли ещё проект, ведь прошивка, которая перестала получать обновления, может оставить вас в худшем положении, чем стоковая, которую она заменила.
  de-Googled phone: телефон без сервисов Google
  de-Googled Android: Android без Google
  Data broker: Брокер данных
  A company that collects personal information about you from lots of sources and sells or rents it to whoever's buying.: Компания, которая собирает личную информацию о вас из множества источников и продаёт её или открывает к ней доступ всем, кто готов заплатить.
  ? |
    Data brokers build profiles on people without ever dealing with them directly. They pull from
    public records, loyalty schemes, apps, online tracking, purchase histories and other companies'
    databases, then piece it all together: your name, addresses, phone numbers, age, likely income,
    interests and sometimes where you go.

    Those profiles get sold to advertisers, people-search sites, insurers and sometimes police or
    government agencies. You've almost certainly never heard of most of the companies involved,
    which is rather the point.

    You can ask brokers to delete your data - in the UK and EU you've got a legal right to, and some
    US states have similar laws - but there are hundreds of them and your details tend to reappear.
    Paid removal services send the requests for you, though they can't reach every broker. The
    longer-term fix is giving out less in the first place, with email aliases, virtual phone numbers
    and virtual cards.
  : |-
    Брокеры данных составляют профили людей, ни разу не имея с ними дела напрямую. Они черпают сведения из открытых реестров, программ лояльности, приложений, отслеживания в интернете, истории покупок и баз данных других компаний, а потом сводят всё воедино: ваше имя, адреса, номера телефонов, возраст, предполагаемый доход, интересы, а иногда и то, где вы бываете.

    Эти профили продают рекламодателям, сайтам для поиска людей, страховым компаниям, а иногда полиции или государственным ведомствам. О большинстве этих компаний вы почти наверняка никогда не слышали, и в этом, в общем-то, весь расчёт.

    Можно попросить брокеров удалить ваши данные — в Великобритании и ЕС у вас есть на это законное право, и в некоторых штатах США действуют похожие законы, — но брокеров сотни, а ваши данные имеют свойство всплывать снова. Платные сервисы удаления отправят запросы за вас, хотя и они дотянутся не до всех брокеров. Если думать наперёд, лучше с самого начала оставлять о себе меньше сведений: заводить почтовые псевдонимы, виртуальные номера телефонов и виртуальные карты.
  information broker: информационный брокер
  data aggregator: агрегатор данных
  Domain Name System: Система доменных имён
  The internet's phone book, which turns names like example.com into the IP addresses your device actually connects to.: Телефонный справочник интернета, который превращает имена вроде example.com в IP-адреса, к которым на самом деле подключается ваше устройство.
  ? |
    Before your device can load a site, it asks a DNS resolver for the site's IP address. By default
    that's usually your ISP's resolver, handed out by your router. Ordinary DNS isn't encrypted, so
    your ISP and anyone else on the network can see every domain you look up, even when the site
    itself uses HTTPS. Whoever runs the resolver can also log your lookups, block them or send you
    somewhere else.

    That's why your choice of resolver matters. Switching to a privacy-focused one (ideally over
    encrypted DNS) means your ISP isn't the one keeping a list, and many also block ads, trackers or
    malware for you. The new provider sees your lookups instead, so check its logging policy and
    where it's based.

    Running DNS for your own domain is a separate job, called DNS hosting. That's about publishing
    records so other people can find your website and email, rather than looking things up for
    yourself.
  : |-
    Прежде чем загрузить сайт, ваше устройство спрашивает у DNS-резолвера IP-адрес этого сайта. По умолчанию это обычно резолвер вашего интернет-провайдера: его адрес устройству сообщает роутер. Обычный DNS не шифруется, поэтому провайдер, да и вообще любой в той же сети, может видеть каждый домен, который вы запрашиваете, даже если сам сайт работает по HTTPS. А тот, кто управляет резолвером, может ещё и записывать ваши запросы, блокировать их или отправлять вас по другому адресу.

    Поэтому важно, каким резолвером вы пользуетесь. Если перейти на резолвер, сделанный с упором на приватность (в идеале через зашифрованный DNS), список ваших запросов будет вести уже не провайдер, а многие такие резолверы к тому же блокируют рекламу, трекеры или вредоносные программы. Правда, теперь ваши запросы видит новый сервис, так что проверьте, какие логи он ведёт и где базируется.

    Обслуживание DNS для собственного домена — отдельная задача, она называется DNS-хостингом. Тут речь о том, чтобы публиковать записи, по которым другие найдут ваш сайт и почту, а не искать адреса для себя.
  DNS: DNS
  DNS leak: Утечка DNS
  When your DNS lookups go around your VPN, usually to your ISP, giving away the sites you visit while you think you're covered.: Ситуация, когда DNS-запросы идут в обход VPN, обычно к вашему провайдеру, и выдают, какие сайты вы посещаете, пока вы думаете, что защищены.
  ? |
    On a VPN, your DNS lookups should go through the tunnel to the resolver your VPN uses. A DNS
    leak is when some of them go out the normal way instead, usually to your ISP. Your traffic's
    still encrypted, but your ISP gets a running list of the domains you're visiting, which is a
    good chunk of what you were trying to hide.

    Leaks usually come from your operating system doing its own thing: sending lookups out over
    every network connection it has, using IPv6 when the VPN only handles IPv4, or sticking with a
    DNS server you set by hand.

    Good VPN apps have leak protection built in and switched on. To check, connect to your VPN and
    run a DNS leak test - if any of the servers it lists belong to your ISP, you've got a leak. A
    kill switch that blocks everything outside the tunnel usually stops it too.
  : |-
    Когда вы подключены к VPN, DNS-запросы должны идти через туннель к резолверу, которым пользуется VPN. Утечка DNS — это когда часть из них уходит обычным путём, как правило к вашему интернет-провайдеру. Трафик по-прежнему зашифрован, но провайдер получает постоянно пополняемый список доменов, которые вы посещаете, а это немалая часть того, что вы пытались скрыть.

    Обычно утечки случаются, когда операционная система действует по-своему: рассылает запросы через все сетевые подключения, какие у неё есть, использует IPv6, хотя VPN работает только с IPv4, или держится за DNS-сервер, который вы указали вручную.

    В хороших VPN-приложениях защита от утечек встроена и сразу включена. Чтобы проверить, подключитесь к VPN и пройдите тест на утечку DNS — если среди серверов, которые он покажет, есть серверы вашего провайдера, у вас утечка. Обычно её также предотвращает kill switch, который блокирует всё за пределами туннеля.
  End-to-end encryption: Сквозное шифрование
  Encryption where only the people at each end hold the keys, so the company in the middle can't read your messages or files.: Шифрование, при котором ключи есть только у тех, кто находится на обоих концах, так что компания посередине не может прочитать ваши сообщения или файлы.
  ? |
    With end-to-end encryption, your message is encrypted on your device and only decrypted on the
    recipient's. The service in between just passes along scrambled data it has no key for, so
    anything it leaks in a breach or is forced to hand over is gibberish. The Signal Protocol is the
    best-known way of doing it, and plenty of apps use it.

    What it doesn't hide is metadata - who you talked to, when and how often. It can't help if
    someone gets into your phone, and it won't stop the person you're talking to from taking
    screenshots. Backups are a common gap too: if your chat history goes to the cloud without the
    same encryption, that copy isn't protected.

    In a closed source app you're taking the company's word that it's really end-to-end, so look for
    open source apps, a published security audit and a way to check you're talking to the right
    person (usually by comparing a safety number or scanning a QR code). Be wary of "encrypted" on
    its own, as it often only means encrypted in transit, which the company can still read.
  : |-
    При сквозном шифровании сообщение шифруется на вашем устройстве и расшифровывается только на устройстве получателя. Сервис посередине лишь передаёт дальше нечитаемую мешанину, ключа от которой у него нет, так что всё, что утечёт при взломе или что его заставят выдать, окажется абракадаброй. Самый известный способ это сделать — протокол Signal, и им пользуются многие приложения.

    А вот метаданные сквозное шифрование не скрывает — с кем вы общались, когда и как часто. Оно не поможет, если кто-то доберётся до вашего телефона, и не помешает собеседнику делать скриншоты. Ещё одна частая дыра — резервные копии: если история чатов уходит в облако без такого же шифрования, эта копия не защищена.

    В приложении с закрытым исходным кодом остаётся верить компании на слово, что шифрование действительно сквозное, поэтому выбирайте приложения с открытым кодом, ищите опубликованный аудит безопасности и возможность убедиться, что вы общаетесь именно с тем, с кем нужно (обычно для этого сверяют код безопасности или сканируют QR-код). Если сервис пишет просто «зашифровано», это повод насторожиться: часто имеется в виду лишь шифрование при передаче, а при нём компания всё равно может прочитать ваши данные.
  E2EE: E2EE
  E2E encryption: E2E-шифрование
  Email alias: Почтовый псевдоним
  A separate email address that forwards to your real inbox, so each site gets its own address and you can switch it off if it gets spammed.: "Отдельный адрес почты, который пересылает письма в ваш настоящий ящик: у каждого сайта свой адрес, и если на него посыплется спам, его можно отключить."
  ? |
    An alias is an address that just forwards mail to your real inbox. Use a different one for every
    site and your real address never gets out. If one starts getting spam, you'll know exactly who
    leaked or sold it, and you can turn that alias off without touching anything else. Many alias
    services also let you reply from the alias, so the other side never sees your real address.

    Aliases make it much harder for data brokers and marketers to join up your accounts by email
    address, and they limit the fallout when a site gets breached. Plus addressing
    (`yourname+shop@example.com`) is a weaker version of the same trick, as your real address is
    right there for anyone who strips off the plus bit.

    The alias provider sees every email that passes through, so pick one you'd trust with your
    inbox. Using your own domain means you can switch providers later without losing your aliases,
    and some services will encrypt forwarded mail with your PGP key. Aliases aren't the same as
    disposable inboxes, which are often public and short-lived.
  : |-
    Псевдоним — это адрес, который просто пересылает письма в ваш настоящий ящик. Заведите отдельный для каждого сайта, и ваш настоящий адрес никуда не утечёт. Если на какой-то из них начнёт приходить спам, вы будете точно знать, кто слил или продал этот адрес, и сможете отключить именно его, больше ничего не трогая. Многие сервисы псевдонимов позволяют ещё и отвечать с псевдонима, так что собеседник никогда не увидит ваш настоящий адрес.

    С псевдонимами брокерам данных и маркетологам гораздо сложнее связать ваши аккаунты между собой по адресу почты, а когда какой-нибудь сайт взламывают, ущерб оказывается меньше. Плюс-адресация (`yourname+shop@example.com`) — более слабый вариант того же приёма, ведь ваш настоящий адрес сразу виден любому, кто отрежет часть с плюсом.

    Сервис псевдонимов видит каждое письмо, которое через него проходит, поэтому выбирайте тот, которому доверили бы свой почтовый ящик. С собственным доменом можно потом сменить сервис, не потеряв псевдонимы, а некоторые сервисы умеют шифровать пересылаемые письма вашим PGP-ключом. Псевдонимы — не то же самое, что одноразовые ящики, которые часто открыты всем и живут недолго.
  masked email: скрытый адрес почты
  forwarding address: адрес для пересылки
  email aliasing: почтовые алиасы
  DNS over HTTPS and DNS over TLS: DNS over HTTPS и DNS over TLS
  Ways of encrypting your DNS lookups, so your ISP or the network you're on can't read or tamper with them on the way to the resolver.: Способы шифровать DNS-запросы, чтобы ваш провайдер или сеть, к которой вы подключены, не могли прочитать или подменить их по пути к резолверу.
  ? |
    Both protect your lookups between your device and the resolver. DNS over HTTPS (DoH) sends them
    as ordinary web traffic, which makes it harder to spot or block. DNS over TLS (DoT) uses its own
    port, which is tidier but easier for a network to block. DNSCrypt is an older protocol that does
    a similar job. Most browsers and operating systems support at least one of them, and on Android
    it's the "Private DNS" setting.

    They only hide your lookups from the network in between. The resolver still sees every one, so
    you need to trust whoever runs it. Your ISP can also still see the IP addresses you connect to,
    and often the site's name too, which goes out unencrypted at the start of most secure
    connections. It's a sensible upgrade, but it won't hide your browsing on its own.

    If you use a VPN, your lookups already travel inside the tunnel, so the VPN's own resolver is
    usually the simplest choice.
  : |-
    Оба протокола защищают ваши запросы на пути между устройством и резолвером. DNS over HTTPS (DoH) отправляет их как обычный веб-трафик, поэтому его сложнее распознать или заблокировать. DNS over TLS (DoT) использует собственный порт: это решение чище, но и сети проще его заблокировать. DNSCrypt — более старый протокол, который решает похожую задачу. Большинство браузеров и операционных систем поддерживают хотя бы один из них, а на Android это настройка «Частный DNS-сервер».

    Они скрывают ваши запросы только от сети посередине. Резолвер по-прежнему видит каждый из них, так что тому, кто им управляет, нужно доверять. Провайдер к тому же всё ещё видит IP-адреса, к которым вы подключаетесь, а часто и имя сайта, которое в начале большинства защищённых соединений передаётся незашифрованным. Это разумное улучшение, но само по себе оно не скроет, по каким сайтам вы ходите.

    Если вы пользуетесь VPN, ваши запросы и так идут внутри туннеля, поэтому проще всего обычно положиться на собственный резолвер VPN.
  DoH: DoH
  DoT: DoT
  encrypted DNS: зашифрованный DNS
  Encryption at rest: Шифрование при хранении
  Encrypting data while it's stored on a disk, phone or server, so it's unreadable if the hardware is lost, stolen or thrown out.: Шифрование данных, пока они хранятся на диске, телефоне или сервере, чтобы их нельзя было прочитать, если устройство потеряют, украдут или выбросят.
  ? |
    Encryption at rest protects stored data. On your own devices that means full-disk encryption: if
    your laptop's nicked or your phone goes missing, nobody can read what's on it without your
    password or PIN. Phones do it by default these days, and the main desktop operating systems have
    it built in, though it isn't always switched on.

    It does most of its work while the device is off or locked. Once you've logged in, your data is
    readable to you and to any malware you've picked up. For online services, "encrypted at rest"
    usually means the company encrypts its disks and keeps the keys itself. That stops someone
    walking out of a data centre with a hard drive, but the company can still read your data, and so
    can anyone with a court order.

    If you want a provider that can't read your stuff, you need zero-knowledge or end-to-end
    encryption instead, or to encrypt files yourself before you upload them.
  : |-
    Шифрование при хранении защищает данные, которые где-то лежат. На ваших собственных устройствах это полное шифрование диска: если у вас стащат ноутбук или потеряется телефон, без вашего пароля или PIN-кода никто не сможет прочитать, что на нём. На телефонах оно сейчас работает по умолчанию, а в основных настольных операционных системах встроено, хотя и не всегда включено.

    Больше всего пользы от него, пока устройство выключено или заблокировано. Как только вы вошли в систему, данные доступны и вам, и любой вредоносной программе, которую вы успели подхватить. У онлайн-сервисов «зашифровано при хранении» обычно значит, что компания шифрует свои диски, а ключи держит у себя. Это спасает от того, кто вынесет из дата-центра жёсткий диск, но сама компания по-прежнему может читать ваши данные, как и любой, у кого есть постановление суда.

    Если вы хотите, чтобы сервис не мог прочитать ваши данные, ищите вместо этого шифрование с нулевым разглашением или сквозное шифрование либо шифруйте файлы сами, прежде чем их загружать.
  storage encryption: шифрование накопителей
  full-disk encryption: полное шифрование диска
  Encryption in transit: Шифрование при передаче
  Encrypting data while it travels between your device and a server, so people on the network can't read it, though the server still can.: Шифрование данных на пути между вашим устройством и сервером, чтобы их не могли прочитать другие в сети, хотя сам сервер всё равно может.
  ? |
    Encryption in transit protects data on its way from A to B. It's what the S in HTTPS is about:
    TLS (the successor to SSL) encrypts the connection, so your ISP, the coffee shop Wi-Fi or anyone
    else in the middle can't read or change what you send. Almost every site and app uses it now,
    and one that doesn't is a red flag.

    But it stops at the server. The company decrypts your data when it arrives and can read, scan or
    store it, or be made to hand it over. So when a service says your data is "encrypted", that
    often just means this, maybe with encryption at rest on top. For a provider that can't read your
    stuff, you need end-to-end or zero-knowledge encryption.

    Email is a special case. Mail between providers is usually encrypted in transit too, but only
    when both servers support it, so some messages still cross the internet in plain text. Even when
    it's encrypted, every server that handles it can read it.
  : |-
    Шифрование при передаче защищает данные на пути из точки А в точку Б. Именно за это отвечает буква S в HTTPS: TLS (преемник SSL) шифрует соединение, поэтому ни ваш провайдер, ни Wi-Fi в кофейне, ни кто-либо ещё посередине не может прочитать или изменить то, что вы отправляете. Сейчас его используют почти все сайты и приложения, и если где-то его нет, это тревожный знак.

    Но на сервере оно заканчивается. Компания расшифровывает ваши данные, когда они приходят, и может их прочитать, просканировать и сохранить, а её могут и заставить их выдать. Так что, когда сервис пишет, что ваши данные «зашифрованы», часто имеется в виду только это, возможно, ещё и с шифрованием при хранении. Если вам нужен сервис, который не сможет прочитать ваши данные, ищите сквозное шифрование или шифрование с нулевым разглашением.

    С почтой отдельная история. Письма между почтовыми сервисами обычно тоже шифруются при передаче, но только если это поддерживают оба сервера, и часть писем до сих пор идёт через интернет открытым текстом. И даже если письмо зашифровано, его может прочитать каждый сервер, через который оно проходит.
  TLS encryption: TLS-шифрование
  SSL encryption: SSL-шифрование
  transport encryption: транспортное шифрование
  Federation: Федерация
  Lots of independently run servers that talk to each other, so you can pick (or run) your own server and still reach everyone else.: Множество независимых серверов, которые общаются друг с другом, так что вы можете выбрать свой сервер (или запустить собственный) и всё равно связываться со всеми остальными.
  ? |
    Email is the classic example of federation: you can be with one provider and email someone with
    another, and neither of them is in charge. Matrix (for chat) and Mastodon (for social media)
    work the same way, each made up of thousands of servers that speak a shared protocol. Mastodon
    and everything else built on ActivityPub are known together as the fediverse.

    No single company owns the network, so nobody can sell it, fill it with ads or lock you in, and
    if you don't like your server's rules you can move. The flip side is that your server's admins
    can see anything it stores unencrypted, and whatever you send to people on other servers gets
    copied there too. Deleting it later asks those servers to delete their copies, but nothing
    forces them to.

    So pick a server run by people you trust, or run your own. And check what's end-to-end
    encrypted - on some federated platforms private messages are, and on others the admins of both
    servers can read them.
  : |-
    Классический пример федерации — электронная почта: вы можете пользоваться одним почтовым сервисом и писать тому, кто пользуется другим, и при этом ни один из них не главный. Так же устроены Matrix (чаты) и Mastodon (соцсеть): каждая из этих сетей состоит из тысяч серверов, которые работают по общему протоколу. Mastodon и всё остальное, что построено на ActivityPub, вместе называют федиверсом.

    Сеть не принадлежит какой-то одной компании, поэтому никто не может её продать, напичкать рекламой или привязать вас к себе, а если вам не нравятся правила вашего сервера, можно переехать. Обратная сторона в том, что администраторы вашего сервера видят всё, что он хранит в незашифрованном виде, а всё, что вы отправляете людям на других серверах, копируется и туда. Если потом это удалить, тем серверам уйдёт просьба удалить свои копии, но ничто не обязывает их это делать.

    Так что выбирайте сервер, который держат люди, которым вы доверяете, или запустите собственный. И проверьте, что именно защищено сквозным шифрованием — на одних федеративных платформах личные сообщения зашифрованы, а на других их могут читать администраторы обоих серверов.
  federated networks: федеративные сети
  Five Eyes and Fourteen Eyes: Пять глаз и Четырнадцать глаз
  An intelligence-sharing alliance between the UK, US, Canada, Australia and New Zealand, plus wider groups known as the Nine and Fourteen Eyes.: Альянс по обмену разведданными между Великобританией, США, Канадой, Австралией и Новой Зеландией, а также более широкие группы, известные как «Девять глаз» и «Четырнадцать глаз».
  ? |
    The [Five Eyes](https://en.wikipedia.org/wiki/Five_Eyes) grew out of the UKUSA Agreement of
    1946, and today the UK, US, Canada, Australia and New Zealand share signals intelligence through
    it. Wider, looser groups have been reported too. The Nine Eyes adds Denmark, France, the
    Netherlands and Norway, and the Fourteen Eyes adds Belgium, Germany, Italy, Spain and Sweden.

    You'll see it all over VPN marketing, usually as "based outside the 14 Eyes". These countries do
    work closely together, and some have sweeping surveillance laws. But it isn't a magic line.
    Intelligence agencies spy on foreign communications anyway, and every country has some way of
    making a business on its own soil cooperate.

    What a provider can be forced to hand over, and what it actually keeps, matter far more than
    which list its country is on. A service that only ever holds encrypted data it can't read is in
    a much better spot wherever it's based.
  : |-
    Альянс [«Пять глаз»](https://en.wikipedia.org/wiki/Five_Eyes) вырос из соглашения UKUSA 1946 года, и сегодня через него Великобритания, США, Канада, Австралия и Новая Зеландия обмениваются данными радиоэлектронной разведки. Сообщалось также о более широких, но менее тесных группах. В «Девять глаз» входят ещё Дания, Франция, Нидерланды и Норвегия, а в «Четырнадцать глаз» — вдобавок Бельгия, Германия, Италия, Испания и Швеция.

    В рекламе VPN это название встречается сплошь и рядом, обычно в духе «мы находимся за пределами „14 глаз“». Эти страны действительно тесно сотрудничают, а в некоторых из них приняты законы о слежке с очень широкими полномочиями. Но это не волшебная граница. Разведки и так шпионят за зарубежными коммуникациями, а у любой страны найдётся способ заставить компанию на своей территории пойти навстречу.

    Куда важнее не то, в каком списке страна сервиса, а то, что его можно заставить выдать и что он на самом деле хранит. Сервис, который хранит лишь зашифрованные данные, недоступные ему самому, находится в гораздо лучшем положении, где бы он ни базировался.
  FVEY: FVEY
  5 Eyes: 5 глаз
  14 Eyes: 14 глаз
  Forward secrecy: Прямая секретность
  Giving each session or message its own short-lived keys, so a key stolen later can't decrypt all your old conversations.: Отдельные временные ключи для каждого сеанса или сообщения, благодаря которым украденный позже ключ не позволит расшифровать все ваши старые разговоры.
  ? |
    Without forward secrecy, everything encrypted with a long-term key is only as safe as that key.
    If someone records your encrypted traffic today and steals the key in five years, they can go
    back and decrypt all of it. With forward secrecy, each session (or, in good messaging apps, each
    message) uses short-lived keys that get thrown away, so old traffic stays scrambled even if a
    long-term key leaks.

    Modern HTTPS (TLS 1.3) has it built in, and so does the Signal Protocol, which goes a step
    further and can recover after a key's been stolen, so future messages become safe again. PGP
    email doesn't have forward secrecy, which is one of the main criticisms of it.

    It's not something you can usually switch on yourself, as it's down to the protocol an app uses.
    When you're comparing messaging apps, having it is a good sign the encryption is modern and well
    designed.
  : |-
    Без прямой секретности всё, что зашифровано долговременным ключом, защищено ровно настолько, насколько защищён этот ключ. Если кто-то запишет ваш зашифрованный трафик сегодня, а через пять лет украдёт ключ, он сможет вернуться к записи и расшифровать её целиком. С прямой секретностью каждый сеанс (а в хороших мессенджерах — каждое сообщение) использует временные ключи, которые потом удаляются, так что старый трафик остаётся нечитаемым, даже если долговременный ключ утечёт.

    Она встроена в современный HTTPS (TLS 1.3) и в протокол Signal, который идёт ещё дальше и умеет восстанавливаться после кражи ключа: следующие сообщения снова оказываются в безопасности. У почты с PGP прямой секретности нет, и это одна из главных претензий к PGP.

    Обычно её нельзя включить самостоятельно: всё зависит от протокола, на котором работает приложение. Если вы сравниваете мессенджеры, её наличие — хороший признак того, что шифрование там современное и хорошо продуманное.
  perfect forward secrecy: совершенная прямая секретность
  PFS: PFS
  Free and open source software: Свободное и открытое ПО
  Software that's free as in freedom - you can run, study, change and share it - which in practice nearly always means open source too.: Программы, которые дают вам свободу запускать, изучать, менять и распространять их, а на практике это почти всегда означает и открытый исходный код.
  ? |
    The "free" in FOSS is about freedom, not price, or as the old line goes, "free as in speech, not
    as in beer". The Free Software Foundation
    [defines it](https://www.gnu.org/philosophy/free-sw.html) as four freedoms: to run the program
    however you like, to study and change how it works, to share copies, and to share your changed
    versions. FLOSS (free/libre and open source software) means the same thing, with "libre" added
    to dodge the price confusion.

    In practice, nearly all free software is open source and the other way round. The difference is
    mostly philosophy: free software folk see it as an ethical issue, open source folk as a better
    way to build software. Licences split along a different line. Copyleft licences like the GPL
    make anyone who distributes a changed version share their code on the same terms, while
    permissive ones like MIT let people make closed versions.

    The AGPL goes a step further and covers software run as an online service, so anyone hosting a
    modified version has to offer its users the source. On Android, the F-Droid app store only lists
    FOSS apps, and flags the ones with tracking or other anti-features.
  : |-
    Слово «free» в FOSS — про свободу, а не про цену, или, как гласит старая присказка, «free — как в „свободе слова“, а не как в „бесплатном пиве“». Фонд свободного программного обеспечения [определяет свободное ПО](https://www.gnu.org/philosophy/free-sw.html) через четыре свободы: запускать программу как угодно, изучать и менять то, как она работает, делиться копиями и делиться своими изменёнными версиями. FLOSS (free/libre and open source software) означает то же самое, а слово «libre» в нём добавлено, чтобы не путали с ценой.

    На практике почти всё свободное ПО открыто, и наоборот. Разница в основном философская: сторонники свободного ПО видят в этом вопрос этики, а сторонники открытого ПО — лучший способ разрабатывать программы. Лицензии же делятся по другому признаку. Копилефтные лицензии вроде GPL обязывают каждого, кто распространяет изменённую версию, открыть свой код на тех же условиях, а пермиссивные, такие как MIT, позволяют делать закрытые версии.

    AGPL идёт ещё дальше и распространяется на программы, которые работают как онлайн-сервис, так что любой, кто размещает у себя изменённую версию, должен предоставить её пользователям исходный код. На Android магазин приложений F-Droid публикует только FOSS-приложения и помечает те, в которых есть слежка или другие антифункции.
  FOSS: FOSS
  FLOSS: FLOSS
  free software: свободное ПО
  libre software: свободные программы
  Hardware security key: Аппаратный ключ безопасности
  A small USB or NFC device you tap to log in, which proves it's really you and won't work on phishing sites.: "Небольшое USB- или NFC-устройство, которым вы подтверждаете вход одним касанием: оно доказывает, что это действительно вы, и не сработает на фишинговом сайте."
  ? |
    A hardware security key is a small device, usually on your keyring, that plugs into a USB port
    or taps against your phone over NFC. It holds cryptographic keys that never leave it, so malware
    on your computer can't copy them. You can use it as a second factor alongside your password, or
    on newer keys to hold passkeys and skip the password entirely.

    Like passkeys, security keys check the website's real address before they'll sign you in, so
    they're one of the few logins that phishing can't easily beat. That's why they're the usual
    advice for anyone likely to be targeted, like journalists, activists or people with money or
    access worth stealing. Some can also generate TOTP codes, hold PGP keys or work as a smart card.

    Buy two and register both, and keep the spare somewhere safe, because losing your only key means
    relying on recovery codes (or getting locked out). Check that the services you care about
    support them and let you add more than one. Keys only have room for a limited number of
    passkeys, so check the spec if you plan to store a lot.
  : |-
    Аппаратный ключ безопасности — это небольшое устройство, которое обычно висит на связке ключей. Его вставляют в USB-порт или прикладывают к телефону, чтобы он подключился по NFC. Внутри хранятся криптографические ключи, которые никогда его не покидают, поэтому вредоносная программа на компьютере не сможет их скопировать. Его можно использовать как второй фактор вместе с паролем, а на более новых ключах — хранить ключи доступа и обходиться вовсе без пароля.

    Как и ключи доступа, ключи безопасности проверяют настоящий адрес сайта, прежде чем пустить вас внутрь, поэтому это один из немногих способов входа, которые с помощью фишинга так просто не обойти. Вот почему их обычно советуют тем, кто может стать мишенью: журналистам, активистам или людям, чьи деньги или доступ стоят того, чтобы их украсть. Некоторые ключи умеют ещё и генерировать TOTP-коды, хранить PGP-ключи или работать как смарт-карта.

    Купите два ключа и зарегистрируйте оба, а запасной храните в надёжном месте: если потерять единственный ключ, придётся полагаться на коды восстановления (а то и вовсе остаться без доступа). Проверьте, что нужные вам сервисы поддерживают такие ключи и позволяют добавить больше одного. На ключе помещается ограниченное число ключей доступа, так что, если собираетесь хранить их много, загляните в характеристики.
  security key: ключ безопасности
  FIDO key: FIDO-ключ
  U2F key: U2F-ключ
  Jurisdiction: Юрисдикция
  The country whose laws a service has to follow, which decides who can demand your data and what the company can be made to do.: "Страна, законам которой должен подчиняться сервис: от неё зависит, кто может потребовать ваши данные и что компанию могут заставить сделать."
  ? |
    A service's jurisdiction is the country (or countries) whose laws it has to follow, usually
    where it's registered plus wherever it has servers or staff. Those laws decide whether it can be
    made to hand over your data, keep logs it otherwise wouldn't, monitor a particular user, or keep
    quiet about any of it. They also set your rights - in the UK and EU, for example, you can ask
    for a copy of your data or have it deleted.

    Privacy-focused companies often base themselves somewhere with strong privacy laws, and say so
    loudly. That's a real plus, but it has limits. Providers in privacy-friendly countries have
    still been ordered to log specific users, and police in one country can ask another to get data
    on their behalf.

    Jurisdiction matters most when a company holds data it can read. If your data's end-to-end
    encrypted and the provider keeps little else, there's much less for any court to get hold of.
  : |-
    Юрисдикция сервиса — это страна (или страны), законам которой он должен подчиняться: обычно та, где он зарегистрирован, плюс те, где у него есть серверы или сотрудники. От этих законов зависит, могут ли его заставить выдать ваши данные, вести логи, которые он иначе не вёл бы, следить за конкретным пользователем или молчать обо всём этом. Они же определяют ваши права — например, в Великобритании и ЕС можно запросить копию своих данных или потребовать их удалить.

    Компании, которые делают ставку на приватность, часто регистрируются там, где действуют строгие законы о защите данных, и громко об этом заявляют. Это настоящий плюс, но у него есть пределы. Сервисам из стран, где с приватностью всё хорошо, всё равно предписывали вести логи по конкретным пользователям, а полиция одной страны может попросить другую страну добыть данные за неё.

    Юрисдикция важнее всего, когда у компании есть данные, которые она может прочитать. Если ваши данные защищены сквозным шифрованием, а больше сервис почти ничего не хранит, любому суду достанется гораздо меньше.
  Kill switch: Kill switch
  A VPN setting that cuts off your internet if the VPN connection drops, so nothing gets sent outside the tunnel.: Настройка VPN, которая отключает интернет, если соединение с VPN оборвётся, чтобы ничего не ушло за пределы туннеля.
  ? |
    VPN connections drop more often than you'd think, like when you switch networks, wake your
    laptop or a server goes down. Without a kill switch your device just carries on over your normal
    connection, often without telling you, and your real IP address and browsing are out in the
    open. A kill switch blocks all traffic until the VPN's back.

    They're not all equal. Some only work while the VPN app's running, so if the app crashes, your
    protection goes with it. Better ones set firewall rules in your operating system that stay in
    place even if the app doesn't, and some block traffic from the moment your device starts up. On
    Android, look for the built-in "Always-on VPN" and "Block connections without VPN" settings.

    Check whether it's on by default, since it isn't always. Some apps also have a stricter mode
    that blocks everything unless the VPN's connected, even after you've switched the VPN off
    yourself.
  : |-
    Соединение с VPN обрывается чаще, чем кажется: например, когда вы переключаетесь между сетями, выводите ноутбук из сна или падает сервер. Без kill switch устройство просто продолжает работать через обычное подключение, часто ничего вам не сообщая, и ваш настоящий IP-адрес и то, что вы делаете в интернете, оказываются у всех на виду. Kill switch блокирует весь трафик, пока VPN не подключится снова.

    Но не все они одинаково хороши. Некоторые работают, только пока запущено приложение VPN, так что, если оно упадёт, защита пропадёт вместе с ним. Те, что получше, задают правила брандмауэра в операционной системе, и эти правила продолжают действовать, даже когда приложение перестаёт работать, а некоторые блокируют трафик с самого включения устройства. На Android ищите встроенные настройки «Постоянная VPN» и «Блокировать соединения без VPN».

    Проверьте, включён ли он по умолчанию: так бывает не всегда. В некоторых приложениях есть и более строгий режим, который блокирует всё, пока VPN не подключён, даже если вы сами его выключили.
  VPN kill switch: аварийный выключатель VPN
  Know your customer: Знай своего клиента
  The identity checks that banks, card providers and crypto exchanges have to run before you can use them, usually with a photo ID.: Проверка личности, которую банки, сервисы платёжных карт и криптобиржи обязаны провести, прежде чем вы сможете ими пользоваться, обычно по документу с фотографией.
  ? |
    KYC rules are there to fight fraud and money laundering, and they apply to most regulated
    financial services, including banks, card issuers, payment apps and big crypto exchanges.
    Signing up means handing over your name, address and date of birth, often with a photo of your
    ID and a selfie, and the company has to keep those records for years.

    For privacy, that means your real identity is tied to everything you do on the service, and
    copies of your ID are stored in a database that could leak (and some have). Some services
    outside finance ask for ID too, like phone number providers in countries where the law requires
    it.

    Doing without KYC, legally, usually means smaller amounts and fewer features: cash, prepaid
    cards with low limits, peer-to-peer crypto trading or services that don't ask. The rules vary a
    lot by country, so check what applies where you are.
  : |-
    Правила KYC нужны для борьбы с мошенничеством и отмыванием денег и распространяются на большинство регулируемых финансовых сервисов, включая банки, эмитентов карт, платёжные приложения и крупные криптобиржи. При регистрации приходится сообщать имя, адрес и дату рождения, часто вместе с фотографией документа и селфи, а компания обязана хранить эти данные годами.

    Для приватности это значит, что ко всему, что вы делаете в сервисе, привязана ваша настоящая личность, а копии ваших документов лежат в базе данных, которая может утечь (и такие базы уже утекали). Документы просят и некоторые сервисы за пределами финансовой сферы, например те, кто выдаёт телефонные номера, в странах, где этого требует закон.

    Если обходиться без KYC и не нарушать закон, обычно приходится мириться с меньшими суммами и меньшим числом функций: это наличные, предоплаченные карты с низкими лимитами, P2P-торговля криптовалютой или сервисы, которые не спрашивают документов. Правила сильно различаются от страны к стране, так что проверьте, что действует у вас.
  KYC: KYC
  ID verification: верификация личности
  Metadata: Метаданные
  Data about your data - who you contacted, when, from where and on what device - rather than what you actually said or saved.: Данные о ваших данных — с кем вы связывались, когда, откуда и с какого устройства, — а не то, что вы на самом деле сказали или сохранили.
  ? |
    Metadata is everything around the content. For a message, that's who sent it to whom, when, how
    often and from which IP address. For a photo, it's often baked into the file as EXIF data: the
    phone or camera model, the time it was taken and sometimes the exact GPS location. Office
    documents can carry your name, your organisation and leftover comments or tracked changes.

    It's easy to shrug off, but it adds up fast. Who you talk to and where you go can reveal more
    than the messages themselves, which is why so much surveillance collects it. Michael Hayden, a
    former head of the NSA, once said "we kill people based on metadata", and he wasn't joking.

    End-to-end encryption protects the content, not usually the metadata, so messaging apps vary a
    lot in how much of it they can see or keep. With email, the servers always see who it's from,
    who it's to and when, encrypted or not. For files, strip the metadata before you share them -
    some sites remove EXIF data from uploads, but they may keep it for themselves.
  : |-
    Метаданные — это всё, что окружает содержимое. У сообщения это то, кто его кому отправил, когда, как часто и с какого IP-адреса. У фотографии они часто вшиты в сам файл в виде данных EXIF: модель телефона или камеры, время съёмки, а иногда и точное местоположение по GPS. В офисных документах могут оказаться ваше имя, название вашей организации и забытые примечания или исправления.

    От метаданных легко отмахнуться, но из мелочей быстро складывается многое. То, с кем вы общаетесь и где бываете, может рассказать о вас больше, чем сами сообщения, поэтому при слежке так часто собирают именно метаданные. Майкл Хейден, бывший глава АНБ, как-то сказал: «Мы убиваем людей на основании метаданных», — и он не шутил.

    Сквозное шифрование защищает содержимое, но обычно не метаданные, поэтому мессенджеры сильно отличаются друг от друга тем, сколько метаданных они видят или хранят. В случае с почтой серверы всегда видят, от кого письмо, кому и когда, зашифровано оно или нет. А из файлов удаляйте метаданные, прежде чем ими делиться, — некоторые сайты убирают данные EXIF из загруженных файлов, но могут оставить их себе.
  No-logs policy: Политика отсутствия логов
  A provider's promise not to keep records of what you do on its service, most often made by VPNs and DNS providers.: Обещание сервиса не хранить записи о том, что вы в нём делаете, — чаще всего его дают VPN- и DNS-сервисы.
  ? |
    A no-logs policy is a promise not to record what you get up to, like the sites you visit, the IP
    address you connect from, and when and for how long you're connected. It's most common with
    VPNs, where the provider can see all your traffic and says it won't keep any of it. It never
    means no data at all - they'll usually still have your account details and payment records, so
    read what the policy actually covers.

    The problem is you can't check it from the outside, and providers that advertised no logs have
    handed records to the police before. The best signs are independent audits (repeated, ideally),
    servers that run from memory so nothing survives a reboot, and real-world tests: court cases or
    server seizures where the provider had nothing to hand over.

    Even a perfect policy only covers the provider. Your ISP can still see that you're connected to
    a VPN, and the sites you visit can still log what you do once you get there.
  : |-
    Политика отсутствия логов — это обещание не записывать, чем вы занимаетесь: какие сайты посещаете, с какого IP-адреса подключаетесь, когда и сколько времени вы подключены. Чаще всего такое обещание дают VPN-сервисы: они видят весь ваш трафик и заявляют, что ничего из него не хранят. Но это никогда не означает, что данных нет вообще, — данные аккаунта и записи о платежах у сервиса обычно всё равно есть, так что прочитайте, на что на самом деле распространяется политика.

    Беда в том, что снаружи это не проверить, а сервисы, которые рекламировали отсутствие логов, уже передавали записи полиции. Лучшие признаки — независимые аудиты (в идеале неоднократные), серверы, которые работают только в оперативной памяти, и после перезагрузки на них ничего не остаётся, и проверка на практике: судебные дела или изъятия серверов, когда сервису оказалось нечего выдать.

    Даже идеальная политика касается только самого сервиса. Ваш интернет-провайдер всё равно видит, что вы подключены к VPN, а сайты, которые вы посещаете, по-прежнему могут записывать, что вы на них делаете.
  no-log policy: политика без логов
  zero-logs policy: политика zero-logs
  Open source: Открытый исходный код
  Software whose source code is public, under a licence that lets anyone read, use, change and share it.: Программы, исходный код которых опубликован под лицензией, разрешающей любому читать, использовать, изменять и распространять его.
  ? |
    Open source means the code is published under a licence that meets the
    [Open Source Definition](https://opensource.org/osd), so anyone can read it, use it, change it
    and pass it on. It doesn't have to be free of charge. For privacy tools that's the main draw,
    because people outside the company can check what the app really does with your data instead of
    taking the marketing's word for it.

    It's no guarantee, mind. Published code doesn't mean anyone's checked it, and serious bugs have
    gone unnoticed in popular open source projects for years. The app you download might not be
    built from exactly the code you can see, unless the project has reproducible builds that let
    people confirm it. With online services you also can't see what's running on their servers,
    which matters less if the app on your device encrypts everything before it leaves.

    When you're choosing, check which parts are actually open (the app, the server or both), what
    the licence is, and whether the project's still active. "Open source" in marketing sometimes
    means "some of it", so have a look at the code repository yourself.
  : |-
    Если у программы открытый исходный код, значит, он опубликован под лицензией, отвечающей требованиям [Open Source Definition](https://opensource.org/osd), и любой может его читать, использовать, изменять и передавать дальше. При этом программа не обязана быть бесплатной. Для инструментов приватности это главный плюс: люди со стороны могут проверить, что приложение на самом деле делает с вашими данными, а не верить рекламе на слово.

    Правда, это ещё не гарантия. То, что код опубликован, не значит, что его кто-то проверял, а серьёзные ошибки годами оставались незамеченными в популярных проектах с открытым кодом. Скачанное приложение может быть собрано не совсем из того кода, который вы видите, если только у проекта нет воспроизводимых сборок, позволяющих это проверить. А с онлайн-сервисами вы к тому же не видите, что работает у них на серверах, хотя это не так важно, если приложение на вашем устройстве шифрует данные ещё до отправки.

    При выборе проверьте, что именно открыто (приложение, сервер или и то и другое), какая у проекта лицензия и развивается ли он до сих пор. В рекламе «открытый исходный код» иногда означает «открыта только часть», так что загляните в репозиторий с кодом сами.
  open-source software: ПО с открытым исходным кодом
  OSS: OSS
  Passkeys: Ключи доступа (passkeys)
  A login that uses a cryptographic key stored on your device or in your password manager instead of a password, and resists phishing.: Способ входа, при котором вместо пароля используется криптографический ключ на вашем устройстве или в менеджере паролей. Такой вход устойчив к фишингу.
  ? |
    A passkey is a pair of keys made when you set one up for a site. The site keeps the public half,
    and the private half stays on your phone, computer, password manager or security key. To sign
    in, you confirm it's you with your fingerprint, face or PIN, and your device proves it has the
    private key without ever sending it. Your fingerprint never leaves your device either, and the
    whole thing runs on standards called FIDO2 and WebAuthn.

    The big win is phishing. A passkey is tied to the real website's address, so it just won't work
    on a lookalike site, however convincing it is. There's no password to reuse or to leak in a
    breach, because the site only stores the public key, which is no use to an attacker. Since you
    need both the device and your fingerprint or PIN, many sites also treat a passkey as two factors
    in one.

    Synced passkeys live in a password manager (including the one built into your phone) and get
    backed up with it, which is convenient but means trusting that provider. Device-bound ones stay
    on a single device or security key and can't be copied, so you'll want a backup way in. Before
    you go all in, check how your provider lets you move passkeys elsewhere.
  : |-
    Ключ доступа — это пара ключей, которая создаётся, когда вы добавляете его для сайта. Открытую половину хранит сайт, а закрытая остаётся на вашем телефоне, компьютере, в менеджере паролей или на ключе безопасности. Чтобы войти, вы подтверждаете отпечатком пальца, лицом или PIN-кодом, что это вы, и устройство доказывает, что закрытый ключ у него есть, но сам ключ никуда не отправляет. Отпечаток пальца тоже никогда не покидает ваше устройство. Всё это работает на стандартах FIDO2 и WebAuthn.

    Главный плюс — защита от фишинга. Ключ доступа привязан к настоящему адресу сайта, поэтому на сайте-подделке он просто не сработает, каким бы убедительным тот ни был. Пароля при этом нет, так что нечего использовать повторно и нечему утечь при взломе: сайт хранит только открытый ключ, а злоумышленнику от него никакого толку. Поскольку нужны и устройство, и отпечаток пальца или PIN-код, многие сайты засчитывают ключ доступа сразу за два фактора.

    Синхронизируемые ключи доступа хранятся в менеджере паролей (в том числе во встроенном в телефон) и попадают в его резервные копии. Это удобно, но значит, что приходится доверять этому сервису. А ключи, привязанные к устройству, хранятся только на нём или на ключе безопасности, и скопировать их нельзя, поэтому вам понадобится запасной способ войти. Прежде чем полностью переходить на ключи доступа, проверьте, как ваш сервис позволяет перенести их в другое место.
  Password manager: Менеджер паролей
  An app that creates, stores and fills in a different strong password for every account, all locked behind one master password.: Приложение, которое создаёт, хранит и подставляет свой надёжный пароль для каждого аккаунта, а все эти пароли защищены одним мастер-паролем.
  ? |
    Reusing passwords is how one breach turns into ten. A password manager fixes that by making a
    long random password for every site and remembering them all, so you only need one strong master
    password (a long passphrase works well). Most also fill in logins for you, sync across your
    devices, and can store passkeys, 2FA codes and notes.

    There are two main types. Cloud-based ones sync your vault through the provider's servers, which
    is convenient, and the good ones encrypt everything on your device first so the provider can't
    read it. Offline ones, like those using the KeePass format, keep your vault in a file you sync
    or back up yourself - more control, more faff.

    Whichever you go for, look for zero-knowledge encryption, a published security audit, open
    source code and an easy way to export everything if you ever want to leave. Turn on 2FA for the
    account itself. And remember the vault is only as strong as your master password - if it's weak
    and the encrypted vault ever gets stolen, it can be cracked offline.
  : |-
    Когда один пароль стоит на многих сайтах, одна утечка превращается в десять. Менеджер паролей решает эту проблему: он создаёт длинный случайный пароль для каждого сайта и помнит их все, так что вам нужен только один надёжный мастер-пароль (хорошо подойдёт длинная парольная фраза). Большинство менеджеров также сами подставляют данные для входа, синхронизируются между вашими устройствами и умеют хранить ключи доступа, коды двухэтапной аутентификации и заметки.

    Основных типов два. Облачные синхронизируют хранилище через серверы компании, и это удобно, а хорошие из них сначала шифруют всё на вашем устройстве, так что компания ничего не может прочитать. Офлайн-менеджеры, например те, что используют формат KeePass, держат хранилище в файле, синхронизацией и резервным копированием которого вы занимаетесь сами, — больше контроля, но и больше возни.

    Какой бы вы ни выбрали, обращайте внимание на шифрование с нулевым разглашением, опубликованный аудит безопасности, открытый исходный код и простой способ экспортировать всё, если когда-нибудь захотите уйти. Включите двухэтапную аутентификацию для самого аккаунта менеджера. И помните, что хранилище защищено не лучше, чем ваш мастер-пароль: если он слабый, а зашифрованное хранилище когда-нибудь украдут, его можно будет взломать офлайн.
  password vault: хранилище паролей
  Peer-to-peer: Пиринговая сеть
  Devices connecting straight to each other to share data, rather than going through a company's central server.: Сеть, в которой устройства обмениваются данными напрямую друг с другом, а не через центральный сервер компании.
  ? |
    In a peer-to-peer (P2P) network, devices talk to each other directly. There's no central server
    holding everyone's messages or files, so there's nothing for a company to scan, lose in a
    breach, hand over or shut down. BitTorrent is the famous example, and some messengers and file
    sync tools work the same way.

    The downside is that peers can usually see each other's IP addresses. With torrents the whole
    swarm can, which is how copyright firms find people. Some P2P messengers get round this by
    routing everything over Tor. Pure P2P can also mean both devices need to be online at once,
    which is why many apps also use servers for finding each other, notifications or relaying
    traffic when a direct connection fails.

    When an app says it's P2P, check what happens when a direct connection isn't possible, whether
    your IP address is shown to the people you talk to, and whether it's end-to-end encrypted.
  : |-
    В пиринговой (P2P) сети устройства общаются друг с другом напрямую. Нет центрального сервера, на котором лежат сообщения или файлы всех пользователей, а значит, компании нечего сканировать, терять при утечке, отдавать по запросу или закрывать. Самый известный пример — BitTorrent, но так же работают и некоторые мессенджеры и программы для синхронизации файлов.

    Минус в том, что узлы сети обычно видят IP-адреса друг друга. В торрентах их видят все участники раздачи, и именно так антипиратские компании находят людей. Некоторые P2P-мессенджеры обходят это, пропуская весь трафик через Tor. Кроме того, чистый P2P может требовать, чтобы оба устройства были в сети одновременно, поэтому многие приложения всё же подключают серверы: через них устройства находят друг друга, приходят уведомления, а если напрямую соединиться не удаётся, идёт трафик.

    Если приложение называет себя P2P, проверьте, что происходит, когда прямое соединение невозможно, видят ли ваш IP-адрес собеседники и есть ли сквозное шифрование.
  P2P: P2P
  PGP and OpenPGP: PGP и OpenPGP
  An encryption standard for email and files that uses a public key you share and a private key you keep, and can sign things too.: Стандарт шифрования почты и файлов, в котором открытым ключом вы делитесь, а закрытый храните у себя. Ещё с его помощью можно ставить подписи.
  ? |
    PGP (Pretty Good Privacy) dates back to 1991, and OpenPGP is the open standard that grew out of
    it. GnuPG, or GPG, is the most widely used free implementation, and lots of PGP tools are built
    on it. It works with a key pair: you share your public key so people can encrypt things to you,
    and keep your private key to decrypt them. You can also sign messages and files, which proves
    they came from you and haven't been changed.

    It's still used for encrypted email, and it's how many software projects sign their downloads so
    you can check you've got the real thing. But it has well-known gaps. With email, the sender,
    recipient and date stay visible, and depending on your app, so might the subject line. There's
    no forward secrecy, so if your private key is ever stolen, anyone holding copies of your old
    messages can read every one. And it's easy to get wrong - one unencrypted reply that quotes the
    whole thread gives the game away.

    Look for tools that make key management easy, keep your private key under your control (ideally
    on a hardware key for anything important), and help you check other people's key fingerprints.
    For chatting rather than email, a modern end-to-end encrypted messenger is usually a better fit.
  : |-
    PGP (Pretty Good Privacy) появился в 1991 году, а OpenPGP — открытый стандарт, который из него вырос. GnuPG, или GPG, — самая распространённая свободная реализация, и на ней построено множество PGP-инструментов. Работает всё на паре ключей: открытым вы делитесь, чтобы другие могли шифровать то, что отправляют вам, а закрытый храните у себя и расшифровываете им полученное. Ещё можно подписывать сообщения и файлы — подпись доказывает, что они от вас и их никто не менял.

    PGP до сих пор используют для зашифрованной почты, а многие проекты подписывают им файлы для скачивания, чтобы вы могли проверить, что скачали оригинал. Но у него есть известные слабые места. В письмах отправитель, получатель и дата остаются на виду, а в зависимости от почтового клиента — и тема. Прямой секретности в нём нет, так что если ваш закрытый ключ когда-нибудь украдут, любой, у кого сохранились копии ваших старых писем, сможет прочитать их все. И ошибиться тут легко: достаточно одного незашифрованного ответа с цитатой всей переписки, чтобы всё раскрыть.

    Выбирайте инструменты, в которых легко управлять ключами, закрытый ключ остаётся под вашим контролем (для всего важного — в идеале на аппаратном ключе безопасности), а отпечатки чужих ключей несложно сверить. Если же нужна не почта, а чат, обычно лучше подойдёт современный мессенджер со сквозным шифрованием.
  Pretty Good Privacy: Pretty Good Privacy
  GPG: GPG
  GnuPG: GnuPG
  Phishing: Фишинг
  Tricking you into handing over passwords, codes, money or personal details with a fake email, text, call or website.: Попытка выманить у вас пароли, коды, деньги или личные данные с помощью поддельного письма, SMS, звонка или сайта.
  ? |
    Phishing is one of the commonest ways accounts get broken into. You get an email, text or call
    that looks like it's from your bank, a delivery firm or your boss, with a reason to act right
    now and a link to a page that looks like the real thing. Anything you type there goes straight
    to the attacker. Phishing by text is called smishing, by phone it's vishing, and attacks
    tailored to one person are spear phishing.

    Modern phishing kits can pass what you type to the real site as you go, so they can grab SMS and
    authenticator codes as well as your password. The logins that resist it are passkeys and
    hardware security keys, which check the site's real address and refuse to work on a fake one.

    A password manager helps too, as it only fills in your login on the site it was saved for - if
    it doesn't offer to fill, treat that as a warning. Beyond that, be suspicious of urgency, go to
    sites directly rather than through links in messages, and check where a link really goes before
    you click.
  : |-
    Фишинг — один из самых частых способов взлома аккаунтов. Вам приходит письмо или SMS либо поступает звонок якобы от вашего банка, службы доставки или начальника: вас торопят что-то сделать прямо сейчас и дают ссылку на страницу, которая выглядит как настоящая. Всё, что вы там введёте, сразу попадает к злоумышленнику. Фишинг через SMS называют смишингом, по телефону — вишингом, а атаки, рассчитанные на конкретного человека, — целевым фишингом.

    Современные фишинговые наборы умеют на лету передавать всё, что вы вводите, настоящему сайту, поэтому перехватывают не только пароль, но и коды из SMS и приложений-аутентификаторов. Устойчивы к этому ключи доступа и аппаратные ключи безопасности: они проверяют настоящий адрес сайта и на поддельном работать отказываются.

    Менеджер паролей тоже помогает: он подставляет данные для входа только на том сайте, для которого они сохранены, и если он не предлагает их подставить, считайте это тревожным знаком. Кроме того, с подозрением относитесь к любой спешке, заходите на сайты напрямую, а не по ссылкам из сообщений, и прежде чем нажать на ссылку, проверяйте, куда она на самом деле ведёт.
  Proxy: Прокси
  A server that passes your requests on to the internet for you, so the sites you visit see the proxy's address instead of yours.: Сервер, который передаёт ваши запросы в интернет за вас, так что сайты видят адрес прокси, а не ваш.
  ? |
    A proxy sits between you and the sites you visit and fetches things on your behalf. Unlike a
    VPN, it usually only covers the apps you point at it, like your browser, and many don't add any
    encryption of their own. That makes proxies handy for specific jobs, like getting round a block,
    and a poor choice for hiding everything you do.

    The proxy operator can see where you're going and, for anything not on HTTPS, what you're doing,
    and can tamper with it. That's why free public proxies are such a bad idea: you've no idea who
    runs them, and some exist to collect data or inject ads and malware.

    Privacy front-ends work in a similar way. They're sites that load content from big platforms
    like YouTube or Reddit for you, so the platform sees the front-end's server rather than you.
    They cut out a lot of tracking, but whoever runs the instance can see what you look at, and they
    tend to break when the platform changes things.
  : |-
    Прокси стоит между вами и сайтами, которые вы открываете, и загружает всё за вас. В отличие от VPN, обычно он работает только для тех приложений, в которых вы его указали, например для браузера, а многие прокси не добавляют никакого собственного шифрования. Поэтому прокси удобны для конкретных задач вроде обхода блокировки, но плохо подходят, если нужно скрыть всё, что вы делаете.

    Владелец прокси видит, куда вы заходите, а на сайтах без HTTPS ещё и что вы там делаете, и может во всё это вмешаться. Вот почему бесплатные публичные прокси — такая плохая идея: вы понятия не имеете, кто их держит, а некоторые и создаются ради того, чтобы собирать данные или подмешивать рекламу и вредоносные программы.

    Похожим образом работают альтернативные фронтенды для приватности. Это сайты, которые загружают для вас контент с крупных платформ вроде YouTube или Reddit, так что платформа видит сервер фронтенда, а не вас. Они избавляют от значительной части слежки, но владелец сервера, через который вы заходите, видит, что вы смотрите, а ещё такие сайты часто ломаются, когда платформа что-то меняет.
  proxy server: прокси-сервер
  web proxy: веб-прокси
  Sandboxing: Изоляция в песочнице
  Running an app in a walled-off space with limited access to the rest of your system, so a bad or hacked app can only do so much damage.: Запуск приложения в отгороженном пространстве с ограниченным доступом к остальной системе, чтобы вредоносное или взломанное приложение не смогло навредить слишком сильно.
  ? |
    A sandbox limits what an app can touch, like your files, other apps, your camera or the network.
    If something inside it is malicious or gets hacked, the damage should stay inside the box. You
    use sandboxes all the time without noticing: phone apps each run in one, and browsers sandbox
    the code that runs web pages so a malicious site can't read your files.

    On a desktop you can go further. Linux has tools that sandbox individual programs, and app
    formats like Flatpak come with a permission system, though plenty of apps ask for far more
    access than they need. Virtual machines go further still by running a whole separate operating
    system, which is why they're popular for opening suspicious files or keeping different parts of
    your life in separate compartments.

    A sandbox is only as good as its rules. Broad permissions make it close to pointless, and bugs
    that let code escape do turn up, so keep things updated. It also can't protect anything you hand
    to the app inside it.
  : |-
    Песочница ограничивает, до чего может добраться приложение, — например, до ваших файлов, других приложений, камеры или сети. Если что-то внутри неё окажется вредоносным или будет взломано, ущерб не должен выйти за её пределы. Вы постоянно пользуетесь песочницами, даже не замечая этого: каждое приложение на телефоне работает в своей, а браузеры запускают в песочнице код веб-страниц, чтобы вредоносный сайт не мог прочитать ваши файлы.

    На компьютере можно пойти дальше. В Linux есть инструменты, которые запускают в песочнице отдельные программы, а форматы приложений вроде Flatpak поставляются с системой разрешений, хотя многие приложения запрашивают гораздо больше доступа, чем им нужно. Ещё дальше идут виртуальные машины: в них работает целая отдельная операционная система, поэтому их часто используют, чтобы открывать подозрительные файлы или чтобы разные сферы жизни не пересекались.

    Песочница хороша ровно настолько, насколько хороши её правила. При широких разрешениях от неё почти нет толку, а ошибки, которые позволяют коду вырваться наружу, действительно встречаются, так что не забывайте обновляться. И защитить то, что вы сами отдали приложению внутри неё, песочница тоже не может.
  sandbox: песочница
  app sandbox: песочница приложений
  Security audit: Аудит безопасности
  An outside firm checking an app's code, systems or policies for security holes and false claims, ideally with a public report.: Проверка, при которой сторонняя компания ищет в коде, системах или политиках приложения уязвимости и ложные заявления. В идеале по её итогам публикуют отчёт.
  ? |
    In a security audit, a company pays an independent firm to go through its code or systems
    looking for weaknesses, then (ideally) publishes the report. There are a few kinds: code
    reviews, penetration tests where the auditors actively try to break in, reviews of the
    cryptography, and policy audits like the no-logs audits VPN providers use to back up their
    claims.

    An audit is a snapshot. It only covers what was in scope at the time, and the app may have
    changed a lot since. It's also paid for by the company being audited, which doesn't make it
    worthless, but it's a good reason to read the details rather than trust a badge on the homepage.

    Good signs are a full public report rather than a summary, a well-known auditing firm, a recent
    date, a clear scope and a note of which issues got fixed. Regular audits over several years
    count for more than a single one from 2019. No audit doesn't mean unsafe - plenty of small open
    source projects can't afford one - but it does mean you're relying on whoever's read the code.
  : |-
    При аудите безопасности компания платит независимой фирме, чтобы та изучила её код или системы в поисках слабых мест, а затем (в идеале) публикует отчёт. Видов аудита несколько: проверка кода, тестирование на проникновение (аудиторы активно пытаются взломать систему), проверка криптографии и аудит политик — например, проверки политики отсутствия логов, которыми VPN-сервисы подкрепляют свои заявления.

    Аудит — это снимок на определённый момент. Он охватывает только то, что тогда входило в рамки проверки, а приложение с тех пор могло сильно измениться. К тому же за него платит сама проверяемая компания. Это не делает аудит бесполезным, но служит хорошим поводом вчитаться в подробности, а не верить значку на главной странице.

    О хорошем аудите говорят полный публичный отчёт вместо краткой выжимки, известная аудиторская фирма, свежая дата, чётко очерченные рамки и пометки о том, какие проблемы исправлены. Регулярные аудиты на протяжении нескольких лет значат больше, чем один-единственный аудит 2019 года. Если аудита нет, это ещё не значит, что приложение небезопасно (многим небольшим проектам с открытым кодом он не по карману), но значит, что вы полагаетесь на тех, кто читал код.
  independent audit: независимый аудит
  third-party audit: сторонний аудит
  Self-hosting: Селфхостинг
  Running an app or service on hardware you control, at home or on a rented server, instead of relying on someone else's.: Запуск приложения или сервиса на оборудовании, которым вы управляете (дома или на арендованном сервере), вместо того чтобы полагаться на чужой сервис.
  ? |
    Self-hosting means running the server side of something yourself, like your own cloud storage,
    password manager server, chat server or media library. It might live on an old laptop, a
    Raspberry Pi or a rented server. Your data stays somewhere you control, and no company can scan
    it, sell it, change the terms or shut the service down on you.

    The trade-off is that you're now the IT department. Updates, backups, security and fixing it at
    2am are all on you, and a neglected server is easy pickings. On a rented server the hosting
    company can get at your disk in principle, so encryption still matters. Email is notoriously
    hard to self-host well, since the big providers are quick to treat mail from small servers as
    spam.

    Stick to open source apps with clear docs, an active project and an easy way to update. If you'd
    rather not run it all yourself, plenty of privacy-focused services offer both - a hosted
    version, and the code to run your own.
  : |-
    Селфхостинг — это когда серверную часть чего-либо вы запускаете сами: собственное облачное хранилище, сервер менеджера паролей, чат-сервер или медиатеку. Всё это может работать на старом ноутбуке, Raspberry Pi или арендованном сервере. Ваши данные остаются там, где вы сами всё контролируете, и ни одна компания не сможет сканировать или продавать их, менять условия или закрыть сервис.

    Обратная сторона в том, что теперь вы сами себе IT-отдел. Обновления, резервные копии, безопасность и починка в два часа ночи — всё на вас, а заброшенный сервер — лёгкая добыча. На арендованном сервере хостинг-компания в принципе может добраться до вашего диска, так что шифрование по-прежнему важно. Почту, как известно, особенно трудно как следует поднять на своём сервере: крупные почтовые сервисы быстро записывают письма с небольших серверов в спам.

    Держитесь приложений с открытым кодом, у которых есть понятная документация и простой способ обновления, а сам проект активно развивается. А если вам не хочется заниматься всем этим самим, многие сервисы, ориентированные на приватность, предлагают и то и другое: готовую версию на своих серверах и код, чтобы запустить собственную.
  self-hosted: self-hosted
  Source-available software: ПО с доступным исходным кодом (source-available)
  Software whose code you can read, but under a licence that limits what you can do with it, so it doesn't count as open source.: Программы, код которых открыт для чтения, но лицензия ограничивает, что с ним можно делать, поэтому к открытому исходному коду они не относятся.
  ? |
    Source-available code is public, but the licence holds back some of the freedoms open source
    gives you. It might ban commercial use, stop you running it as a competing service, or forbid
    sharing changed versions. The Business Source License and the Server Side Public License are
    well-known examples, and neither is approved by the Open Source Initiative.

    For privacy, it gets you most of the way. You (or anyone) can still read the code and check what
    it does with your data, which is the main reason to care. What you lose is the safety net: if
    the company goes bust or goes bad, usually nobody else is allowed to pick up the code and carry
    on.

    Watch the wording. Some projects call themselves open source when the licence says otherwise,
    and code published with no licence at all is technically all rights reserved, even on GitHub. A
    few source-available licences turn into proper open source ones after a set number of years.
  : |-
    Такой код выложен в открытый доступ, но лицензия лишает вас части свобод, которые даёт открытый исходный код. Она может запрещать коммерческое использование, запуск программы как конкурирующего сервиса или распространение изменённых версий. Известные примеры — Business Source License и Server Side Public License, и ни одну из них Open Source Initiative не одобрила.

    Для приватности этого почти достаточно. Вы (или кто угодно) всё равно можете прочитать код и проверить, что программа делает с вашими данными, а ведь именно это здесь важнее всего. Чего вы лишаетесь, так это страховки: если компания разорится или начнёт вести себя недобросовестно, обычно никому больше не разрешено подхватить код и продолжить работу.

    Следите за формулировками. Некоторые проекты называют свой код открытым, хотя лицензия говорит обратное, а код, опубликованный вообще без лицензии, формально подпадает под «все права защищены», даже если лежит на GitHub. Есть и несколько лицензий с доступным исходным кодом, которые через заданное число лет превращаются в полноценные открытые.
  Telemetry: Телеметрия
  Data an app or operating system sends back to its maker about how you use it, what device you're on and what went wrong.: "Данные, которые приложение или операционная система отправляет разработчику: как вы им пользуетесь, с какого устройства и что пошло не так."
  ? |
    Telemetry ranges from harmless to nosy. A crash report that helps someone fix a bug is one
    thing. A steady stream of which buttons you click and what hardware you're on, tied to an ID
    that follows you around, is another. Most of it's on by default and buried a few menus deep, if
    it can be turned off at all.

    Even "anonymous" telemetry has to be sent from somewhere, so the server receiving it sees your
    IP address unless it goes through a proxy first. Windows, for one, lets you turn diagnostic data
    down but not off unless you're on an Enterprise or Education edition, which is why so many tools
    exist to block it.

    The better apps make telemetry opt-in, list exactly what gets sent, and publish code you (or
    someone else) can check. Open source apps can collect telemetry too, it's just harder to hide.
    Blocking it with a firewall or a DNS blocklist works for plenty of apps, though some break or
    nag you when they can't phone home.
  : |-
    Телеметрия бывает самой разной — от безобидной до такой, что суёт нос куда не следует. Отчёт о сбое, который помогает кому-то исправить ошибку, — это одно. Постоянный поток данных о том, на какие кнопки вы нажимаете и какое у вас железо, привязанный к идентификатору, который ходит за вами повсюду, — совсем другое. Чаще всего телеметрия включена по умолчанию, а выключатель спрятан где-то глубоко в меню, если он вообще есть.

    Даже «анонимную» телеметрию нужно откуда-то отправить, поэтому сервер, который её принимает, видит ваш IP-адрес, если она не проходит сначала через прокси. Windows, например, позволяет сократить сбор диагностических данных, но отключить его полностью можно только в редакциях Enterprise и Education — отсюда и столько программ, которые его блокируют.

    Приложения получше включают телеметрию только с вашего согласия, перечисляют, что именно отправляется, и публикуют код, который можете проверить вы или кто-то другой. Приложения с открытым кодом тоже могут собирать телеметрию, просто спрятать её труднее. Блокировка через файрвол или чёрные списки на уровне DNS помогает со многими приложениями, хотя некоторые ломаются или начинают донимать вас, когда не могут достучаться до своих серверов.
  diagnostic data: диагностические данные
  usage data: данные об использовании
  Third-party cookies: Сторонние файлы cookie
  Cookies set by a company other than the site you're on, usually an ad network, so it can recognise you on every site it's embedded in.: Файлы cookie, которые ставит не сайт, на котором вы находитесь, а другая компания, обычно рекламная сеть, чтобы узнавать вас на любом сайте, куда встроен её код.
  ? |
    A cookie is a small bit of data a website stores in your browser. First-party cookies come from
    the site you're actually on and do useful things like keep you logged in. Third-party cookies
    come from something embedded in the page, like an ad, a share button or an analytics script, and
    because the same company is embedded on thousands of sites, it can follow you from one to the
    next.

    Browsers have been clamping down on them. Safari blocks them by default, and Firefox gives every
    site its own separate cookie jar so they can't follow you around. Chrome still allows them
    unless you change the setting, after Google dropped its plan to phase them out.

    Blocking them doesn't stop tracking on its own, since fingerprinting, tracking from a site's own
    domain and being logged in to accounts all still work. In the UK and EU, sites need your consent
    for non-essential cookies, which is what those banners are for. "Reject all" turns most of them
    off, at least on sites that respect your choice.
  : |-
    Cookie — это небольшой фрагмент данных, который сайт сохраняет в вашем браузере. Собственные cookie ставит сам сайт, на котором вы находитесь, и они делают полезные вещи — например, сохраняют вход в аккаунт. Сторонние cookie приходят от того, что встроено в страницу: рекламы, кнопки «Поделиться» или скрипта аналитики. А поскольку код одной и той же компании стоит на тысячах сайтов, она может следить за вами, когда вы переходите с одного на другой.

    Браузеры всё жёстче их ограничивают. Safari блокирует их по умолчанию, а Firefox выделяет каждому сайту своё отдельное хранилище cookie, чтобы они не могли ходить за вами по пятам. Chrome по-прежнему их разрешает, если не поменять настройку: Google отказалась от плана постепенно их убрать.

    Сама по себе их блокировка слежку не останавливает: цифровой отпечаток браузера, отслеживание через собственный домен сайта и то, что вы вошли в свои аккаунты, — всё это по-прежнему работает. В Великобритании и ЕС сайтам нужно ваше согласие на необязательные cookie — ради этого и висят те самые баннеры. Кнопка «Отклонить все» отключает большую часть таких cookie, по крайней мере на сайтах, которые уважают ваш выбор.
  tracking cookies: отслеживающие файлы cookie
  cross-site cookies: межсайтовые файлы cookie
  Threat model: Модель угроз
  Working out what you're protecting, who from and how much hassle it's worth, so you pick tools that fit your real risks.: Разбор того, что вы защищаете, от кого и сколько хлопот это стоит, чтобы подобрать инструменты под ваши реальные риски.
  ? |
    A threat model is just a plan. You work out what you want to protect (your messages, your
    location, your identity), who you're protecting it from (advertisers, a nosy ex, scammers, a
    government), how likely that is, how bad it'd be if it went wrong, and how much effort you're
    prepared to put in. The EFF's Surveillance Self-Defense guide has a
    [good walk-through](https://ssd.eff.org/module/your-security-plan).

    Your answers decide what you need. Someone avoiding ad tracking needs a decent browser and an ad
    blocker. A journalist protecting sources needs a lot more, and shouldn't rely on any one tool.
    Most people are somewhere in between.

    It also stops you overdoing it. Every extra tool is something else to maintain and something
    else to break, and a setup that's a pain to live with tends to get abandoned. Pick protections
    that match the threats you actually face, and look at them again when your situation changes.
  : |-
    Модель угроз — это просто план. Вы прикидываете, что хотите защитить (переписку, местоположение, личность), от кого (от рекламодателей, любопытного бывшего, мошенников, государства), насколько это вероятно, насколько всё будет плохо, если что-то пойдёт не так, и сколько сил вы готовы на это потратить. В руководстве Surveillance Self-Defense от EFF есть [хороший пошаговый разбор](https://ssd.eff.org/module/your-security-plan).

    От ответов зависит, что вам нужно. Тому, кто хочет избежать рекламной слежки, нужны нормальный браузер и блокировщик рекламы. Журналисту, который защищает свои источники, нужно гораздо больше, и полагаться на какой-то один инструмент ему не стоит. Большинство людей где-то посередине.

    А ещё модель угроз не даёт перестараться. Каждый дополнительный инструмент — это ещё одна вещь, которую нужно поддерживать и которая может сломаться, а от защиты, с которой жить одно мучение, рано или поздно отказываются. Выбирайте защиту под те угрозы, с которыми вы действительно сталкиваетесь, и пересматривайте её, когда ваша ситуация меняется.
  threat modelling: моделирование угроз
  Tor and onion routing: Tor и луковая маршрутизация
  A free network that bounces your traffic through three volunteer-run relays, so no single one knows both who you are and where you're going.: Бесплатная сеть, которая пропускает ваш трафик через три узла, поддерживаемых добровольцами, так что ни один из них не знает одновременно, кто вы и на какой сайт заходите.
  ? |
    Tor wraps your traffic in three layers of encryption and sends it through three relays run by
    volunteers. Each relay peels off one layer (hence "onion"), so the first knows your IP address
    but not where you're going, and the last knows where you're going but not who you are.
    [Tor Browser](https://www.torproject.org/) is the easiest way in, and it also makes its users
    look as alike as possible, so you're harder to fingerprint.

    Onion services (the .onion addresses) never leave the Tor network, so both sides stay hidden.
    For ordinary sites, the last relay can see your traffic if the site doesn't use HTTPS. Tor is
    also slower than a normal connection, and some sites block it or pile on the CAPTCHAs.

    Your ISP can see that you're using Tor, though not what for, unless you connect through a bridge
    that disguises it. Tor can't protect you from yourself either - logging into your usual
    accounts, or opening a downloaded file outside Tor Browser, can give you away. Someone who can
    watch both ends of your connection at once may also be able to match up the traffic.
  : |-
    Tor заворачивает ваш трафик в три слоя шифрования и отправляет его через три узла, которые поддерживают добровольцы. Каждый узел снимает один слой (отсюда и сравнение с луковицей), поэтому первый узел знает ваш IP-адрес, но не видит, на какой сайт вы заходите, а последний видит сайт, но не знает, кто вы. Проще всего начать с [Tor Browser](https://www.torproject.org/), который к тому же делает своих пользователей максимально похожими друг на друга, так что вас сложнее опознать по цифровому отпечатку браузера.

    Onion-сервисы (адреса .onion) работают целиком внутри сети Tor, поэтому скрытыми остаются обе стороны. При заходе на обычные сайты последний узел может видеть ваш трафик, если сайт работает без HTTPS. Кроме того, Tor медленнее обычного подключения, а некоторые сайты его блокируют или заваливают капчами.

    Если вы не подключаетесь через мост, который маскирует Tor, ваш интернет-провайдер видит, что вы им пользуетесь, хотя и не знает, для чего. И от вас самих Tor тоже не защитит: вы можете выдать себя, если войдёте в привычные аккаунты или откроете скачанный файл вне Tor Browser. А тот, кто может наблюдать сразу за обоими концами вашего соединения, возможно, сумеет сопоставить трафик.
  The Onion Router: The Onion Router
  Terms of Service; Didn't Read: Terms of Service; Didn't Read
  A community project that reads the terms and privacy policies of websites and apps, and grades them from A (very good) to E (very bad).: Общественный проект, участники которого читают пользовательские соглашения и политики конфиденциальности сайтов и приложений и ставят им оценки от A (очень хорошо) до E (очень плохо).
  ? |
    Hardly anyone reads the terms they agree to, so [ToS;DR](https://tosdr.org/) reads them for you.
    Since 2012 its contributors have been going through the terms of service and privacy policies of
    sites and apps, picking out the parts that matter, like whether you can delete your account or
    whether your data gets shared with advertisers. Each point is labelled good, neutral, bad or,
    for the worst ones, a blocker.

    Those points add up to a grade from A, for very good, down to E, for very bad. Services with no
    reviewed points don't get one. It's a quick way to spot terms that let a company do things you'd
    object to.

    Treat it as a starting point. Reviews come from a community of contributors, so smaller services
    are often missing, and a company can change its terms after they've been reviewed. A grade is
    also about what the terms say, not how secure the service is or whether the company sticks to
    its word.
  : |-
    Почти никто не читает условия, на которые соглашается, поэтому [ToS;DR](https://tosdr.org/) читает их за вас. С 2012 года участники проекта разбирают пользовательские соглашения и политики конфиденциальности сайтов и приложений и выделяют то, что действительно важно, — например, можно ли удалить аккаунт и передаются ли ваши данные рекламодателям. Каждому пункту ставится метка: «хорошо», «нейтрально», «плохо» или, в самых плохих случаях, «неприемлемо».

    Из этих пунктов складывается оценка от A (очень хорошо) до E (очень плохо). Сервисы, у которых нет проверенных пунктов, оценку не получают. Это быстрый способ заметить условия, позволяющие компании делать то, с чем вы бы не согласились.

    Считайте это отправной точкой. Обзоры пишет сообщество участников, поэтому небольших сервисов там часто нет, а компания может изменить условия уже после того, как их разобрали. К тому же оценка говорит о том, что написано в условиях, а не о том, насколько безопасен сервис и держит ли компания слово.
  ToS;DR: ToS;DR
  TOSDR: TOSDR
  Time-based one-time password: Одноразовый пароль на основе времени
  The short-lived codes from an authenticator app, worked out from a secret shared with the site and the current time.: Коды из приложения-аутентификатора, которые действуют недолго и вычисляются из общего с сайтом секрета и текущего времени.
  ? |
    When you turn on app-based 2FA, the site shows you a QR code containing a secret key, which your
    authenticator app saves. From then on, the app and the site both combine that secret with the
    current time to work out the same short code, which usually changes every 30 seconds. It's all
    done offline, so your phone doesn't need signal and the app doesn't need an account.

    It's a big step up from SMS codes, since there's nothing for a SIM swap to intercept. It's not
    phishing-proof, though. If you type a code into a convincing fake login page, the attacker can
    pass it straight on to the real site while it's still valid. Anyone who gets hold of the secret
    (from a backup, say, or a screenshot of the QR code) can also make your codes until you reset
    2FA.

    Pick an authenticator app that lets you back up or export your accounts, ideally encrypted, so a
    lost or broken phone isn't a disaster. Some apps make it hard to get your secrets out, which
    feels secure right up until you change phones.
  : |-
    Когда вы включаете двухэтапную аутентификацию через приложение, сайт показывает QR-код с секретным ключом, и ваше приложение-аутентификатор его сохраняет. С этого момента и приложение, и сайт вычисляют из этого секрета и текущего времени один и тот же короткий код, который обычно меняется каждые 30 секунд. Всё это работает офлайн, так что телефону не нужна связь, а приложению — аккаунт.

    Это большой шаг вперёд по сравнению с кодами из SMS: при подмене SIM-карты перехватывать нечего. Но от фишинга это не защищает. Если вы введёте код на убедительной поддельной странице входа, злоумышленник может тут же передать его настоящему сайту, пока код ещё действует. А ещё любой, кто заполучит секрет (например, из резервной копии или со скриншота QR-кода), сможет генерировать ваши коды, пока вы не настроите двухэтапную аутентификацию заново.

    Выбирайте приложение-аутентификатор, которое позволяет делать резервные копии или экспортировать аккаунты, в идеале в зашифрованном виде, чтобы потерянный или сломанный телефон не обернулся катастрофой. Некоторые приложения не дают просто так достать секреты, и это кажется надёжным ровно до тех пор, пока вы не смените телефон.
  TOTP: TOTP
  authenticator codes: коды из приложения-аутентификатора
  Tracker: Трекер
  Code in a website, app or email that records what you do and reports it to another company, usually for advertising.: Код на сайте, в приложении или в письме, который записывает, что вы делаете, и сообщает об этом другой компании, обычно ради рекламы.
  ? |
    Trackers come in a few shapes. On websites, they're scripts and invisible images from ad
    networks and analytics firms, sometimes dozens on a single page. In apps, they're bits of code
    from those same companies that the developer has bundled in, and they get whatever access the
    app has. In emails, a tiny invisible image (a tracking pixel) tells the sender when you opened
    it, roughly where you were and what device you used.

    Because the same few companies are on so many sites and apps, they can follow you between them
    and build up a profile of your interests, habits and whereabouts. That profile is used for
    targeted ads, and some of it gets sold on to data brokers.

    Blocking them is one of the easier wins. Content blockers in your browser use filter lists of
    known trackers, DNS-level blockers do the same for every device on your network, and most email
    apps can stop remote images loading. Blockers only catch trackers they know about, and some
    sites now serve tracking from their own domain to get round them.
  : |-
    Трекеры бывают нескольких видов. На сайтах это скрипты и невидимые картинки от рекламных сетей и аналитических компаний, иногда десятки на одной странице. В приложениях это встроенные разработчиком фрагменты кода от тех же компаний, и им достаётся весь доступ, который есть у приложения. В письмах крошечная невидимая картинка (пиксель отслеживания) сообщает отправителю, когда вы открыли письмо, где вы примерно находились и с какого устройства.

    Поскольку одни и те же несколько компаний присутствуют на огромном числе сайтов и в множестве приложений, они могут следить за вами, пока вы переходите с сайта на сайт и из приложения в приложение, и составлять профиль ваших интересов, привычек и мест, где вы бываете. Этот профиль используют для таргетированной рекламы, а кое-что из него перепродают брокерам данных.

    Блокировать трекеры несложно, а польза от этого заметная. Блокировщики контента в браузере используют списки фильтров с известными трекерами, блокировщики на уровне DNS делают то же самое для всех устройств в вашей сети, а большинство почтовых приложений умеют не загружать внешние картинки. Но ловят они только известные им трекеры, а некоторые сайты теперь отдают скрипты отслеживания со своего домена, чтобы обойти блокировку.
  web tracker: веб-трекер
  ad tracker: рекламный трекер
  Virtual private network: Виртуальная частная сеть
  An encrypted tunnel from your device to a VPN provider's server, which hides your traffic from your network and your IP address from sites.: Зашифрованный туннель между вашим устройством и сервером VPN-сервиса. Он скрывает ваш трафик от сети, в которой вы находитесь, а ваш IP-адрес — от сайтов.
  ? |
    A VPN sends all your traffic through an encrypted tunnel to a server run by the VPN provider,
    and from there out to the internet. Your ISP, or the Wi-Fi network you're on, can see that
    you're using a VPN but not which sites you visit. The sites see the VPN server's IP address
    instead of yours.

    It doesn't make you anonymous. It moves your trust from your ISP to the VPN provider, who can
    now see everything your ISP used to. It won't stop cookies, browser fingerprinting or a site
    recognising you the moment you log in. It's good for hiding your IP address, using dodgy public
    Wi-Fi, getting round blocks and geo-restrictions, and keeping your browsing away from your ISP,
    and not much else.

    The provider matters more than the tech. Look for an audited no-logs policy, open source apps, a
    kill switch and leak protection, and a way to pay that doesn't tie the account to your name if
    that matters to you. Be wary of free VPNs, which have to pay for their servers somehow, often
    with your data.
  : |-
    VPN отправляет весь ваш трафик по зашифрованному туннелю на сервер VPN-сервиса, а оттуда — в интернет. Ваш интернет-провайдер или сеть Wi-Fi, к которой вы подключены, видят, что вы пользуетесь VPN, но не видят, какие сайты вы открываете. А сайты вместо вашего IP-адреса видят IP-адрес VPN-сервера.

    Анонимным VPN вас не делает. Он переносит ваше доверие с провайдера на VPN-сервис, который теперь видит всё, что раньше видел провайдер. Он не защитит от cookie и цифровых отпечатков браузера и не помешает сайту узнать вас, как только вы войдёте в аккаунт. VPN хорош, чтобы скрыть IP-адрес, пользоваться сомнительным публичным Wi-Fi, обходить блокировки и географические ограничения и прятать от провайдера, какие сайты вы посещаете, но кроме этого мало что даёт.

    Выбор сервиса важнее технологии. Ищите политику отсутствия логов, подтверждённую аудитом, приложения с открытым кодом, kill switch и защиту от утечек, а если для вас это важно, то и способ оплаты, который не привязывает аккаунт к вашему имени. Настороженно относитесь к бесплатным VPN: за серверы им как-то нужно платить, и часто они расплачиваются вашими данными.
  VPN: VPN
  Warrant canary: Warrant canary
  A regularly updated statement that a company hasn't received a secret government order, which it stops updating if it ever does.: Регулярно обновляемое заявление компании о том, что она не получала секретного распоряжения властей. Если такое распоряжение придёт, заявление просто перестанут обновлять.
  ? |
    Some government orders, like US National Security Letters, come with a gag order that stops the
    company telling anyone. A warrant canary is the workaround, named after the canaries miners used
    to take underground. The company regularly publishes a statement saying it hasn't received any
    such order, and if the statement disappears or stops being updated on schedule, you're meant to
    assume it has.

    It relies on the idea that a government can stop you saying something, but can't force you to
    keep saying something false. That's never really been tested in court, and some lawyers think
    pulling a canary could land a company in just as much trouble as speaking out.

    So treat a canary as a hint. Check that it's updated on a regular schedule and signed (often
    with PGP) so you know it's genuine. A lapsed canary can also just mean someone forgot to update
    it, so look for an explanation before you panic.
  : |-
    Некоторые распоряжения властей, например американские National Security Letters, сопровождаются запретом на разглашение, и компания не может никому о них рассказать. Warrant canary — способ обойти этот запрет. Название отсылает к канарейкам, которых шахтёры брали с собой под землю. Компания регулярно публикует заявление о том, что не получала таких распоряжений, и если оно исчезает или перестаёт вовремя обновляться, это следует понимать так, что получила.

    Вся идея держится на том, что государство может запретить вам что-то говорить, но не может заставить вас и дальше говорить неправду. В суде это толком ни разу не проверяли, и некоторые юристы считают, что снятая канарейка может доставить компании столько же неприятностей, сколько и прямое сообщение о полученном распоряжении.

    Так что воспринимайте канарейку как намёк. Проверьте, что её обновляют регулярно, по графику, и подписывают (часто с помощью PGP), чтобы вы знали, что она настоящая. А ещё просроченная канарейка может означать просто то, что кто-то забыл её обновить, так что, прежде чем паниковать, поищите объяснение.
  WebRTC leak: Утечка через WebRTC
  When a website uses your browser's built-in calling tech to find your real IP address, even though you're on a VPN or proxy.: Когда сайт с помощью встроенной в браузер технологии для звонков узнаёт ваш настоящий IP-адрес, хотя вы подключены через VPN или прокси.
  ? |
    WebRTC is the browser tech behind video calls and other live connections that work without a
    plugin. To connect people directly, it has to work out their IP addresses, and any website can
    ask it to do that with a few lines of code. A WebRTC leak is when that reveals an address you
    were hoping to hide.

    It mostly bites with browser proxy extensions and VPN setups that don't send everything through
    the tunnel, since WebRTC can go around them and expose your real public IP. A VPN app that
    routes all your traffic usually isn't affected. Most major browsers now hide your local network
    address from it by default, too.

    To check, visit a WebRTC leak test page while you're connected. If it shows your real IP, you
    can turn WebRTC off in some browsers (which breaks video calls in the browser), limit it with an
    extension, or fix the VPN so it covers everything.
  : |-
    WebRTC — это технология в браузере, на которой работают видеозвонки и другие соединения в реальном времени без всяких плагинов. Чтобы соединить людей напрямую, ей нужно выяснить их IP-адреса, и любой сайт может попросить её об этом несколькими строками кода. Утечка через WebRTC — это когда так раскрывается адрес, который вы надеялись скрыть.

    Чаще всего это проблема прокси-расширений для браузера и таких настроек VPN, при которых через туннель идёт не весь трафик: WebRTC может их обойти и раскрыть ваш настоящий публичный IP-адрес. VPN-приложения, которое пропускает через себя весь трафик, это обычно не касается. К тому же большинство крупных браузеров теперь по умолчанию скрывают от WebRTC ваш адрес в локальной сети.

    Чтобы проверить, откройте страницу теста на утечку через WebRTC, не отключаясь от VPN или прокси. Если она показывает ваш настоящий IP-адрес, в некоторых браузерах можно отключить WebRTC (тогда в браузере перестанут работать видеозвонки), ограничить его с помощью расширения или настроить VPN так, чтобы через него шло всё.
  WebRTC IP leak: утечка IP-адреса через WebRTC
  Zero-knowledge encryption: Шифрование с нулевым разглашением
  Encryption done on your device before anything's uploaded, so the provider can store and sync your data but has no way to read it.: Шифрование прямо на вашем устройстве, ещё до загрузки, поэтому сервис может хранить и синхронизировать ваши данные, но прочитать их никак не может.
  ? |
    Zero-knowledge is mostly a marketing term, but a useful one. Your files, notes or passwords are
    encrypted on your device with a key that comes from your password (or a key only you hold), and
    only the encrypted version is ever sent to the provider. They can store and sync it, but they
    can't read it, and neither can anyone who breaches them.

    Check what's actually covered, as your email address, file sizes, timestamps and sometimes file
    names can still be readable. Forget your password and there's usually no way to get your data
    back - that's the point, but it catches people out. And if you use the web app, the provider
    sends you fresh code every time you load it, so a provider that went bad (or was forced to)
    could serve a version that grabs your password. Desktop and mobile apps make that harder to pull
    off.

    You'll also see "zero-access encryption", which some providers use for data that arrives
    readable (an ordinary incoming email, say) and is encrypted with your key as soon as it lands.
    Don't confuse any of it with zero-knowledge proofs, the maths behind some privacy coins - same
    name, different idea.
  : |-
    «Нулевое разглашение» (zero-knowledge) — термин в основном маркетинговый, но полезный. Ваши файлы, заметки или пароли шифруются на вашем устройстве ключом, полученным из вашего пароля (или ключом, который есть только у вас), и сервису отправляется только зашифрованная версия. Он может её хранить и синхронизировать, но не может прочитать — как и любой, кто его взломает.

    Проверьте, что именно защищено: ваш адрес электронной почты, размеры файлов, временные метки, а иногда и имена файлов могут оставаться читаемыми. Если забудете пароль, данные обычно уже не вернуть — в этом весь смысл, но многих это застаёт врасплох. А если вы пользуетесь веб-версией, сервис присылает вам свежий код при каждой загрузке страницы, так что недобросовестный сервис (или тот, кого к этому вынудили) может подсунуть версию, которая перехватит ваш пароль. С приложениями для компьютера и телефона такое провернуть сложнее.

    Ещё встречается «шифрование с нулевым доступом»: так некоторые сервисы называют защиту данных, которые приходят к ним в читаемом виде (скажем, обычное входящее письмо) и сразу по прибытии шифруются вашим ключом. Не путайте всё это с доказательствами с нулевым разглашением — математикой, на которой держатся некоторые анонимные криптовалюты. Название то же, а идея другая.
  client-side encryption: шифрование на стороне клиента
  zero-access encryption: шифрование с нулевым доступом
