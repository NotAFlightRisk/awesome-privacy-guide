  the guides: ガイド記事
  The guides are our own. They're written and translated with some AI help, then checked against the sources linked at the bottom of each one, and rechecked at least every six months. If you spot a mistake in one, there's a link at the bottom of every guide to report it.: ガイドはこのサイト独自のものです。AIの手も少し借りて執筆と翻訳をしたあと、各ガイドの末尾にある出典と照らし合わせて確認し、少なくとも半年ごとに見直しています。間違いに気づいたら、各ガイドの末尾にあるリンクから報告してください。
  Everything else in other languages is machine translated with Azure Translator, so it might read a bit stiffly in places. App names are left as they are.: ガイド以外のページの翻訳はAzure Translatorによる機械翻訳なので、ところどころ不自然な表現があるかもしれません。アプリ名はそのままにしています。
  Privacy and security guides: プライバシーとセキュリティのガイド
  Plain-English guides to the privacy and security jobs worth doing, with the reasoning behind every step and apps from the Awesome Privacy list.: やっておく価値のあるプライバシーとセキュリティ対策を、わかりやすく説明したガイドです。どの手順にも理由を添え、アプリはAwesome Privacyのリストから紹介します。
  Each guide does one job properly or answers one question, with the reasoning behind every step. Any app it suggests comes from the list.: どのガイドも、1つの作業をきちんと終わらせるか、1つの疑問に答えるもので、どの手順にも理由を添えています。紹介するアプリはすべてリストに載っているものです。
