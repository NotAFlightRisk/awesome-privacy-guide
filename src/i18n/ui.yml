about.title: About this guide
about.description: What this site is, where its data comes from, and how the evidence on each page is put together.
about.lead: This is an independent, easier-to-browse guide to
about.lead.after: ", a free list of privacy-respecting software and services curated by Alicia Sykes and the community."
about.what.title: what this is
about.what.body: The list is great, but it's one very long page. This site splits it into topics, gives every app its own page, and adds pages for the apps you're trying to leave, side-by-side comparisons and a glossary. It isn't affiliated with the list or its maintainers, and every page links back to the original so you can check it or help improve it.
about.data.title: where the data comes from
about.data.body: Everything listed comes from awesome-privacy.yml in the list's GitHub repo, which is public domain (CC0). This site checks it for changes every day and rebuilds when it moves. Nothing gets added here - suggestions go to the list itself, as a pull request.
about.facts.title: how the evidence works
about.facts.body: The badges and the evidence panel only show what's on record somewhere you can check - the list's own fields (open source, audited, takes crypto), the repository on GitHub (licence, last commit, archived) and the grade from Terms of Service; Didn't Read. There's no scoring and no opinion, and a blank just means nothing's recorded.
about.guides.title: the guides
about.guides.body: The guides are our own. They're written and translated with some AI help, then checked against the sources linked at the bottom of each one, and rechecked at least every six months. If you spot a mistake in one, there's a link at the bottom of every guide to report it.
about.translations.title: translations
about.translations.guides: Everything else in other languages is machine translated with Azure Translator, so it might read a bit stiffly in places. App names are left as they are.
about.translations.body: English is the original. The other languages are machine translated with Azure Translator, so they might read a bit stiffly in places. App names are left as they are.
about.privacy.title: your privacy here
about.privacy.body: No cookies, no accounts and nothing stored about you. Visits are counted with a self-hosted, cookie-free Plausible, and if a page crashes, the error report goes to our own server with nothing personal in it.
